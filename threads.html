<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Threads — Sumoai's Reel</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,600;1,300&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{
  min-height:100vh;
  font-family:'Space Mono',monospace;
  overflow-x:hidden;
  position:relative;
  background:#000000;
  color:#F5F5F5;
}

.topnav{
  position:fixed;top:0;left:0;right:0;z-index:100;
  padding:16px 48px;
  display:flex;justify-content:space-between;align-items:center;
  background:rgba(10,10,12,0.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(255,255,255,0.09);
  backdrop-filter:blur(8px);
  border-bottom:1px solid rgba(255,255,255,0.1);
}
.logo{
  font-family:'Cormorant Garamond',serif;
  font-size:18px;font-weight:300;
  color:#fff;text-decoration:none;letter-spacing:0.04em;
}
.logo em{font-style:italic;color:#FFD4A8;}
nav{display:flex;flex-wrap:wrap;gap:6px;}
nav a{
  padding:6px 14px;
  border:1px solid rgba(160,50,0,0.5);
  border-radius:99px;font-size:9px;
  letter-spacing:0.1em;text-transform:uppercase;
  color:#fff;text-decoration:none;
  background:rgba(255,255,255,0.07);border-color:rgba(255,255,255,0.16);color:rgba(255,255,255,0.75);
  transition:background 0.2s;
}
nav a:hover,nav a.active{background:#F5F5F5;border-color:#F5F5F5;color:#0A0A0C;}
.page-content{
  position:relative;z-index:10;
  max-width:1100px;margin:0 auto;
  padding:110px 48px 80px;
}
.page-title{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(40px,7vw,72px);font-weight:300;
  color:#F5F5F5;line-height:1;margin-bottom:6px;
}
.page-title em{font-style:italic;color:#8E8E93;}
.page-label{
  font-size:10px;letter-spacing:0.2em;text-transform:uppercase;
  color:rgba(255,255,255,0.38);margin-bottom:40px;display:block;
}
.threads-wrap{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:28px;
}
.th-bg{position:fixed;inset:0;z-index:0;background:#000;overflow:hidden;pointer-events:none;}
.th-bg-svg{position:absolute;inset:0;width:100%;height:100%;display:block;}
.th-bg::after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.15) 0%,rgba(0,0,0,0.55) 100%);}
.thread-embed{width:100%;}
.thread-embed{position:relative;}
.th-del{position:absolute;top:8px;right:8px;z-index:5;background:rgba(180,40,40,0.85);border:none;border-radius:6px;color:#fff;font-size:12px;line-height:1;padding:5px 8px;cursor:pointer;opacity:0;transition:opacity .15s;}
.thread-embed:hover .th-del{opacity:1;}
.th-empty{text-align:center;padding:60px 0;color:rgba(255,255,255,0.45);font-size:13px;letter-spacing:0.08em;}
.th-fab{position:fixed;right:26px;bottom:96px;z-index:9000;width:56px;height:56px;border-radius:50%;border:none;cursor:pointer;background:linear-gradient(145deg,#3F3F46,#71717A);color:#fff;font-size:30px;line-height:1;box-shadow:0 6px 24px rgba(0,0,0,0.45);transition:transform .18s;}
.th-fab:hover{transform:scale(1.08);}
.th-modal{display:none;position:fixed;inset:0;z-index:11000;background:rgba(0,0,0,0.75);backdrop-filter:blur(6px);align-items:center;justify-content:center;padding:20px;}
.th-modal.open{display:flex;}
.th-box{background:#17171A;border:1px solid rgba(255,255,255,0.14);border-radius:16px;padding:26px;width:460px;max-width:94vw;position:relative;}
.th-box h2{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:300;color:#F2F2F2;margin-bottom:6px;letter-spacing:0.06em;}
.th-box p{font-size:11px;color:rgba(255,255,255,0.45);line-height:1.7;margin-bottom:16px;}
.th-input{width:100%;padding:11px 13px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.18);border-radius:9px;color:#F2F2F2;font-family:'Space Mono',monospace;font-size:12.5px;outline:none;box-sizing:border-box;}
.th-input:focus{border-color:rgba(255,255,255,0.42);}
.th-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:34px;}
.th-stat{background:rgba(255,255,255,0.045);border:1px solid rgba(255,255,255,0.09);border-radius:12px;padding:14px 16px;text-align:center;}
.th-stat-l{font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.4);margin-bottom:7px;}
.th-stat-v{font-family:'Cormorant Garamond',serif;font-size:29px;font-weight:600;color:#F5F5F5;line-height:1;}
.th-stat-s{font-size:10px;color:rgba(255,255,255,0.32);margin-top:6px;}
.th-nums{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.th-nums span{display:block;font-size:9.5px;letter-spacing:0.1em;color:rgba(255,255,255,0.38);margin-bottom:4px;}
.th-nums .th-input{padding:8px 9px;font-size:12px;text-align:center;}
.th-metrics{position:absolute;bottom:8px;left:8px;right:8px;z-index:5;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none;}
.th-m{background:rgba(0,0,0,0.66);color:rgba(255,255,255,0.82);font-family:'Space Mono',monospace;font-size:9.5px;letter-spacing:0.04em;padding:3px 7px;border-radius:5px;}
.th-edit{position:absolute;top:8px;right:38px;z-index:5;background:rgba(60,60,70,0.85);border:none;border-radius:6px;color:#fff;font-size:12px;line-height:1;padding:5px 8px;cursor:pointer;opacity:0;transition:opacity .15s;}
.thread-embed:hover .th-edit{opacity:1;}
@media(max-width:700px){.th-stats{grid-template-columns:repeat(2,1fr);}.th-nums{grid-template-columns:repeat(2,1fr);}}
.th-lbl{display:block;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:rgba(255,255,255,0.42);margin:14px 0 6px;}
.th-date{position:absolute;top:8px;left:8px;z-index:5;background:rgba(0,0,0,0.62);color:rgba(255,255,255,0.8);font-family:'Space Mono',monospace;font-size:10px;letter-spacing:0.06em;padding:4px 8px;border-radius:6px;pointer-events:none;}
.th-err{color:#ff7b7b;font-size:11px;min-height:15px;margin-top:6px;}
.th-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px;}
.th-btn{border-radius:9px;font-size:13px;padding:9px 20px;cursor:pointer;font-family:'Space Mono',monospace;border:1px solid rgba(255,255,255,0.16);background:transparent;color:rgba(255,255,255,0.6);}
.th-btn.primary{background:#71717A;border-color:#71717A;color:#fff;font-weight:700;}
.th-toast{position:fixed;bottom:170px;right:26px;z-index:12000;color:#fff;font-family:'Space Mono',monospace;font-size:13px;font-weight:700;padding:12px 20px;border-radius:10px;box-shadow:0 4px 20px rgba(0,0,0,0.45);opacity:0;transform:translateY(10px);transition:opacity .3s,transform .3s;pointer-events:none;max-width:320px;line-height:1.5;}
blockquote.text-post-media{
  background:#fff !important;
  border-color:rgba(120,70,20,0.15) !important;
  border-radius:16px !important;
  box-shadow:3px 5px 20px rgba(80,40,10,0.1) !important;
}
@media(max-width:700px){
  .topnav{padding:12px 20px;}
  .page-content{padding:90px 16px 60px;}
  nav a{padding:5px 10px;font-size:8px;}
  .threads-wrap{grid-template-columns:1fr;}
}

  /* ── 共用 Menubar ── */
  .global-menubar{
    position:fixed;top:0;left:0;right:0;z-index:9999;
    height:28px;
    background:rgba(0,0,0,0.55);
    backdrop-filter:blur(20px) saturate(180%);
    -webkit-backdrop-filter:blur(20px) saturate(180%);
    display:flex;align-items:center;justify-content:space-between;
    padding:0 16px;
    font-size:12px;color:rgba(255,255,255,0.92);
    letter-spacing:0.02em;
    font-family:'Space Mono',monospace;
  }
  .gm-left{display:flex;align-items:center;gap:14px;font-weight:600;}
  .gm-right{display:flex;align-items:center;gap:10px;font-size:11px;opacity:0.85;}
  .mb-menu{padding:0 6px;border-radius:4px;cursor:default;transition:background 0.15s;font-size:12px;}
  .mb-menu:hover{background:rgba(255,255,255,0.2);}

  /* ── 共用 Dock ── */
  


.global-dock-wrap{position:fixed;bottom:0;left:50%;transform:translateX(-50%) translateY(calc(100% - 2px));z-index:9998;transition:transform 0.35s cubic-bezier(0.34,1.2,0.64,1),opacity 0.3s;opacity:0;}
.global-dock-wrap.visible{transform:translateX(-50%) translateY(-12px);opacity:1;}
.global-dock{display:flex;align-items:flex-end;gap:8px;background:rgba(255,255,255,0.16);backdrop-filter:blur(28px);border:1px solid rgba(255,255,255,0.25);border-radius:20px 20px 0 0;padding:10px 14px 14px;box-shadow:0 -4px 30px rgba(0,0,0,0.25);}
.gd-item{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;position:relative;}
.gd-icon{width:52px;height:52px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;transition:transform 0.2s cubic-bezier(0.34,1.56,0.64,1);box-shadow:0 3px 12px rgba(0,0,0,0.28);}
.gd-item:hover .gd-icon{transform:translateY(-10px) scale(1.22);}
.gd-label{font-size:9px;letter-spacing:0.05em;color:rgba(255,255,255,0.8);text-transform:uppercase;opacity:0;transition:opacity 0.15s;white-space:nowrap;background:rgba(0,0,0,0.6);padding:2px 6px;border-radius:4px;position:absolute;bottom:-20px;font-family:'Space Mono',monospace;}
.gd-item:hover .gd-label{opacity:1;}
.gd-sep{width:1px;height:40px;background:rgba(255,255,255,0.2);margin:0 3px;align-self:center;}
.gd-dot{width:4px;height:4px;border-radius:50%;background:rgba(255,255,255,0.7);margin-top:2px;}
.ic-about{background:linear-gradient(145deg,#4F8EF7,#1A5FD4);}
.ic-ai{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-photos{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-dramas{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-food{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-threads{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-uber{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-weight{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-reminder{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-netflix{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-mlb{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-chloe{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.ic-trips{background:linear-gradient(145deg,#111,#1a1a1a);border:1px solid rgba(255,255,255,0.15);}
.dock-trigger-zone{position:fixed;bottom:0;left:0;right:0;height:8px;z-index:9997;}

/* ===== 手機版共用修正 ===== */
@media(max-width:768px){
  /* Dock 縮小，12 個項目完整顯示 */
  .global-dock-wrap{max-width:100vw;}
  .global-dock{gap:2px!important;padding:5px 6px!important;border-radius:14px!important;
    max-width:calc(100vw - 12px);overflow-x:auto;-webkit-overflow-scrolling:touch;}
  .global-dock::-webkit-scrollbar{display:none;}
  .gd-icon{width:29px!important;height:29px!important;border-radius:8px!important;font-size:15px!important;}
  .gd-icon svg{width:25px!important;height:25px!important;}
  .gd-icon span{font-size:17px!important;}
  .gd-item{flex-shrink:0;}
  .gd-item:hover .gd-icon{transform:translateY(-5px) scale(1.12)!important;}
  .gd-sep{height:22px!important;margin:0 1px!important;}
  .gd-label{display:none!important;}
  /* Menubar 精簡 */
  .menubar{font-size:10px!important;padding:0 8px!important;}
  .mb-menu{display:none!important;}
  .menubar-left{gap:8px!important;}
  .menubar-right{gap:7px!important;}
  /* 觸控目標加大 */
  button,.btn,a.btn{min-height:40px;}
  /* 內文最小字級，避免過小難讀 */
  body{-webkit-text-size-adjust:100%;}
  /* 表格一律可橫向捲動 */
  table{max-width:100%;}
  .table-wrap,.trip-table-wrap{overflow-x:auto!important;-webkit-overflow-scrolling:touch;}
  /* 圖片不溢出 */
  img,video,canvas{max-width:100%;height:auto;}
}
@media(max-width:420px){
  .gd-icon{width:26px!important;height:26px!important;border-radius:7px!important;}
  .gd-icon svg{width:22px!important;height:22px!important;}
  .gd-icon span{font-size:15px!important;}
  .global-dock{gap:1px!important;padding:4px 5px!important;}
  .gd-sep{height:19px!important;margin:0 1px!important;}
}
</style>

<script>
// 時鐘
(function(){
  function updateTime(){
    var el=document.getElementById('gmbTime');
    if(!el) return;
    var now=new Date();
    var d=['日','一','二','三','四','五','六'][now.getDay()];
    var h=String(now.getHours()).padStart(2,'0');
    var m=String(now.getMinutes()).padStart(2,'0');
    el.textContent='週'+d+' '+now.getMonth()+'/'+(now.getDate())+' '+h+':'+m;
  }
  updateTime();
  setInterval(updateTime,10000);
})();


</script>

<script>
const SUMOAI_TOKEN_KEY = 'sumoai_gh_token';
function getGHToken(){ return localStorage.getItem(SUMOAI_TOKEN_KEY)||null; }
function saveGHToken(t){ localStorage.setItem(SUMOAI_TOKEN_KEY, t.trim()); }
window.clearGHToken = function(){ localStorage.removeItem(SUMOAI_TOKEN_KEY); alert('Token 已清除，重新整理後重新輸入'); };
function showTokenModal(onSuccess){
  if(document.getElementById('_tokenModal')) return;
  var el=document.createElement('div');
  el.id='_tokenModal';
  el.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,0.85);z-index:999999;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(8px);font-family:sans-serif;';
  el.innerHTML='<div style="background:#1a1a1a;border:1px solid rgba(255,255,255,0.15);border-radius:16px;padding:32px;width:420px;max-width:92vw;"><div style="font-size:28px;margin-bottom:10px;">&#128273;</div><div style="color:#f0f0f0;font-size:17px;font-weight:500;margin-bottom:6px;">輸入 GitHub Token</div><div style="color:#888;font-size:13px;margin-bottom:20px;line-height:1.6;">輸入一次後本站所有分頁都能使用。<br>Token 只存在你的瀏覽器，不會上傳。</div><input id=\"_tokenInput\" type=\"password\" placeholder=\"ghp_xxxxxxxxxxxxxxxx\" style=\"width:100%;padding:10px 14px;background:#242424;border:1px solid rgba(255,255,255,0.2);border-radius:8px;color:#f0f0f0;font-size:13px;font-family:monospace;outline:none;box-sizing:border-box;margin-bottom:8px;\"><div id=\"_tokenErr\" style=\"color:#ff6b6b;font-size:12px;margin-bottom:12px;min-height:16px;\"></div><div style=\"display:flex;gap:10px;\"><button id=\"_tokenOk\" style=\"flex:1;padding:10px;background:#E50914;color:#fff;border:none;border-radius:8px;font-size:14px;cursor:pointer;font-weight:500;\">確認</button><a href=\"https://github.com/settings/tokens\" target=\"_blank\" style=\"padding:10px 14px;background:transparent;color:#888;border:1px solid rgba(255,255,255,0.2);border-radius:8px;font-size:12px;text-decoration:none;display:flex;align-items:center;white-space:nowrap;\">產生 Token &#8599;</a></div></div>';
  document.body.appendChild(el);
  setTimeout(function(){ var i=document.getElementById('_tokenInput'); if(i) i.focus(); },100);
  function trySubmit(){
    var val=(document.getElementById('_tokenInput').value||'').trim();
    if(!val){ document.getElementById('_tokenErr').textContent='請輸入 Token'; return; }
    document.getElementById('_tokenOk').textContent='驗證中...';
    document.getElementById('_tokenOk').disabled=true;
    fetch('https://api.github.com/user',{headers:{'Authorization':'token '+val,'Accept':'application/vnd.github.v3+json'}})
      .then(function(r){
        if(r.ok){ saveGHToken(val); el.remove(); if(onSuccess) onSuccess(val); }
        else{ document.getElementById('_tokenErr').textContent='Token 無效，請確認並重試'; document.getElementById('_tokenOk').textContent='確認'; document.getElementById('_tokenOk').disabled=false; }
      }).catch(function(){ document.getElementById('_tokenErr').textContent='網路錯誤，請再試一次'; document.getElementById('_tokenOk').textContent='確認'; document.getElementById('_tokenOk').disabled=false; });
  }
  document.getElementById('_tokenOk').onclick=trySubmit;
  document.getElementById('_tokenInput').onkeydown=function(e){ if(e.key==='Enter') trySubmit(); };
}

(function(){
  var GH_OWNER='sumoai-boop', GH_REPO='sumoai-boop.github.io', GH_BRANCH='main', GH_PATH='threads-data.json';
  var SEED=["DXS6gvJDhgX", "DWkuN1lmqxx", "DWgpeRrDkZx", "DUVaOFpE_et", "DXBQ1wBFG3h"];
  function toUrl(x){
    if(!x) return null;
    x = String(x).trim();
    if(/^https?:\/\//i.test(x)) return x.split('?')[0].replace(/\/+$/,'');
    return 'https://www.threads.com/@moai431711/post/' + x;   // 舊資料只有 ID
  }
  function slugOf(u){ var p=String(u).replace(/\/+$/,'').split('/'); return p[p.length-1]||'x'; }
  // 統一成 {u:網址, d:'YYYY-MM-DD'}；相容舊格式（純字串）
  function toItem(x){
    if(!x) return null;
    if(typeof x === 'string'){ var u=toUrl(x); return u?{u:u,d:''}:null; }
    var u2=toUrl(x.u||x.url);
    if(!u2) return null;
    var o={u:u2,d:(x.d||x.date||'')};
    ['v','l','r','p'].forEach(function(k){ if(x[k]!=null && x[k]!=='') o[k]=Number(x[k]); });
    return o;
  }
  function byDateDesc(a,b){
    if(a.d && b.d) return a.d < b.d ? 1 : (a.d > b.d ? -1 : 0);
    if(a.d && !b.d) return -1;      // 有日期的排前面
    if(!a.d && b.d) return 1;
    return 0;                        // 都沒日期就保留原順序
  }
  function sortPosts(){ POSTS.sort(byDateDesc); }
  var POSTS=(function(){
    try{ var v=JSON.parse(localStorage.getItem('_threadsData')||'null');
         return ((v&&v.length)?v:SEED).map(toItem).filter(Boolean); }
    catch(e){ return SEED.map(toItem).filter(Boolean); }
  })();
  sortPosts();
  var pushing=false;

  function toast(msg, err){
    var t=document.getElementById('_thToast');
    if(!t){ t=document.createElement('div'); t.id='_thToast'; t.className='th-toast'; document.body.appendChild(t); }
    t.style.background = err ? 'linear-gradient(135deg,#c0392b,#e74c3c)' : 'linear-gradient(135deg,#3F3F46,#71717A)';
    t.textContent=msg;
    requestAnimationFrame(function(){ t.style.opacity='1'; t.style.transform='translateY(0)'; });
    setTimeout(function(){ t.style.opacity='0'; t.style.transform='translateY(10px)'; }, err?5000:3000);
  }

  function save(){ try{ localStorage.setItem('_threadsData', JSON.stringify(POSTS)); }catch(e){} }

  function fmt(n){
    if(n==null||isNaN(n)) return '—';
    if(n>=1000000) return (n/1000000).toFixed(1).replace(/\.0$/,'')+'M';
    if(n>=1000)    return (n/1000).toFixed(1).replace(/\.0$/,'')+'K';
    return String(n);
  }
  function sumOf(k){
    var s=0,n=0;
    POSTS.forEach(function(p){ if(typeof p[k]==='number'&&!isNaN(p[k])){ s+=p[k]; n++; } });
    return {sum:s, count:n};
  }
  function renderStats(){
    var el=document.getElementById('thStats');
    var v=sumOf('v'), l=sumOf('l'), r=sumOf('r'), p=sumOf('p');
    var eng=l.sum+r.sum+p.sum;
    var engN=Math.max(l.count,r.count,p.count);
    var avgV = v.count ? Math.round(v.sum/v.count) : null;
    var rate = (v.sum>0) ? ((eng/v.sum)*100).toFixed(1)+'%' : '—';
    var cards=[
      ['貼文數', String(POSTS.length), POSTS.length?('已記錄數據 '+v.count+' 篇'):''],
      ['總觀看', fmt(v.count?v.sum:null), avgV!=null?('平均 '+fmt(avgV)):'尚未填寫'],
      ['總互動', fmt(engN?eng:null), engN?('讚 '+fmt(l.sum)+' · 留言 '+fmt(r.sum)+' · 轉發 '+fmt(p.sum)):'尚未填寫'],
      ['互動率', rate, (v.sum>0)?'互動 ÷ 觀看':'需要觀看數']
    ];
    el.innerHTML = cards.map(function(c){
      return '<div class="th-stat"><div class="th-stat-l">'+c[0]+'</div>'+
             '<div class="th-stat-v">'+c[1]+'</div>'+
             (c[2]?'<div class="th-stat-s">'+c[2]+'</div>':'')+'</div>';
    }).join('');
  }

  function render(){
    var wrap=document.getElementById('threadsWrap');
    document.getElementById('thEmpty').style.display = POSTS.length ? 'none' : 'block';
    wrap.innerHTML = POSTS.map(function(it){
      var url=it.u, id=slugOf(url);
      return '<div class="thread-embed" data-id="'+id+'">'+
        (it.d ? '<span class="th-date">'+it.d+'</span>' : '')+
        '<button class="th-edit" data-edit="'+encodeURIComponent(url)+'" title="編輯數據">✎</button>'+
        (function(){
          var m=[];
          if(typeof it.v==='number') m.push('<span class="th-m">👁 '+fmt(it.v)+'</span>');
          if(typeof it.l==='number') m.push('<span class="th-m">♥ '+fmt(it.l)+'</span>');
          if(typeof it.r==='number') m.push('<span class="th-m">💬 '+fmt(it.r)+'</span>');
          if(typeof it.p==='number') m.push('<span class="th-m">↻ '+fmt(it.p)+'</span>');
          return m.length ? '<div class="th-metrics">'+m.join('')+'</div>' : '';
        })()+
        '<button class="th-del" data-del="'+encodeURIComponent(url)+'">✕</button>'+
        '<blockquote class="text-post-media" data-text-post-permalink="'+url+'" data-text-post-version="0" id="ig-tp-'+id+'" style="background:#fff;border:1px solid rgba(0,0,0,0.1);border-radius:16px;max-width:100%;margin:0;padding:0;width:100%;">'+
        '<a href="'+url+'" target="_blank" style="background:transparent;line-height:0;padding:0;text-align:center;text-decoration:none;width:100%;font-family:-apple-system,BlinkMacSystemFont,sans-serif;">'+
        '<div style="padding:40px;display:flex;flex-direction:column;align-items:center;">'+
        '<div style="font-size:15px;line-height:21px;color:#000;font-weight:600;">在 Threads 查看</div>'+
        '</div></a></blockquote></div>';
    }).join('');
    renderStats();
    if(window.instgrm && window.instgrm.Embeds) window.instgrm.Embeds.process();
    else{ var s=document.createElement('script'); s.async=true; s.src='https://www.threads.com/embed.js'; document.body.appendChild(s); }
  }

  async function push(msg){
    var token=getGHToken();
    if(!token){ showTokenModal(function(){ push(msg); }); return false; }
    if(pushing){ toast('⏳ 推送中，請稍候...'); return false; }
    pushing=true;
    try{
      var api='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_PATH;
      var hdrs={'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};
      var sha=null;
      var r=await fetch(api+'?ref='+GH_BRANCH,{headers:hdrs});
      if(r.ok){ var fi=await r.json(); sha=fi.sha; }
      var body={message:msg, content:btoa(unescape(encodeURIComponent(JSON.stringify(POSTS,null,2)))), branch:GH_BRANCH};
      if(sha) body.sha=sha;
      var p=await fetch(api,{method:'PUT',headers:hdrs,body:JSON.stringify(body)});
      if(p.ok){ toast('✦ 已儲存至 GitHub'); return true; }
      var e=await p.json();
      toast('❌ 推送失敗：'+(e.message||p.status), true);
      return false;
    }catch(err){ toast('❌ '+err.message, true); return false; }
    finally{ pushing=false; }
  }

  function syncRemote(){
    if(pushing) return;
    var urls=['https://cdn.jsdelivr.net/gh/'+GH_OWNER+'/'+GH_REPO+'@'+GH_BRANCH+'/'+GH_PATH,
              'https://raw.githubusercontent.com/'+GH_OWNER+'/'+GH_REPO+'/'+GH_BRANCH+'/'+GH_PATH];
    (function tryNext(i){
      if(i>=urls.length) return;
      fetch(urls[i]+'?t='+Date.now()).then(function(r){ return r.ok?r.json():Promise.reject(); })
        .then(function(arr){
          if(!Array.isArray(arr)) return;
          if(POSTS.length && arr.length < POSTS.length){
            console.warn('threads sync: remote('+arr.length+') < local('+POSTS.length+')，保留本機');
            return;
          }
          POSTS=arr.map(toItem).filter(Boolean); sortPosts(); save(); render();
        })
        .catch(function(){ tryNext(i+1); });
    })(0);
  }

  function normalize(u){
    u=(u||'').trim();
    if(!u) return null;
    if(!/^https?:\/\//i.test(u)){
      if(/^[A-Za-z0-9_-]+$/.test(u)) return 'https://www.threads.com/@moai431711/post/'+u;
      return null;
    }
    if(!/(^|\.)threads\.(com|net)\//i.test(u)) return null;
    if(!/\/(post|share)\/[A-Za-z0-9_-]+/.test(u)) return null;
    return u.split('?')[0].replace(/\/+$/,'');
  }

  var modal=document.getElementById('thModal');
  var editing=null;   // 編輯中的網址；null 代表新增模式
  function setNums(o){
    document.getElementById('thViews').value   = (o&&typeof o.v==='number')?o.v:'';
    document.getElementById('thLikes').value   = (o&&typeof o.l==='number')?o.l:'';
    document.getElementById('thReplies').value = (o&&typeof o.r==='number')?o.r:'';
    document.getElementById('thReposts').value = (o&&typeof o.p==='number')?o.p:'';
  }
  function readNums(){
    var o={};
    [['thViews','v'],['thLikes','l'],['thReplies','r'],['thReposts','p']].forEach(function(pair){
      var raw=(document.getElementById(pair[0]).value||'').trim();
      if(raw!=='' && !isNaN(Number(raw))) o[pair[1]]=Number(raw);
    });
    return o;
  }
  function openModal(item){
    editing = item ? item.u : null;
    document.getElementById('thBoxTitle').textContent = item ? '編輯貼文數據' : '新增 Threads 貼文';
    document.getElementById('thSave').textContent = item ? '✦ 儲存' : '✦ 新增';
    document.getElementById('thUrl').value = item ? item.u : '';
    document.getElementById('thUrl').readOnly = !!item;
    document.getElementById('thErr').textContent='';
    document.getElementById('thDate').value = item ? (item.d||'') : new Date().toISOString().slice(0,10);
    setNums(item);
    modal.classList.add('open'); setTimeout(function(){ document.getElementById(editing?'thViews':'thUrl').focus(); },80); }
  function closeModal(){ modal.classList.remove('open'); }

  document.getElementById('thFab').onclick=function(){ openModal(null); };
  document.getElementById('thCancel').onclick=closeModal;
  modal.addEventListener('click', function(e){ if(e.target===modal) closeModal(); });
  document.getElementById('thUrl').addEventListener('keydown', function(e){ if(e.key==='Enter') document.getElementById('thSave').click(); });

  document.getElementById('thSave').onclick=function(){
    var d=(document.getElementById('thDate').value||'').trim();
    var nums=readNums();
    if(editing){
      var t=POSTS.filter(function(x){ return x.u===editing; })[0];
      if(t){
        t.d=d;
        ['v','l','r','p'].forEach(function(k){ if(k in nums) t[k]=nums[k]; else delete t[k]; });
      }
      sortPosts(); save(); render(); closeModal();
      push('更新 Threads 數據：'+slugOf(editing));
      return;
    }
    var url=normalize(document.getElementById('thUrl').value);
    if(!url){ document.getElementById('thErr').textContent='請貼上 Threads 貼文網址（含 /post/ 或 /share/）'; return; }
    if(POSTS.some(function(x){ return x.u===url; })){ document.getElementById('thErr').textContent='這篇貼文已經在列表中了'; return; }
    var item={u:url,d:d};
    ['v','l','r','p'].forEach(function(k){ if(k in nums) item[k]=nums[k]; });
    POSTS.push(item); sortPosts(); save(); render(); closeModal();
    push('新增 Threads 貼文：'+slugOf(url));
  };

  document.getElementById('threadsWrap').addEventListener('click', function(e){
    var ed=e.target.closest('[data-edit]');
    if(ed){
      var eu=decodeURIComponent(ed.getAttribute('data-edit'));
      var item=POSTS.filter(function(x){ return x.u===eu; })[0];
      if(item) openModal(item);
      return;
    }
    var b=e.target.closest('[data-del]');
    if(!b) return;
    var url=decodeURIComponent(b.getAttribute('data-del'));
    if(!confirm('確定要刪除這篇貼文嗎？')) return;
    POSTS=POSTS.filter(function(x){ return x.u!==url; });
    save(); render();
    push('刪除 Threads 貼文：'+slugOf(url));
  });

  render();
  syncRemote();
})();
</script>
