<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aaron 的寶可夢圖鑑</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: a field register — trainer summary strip, then a dense specimen grid; each specimen shows its IV appraisal as three 15-tick bars. */
:root{
  --paper:#EDF0EE; --sheet:#FFFFFF; --ink:#1C2638; --ink-2:#56607A; --rule:#CDD3D6;
  --tick:#DCE1E4; --signal:#C9252C; --signal-soft:#F7DDDE; --gold:#B7861C; --shadow:#6B4FA6; --purified:#2F8FB3; --high:#1F6FD1; --shiny:#C42F86;
  --f-display:"Chakra Petch","Noto Sans TC",ui-monospace,monospace;
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#121826; --sheet:#1A2233; --ink:#E6EAF2; --ink-2:#97A2B8; --rule:#2C3650;
  --tick:#2A3349; --signal:#F0525A; --signal-soft:#3A1E26; --gold:#E2B64A; --shadow:#A98BE6; --purified:#5FC0E2; --high:#5AA2F5; --shiny:#F27BC0; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#121826; --sheet:#1A2233; --ink:#E6EAF2; --ink-2:#97A2B8; --rule:#2C3650;
  --tick:#2A3349; --signal:#F0525A; --signal-soft:#3A1E26; --gold:#E2B64A; --shadow:#A98BE6; --purified:#5FC0E2; --high:#5AA2F5; --shiny:#F27BC0; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
img{max-width:100%}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--signal);outline-offset:2px}

/* header */
.top{display:grid;grid-template-columns:1fr auto;gap:20px;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:18px}
.brand h1{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(30px,5vw,48px);line-height:1;letter-spacing:-.01em;text-wrap:balance}
.brand h1 b{color:var(--signal);font-weight:700}
.brand p{margin:8px 0 0;color:var(--ink-2);font-size:14px}
.imp{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.btn{border:1.5px solid var(--ink);background:transparent;padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;white-space:nowrap}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn:hover{border-color:var(--signal)}
.btn.primary:hover{background:var(--signal);border-color:var(--signal);color:#fff}

.notice{display:flex;gap:12px;align-items:center;flex-wrap:wrap;background:var(--signal-soft);border-left:4px solid var(--signal);padding:10px 14px;font-size:14px}
.notice b{color:var(--signal)}

/* stats */
.stats{display:grid;grid-template-columns:repeat(7,1fr);gap:1px;border:1.5px solid var(--ink);background:var(--rule)}
.stat{padding:14px 16px;background:var(--sheet);min-width:0}
.stat.shinyst .v{color:var(--shiny)}
.stat .v{font-family:var(--f-display);font-weight:700;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .k{font-size:13px;color:var(--ink-2)}
.stat.hundo .v{color:var(--signal)}

/* toolbar */
.bar{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:center}
.seg{display:inline-flex;border:1.5px solid var(--ink);border-radius:999px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 14px;cursor:pointer;font-weight:700;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.search{flex:1 1 200px;min-width:0;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 12px}
.search:focus{border-color:var(--ink);outline:none}
select{border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;width:100%}
.chip{border:1px solid var(--rule);background:var(--sheet);border-radius:999px;padding:4px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--signal);color:var(--signal);font-weight:700}
.count{font-size:13px;color:var(--ink-2);margin-left:auto}

/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:14px}
.card{position:relative;background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px 14px 12px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;min-width:0;transition:border-color .15s,transform .15s}
.card:hover{border-color:var(--ink);transform:translateY(-2px)}
.card.is-hundo{border-color:var(--signal);box-shadow:inset 0 0 0 1px var(--signal)}
.c-head{display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
.who{display:flex;gap:10px;align-items:center;min-width:0}
.art{width:64px;height:64px;object-fit:contain;flex:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18))}
.s-art{width:96px;height:96px;object-fit:contain;flex:none}
.dex{font-family:var(--f-display);font-weight:600;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.name{font-weight:900;font-size:18px;line-height:1.25;margin-top:2px;overflow-wrap:anywhere}
.name small{font-weight:500;font-size:12px;color:var(--ink-2);margin-left:4px}
.pct{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1;font-variant-numeric:tabular-nums;text-align:right}
.pct small{font-size:13px;margin-left:1px}
.pct.p100{color:var(--signal)}
.pct.p90{color:var(--high)}
.pct.pfoot{font-size:32px;text-align:left}
.pct.pfoot small{font-size:15px}
.cpbig{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.cpbig small{font-size:12px;font-weight:600;color:var(--ink-2);margin-right:3px}
.mult{font-size:12px;color:var(--ink-2);text-align:right;margin-top:3px}
.c-foot{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:13px;color:var(--ink-2)}
.cp{font-family:var(--f-display);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:4px;flex-wrap:wrap}
.tag{font-size:11px;font-weight:700;padding:1px 7px;border-radius:3px;border:1px solid currentColor;line-height:1.5}
.tag.lucky{color:var(--gold)} .tag.shiny{color:var(--shiny)} .tag.shadow{color:var(--shadow)} .tag.purified{color:var(--purified)} .tag.fav{color:var(--signal)}
.seal{position:absolute;top:-9px;right:12px;background:var(--signal);color:#fff;font-family:var(--f-display);font-weight:700;font-size:11px;padding:1px 8px;border-radius:2px;letter-spacing:.06em}

/* IV appraisal bars: 15 ticks each, the game's own scale */
.iv{display:grid;grid-template-columns:auto 1fr auto;gap:3px 8px;align-items:center;font-size:11px}
.iv .l{color:var(--ink-2);font-weight:700}
.iv .n{font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums;min-width:2ch;text-align:right}
.ticks{display:grid;grid-template-columns:repeat(15,1fr);gap:2px;height:8px}
.ticks i{background:var(--tick);border-radius:1px}
.ticks i.on{background:var(--ink)}
.ticks.max i.on{background:var(--signal)}

.empty{border:1.5px dashed var(--rule);padding:40px 20px;text-align:center;color:var(--ink-2);border-radius:6px}

/* detail sheet */
.scrim{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:20;opacity:0;transition:opacity .2s}
.scrim.show{opacity:1}
.sheet{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--paper);z-index:21;display:flex;flex-direction:column;
  transform:translateX(100%);transition:transform .25s ease;border-left:2px solid var(--ink);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.sheet.show{transform:none}
.s-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:20px 20px 14px;border-bottom:1px solid var(--rule)}
.s-head h2{margin:2px 0 0;font-size:26px;font-weight:900;line-height:1.2}
.s-body{overflow-y:auto;padding:16px 20px 28px;display:flex;flex-direction:column;gap:12px}
.x{border:1.5px solid var(--ink);background:transparent;border-radius:999px;width:36px;height:36px;cursor:pointer;font-size:18px;line-height:1;flex:none}
.ind{background:var(--sheet);border:1px solid var(--rule);border-radius:6px;padding:14px;display:grid;grid-template-columns:1fr 150px;gap:10px 16px}
.ind.is-hundo{border-color:var(--signal)}
.ind .row{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline;font-size:13px;color:var(--ink-2)}
.ind .row b{color:var(--ink);font-family:var(--f-display);font-size:16px;font-variant-numeric:tabular-nums}
.ind .moves{grid-column:1/-1;font-size:13px;border-top:1px dashed var(--rule);padding-top:8px;display:flex;flex-wrap:wrap;gap:4px 14px}
.ind .moves span{color:var(--ink-2)}
.pvp{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.pvp div{background:var(--paper);border-radius:4px;padding:6px 8px;font-size:12px;color:var(--ink-2)}
.pvp b{display:block;font-family:var(--f-display);font-size:15px;color:var(--ink);font-variant-numeric:tabular-nums}

/* import dialog */
.drop{border:2px dashed var(--rule);border-radius:8px;padding:28px 16px;text-align:center;background:var(--sheet)}
.drop.over{border-color:var(--signal);background:var(--signal-soft)}
.steps{margin:0;padding-left:20px;color:var(--ink-2);font-size:14px}
.steps li{margin:2px 0}
.msg{font-size:14px;padding:10px 12px;border-radius:6px;background:var(--sheet);border:1px solid var(--rule)}
.msg.err{border-color:var(--signal);color:var(--signal)}
textarea{width:100%;min-height:110px;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:10px;font:12px/1.4 ui-monospace,monospace;color:var(--ink);resize:vertical}

.sync{font-size:13px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
.sync .dot{width:8px;height:8px;border-radius:50%;background:var(--rule)}
.sync.ok .dot{background:#2E9E5B}.sync.dirty .dot{background:var(--gold)}
.notice[hidden]{display:none}
.notice.err{border-left-color:var(--signal)}
.prog{font-size:14px;color:var(--ink-2)}
.bar-p{height:6px;background:var(--tick);border-radius:3px;overflow:hidden}.bar-p i{display:block;height:100%;width:0;background:var(--signal);transition:width .3s}
.rv{border:1px solid var(--rule);background:var(--sheet);border-radius:6px;padding:10px;display:flex;flex-direction:column;gap:8px}
.rv.warn{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.rv.skip{opacity:.6}
.rv.skip .rv-f label:not(.actl){display:none}
.rv.skip .rv-img{max-height:64px;object-fit:cover;object-position:left center}
.rv-img{width:100%;border-radius:4px;border:1px solid var(--rule);display:block}
.rv-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px 8px}
.rv-f label{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-2);min-width:0}
.rv-f input,.rv-f select{width:100%;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:5px;padding:5px 7px;font-size:14px;color:var(--ink)}
.rv-f .wide{grid-column:span 2}
.rv-f .ck{flex-direction:row;align-items:center;gap:6px;font-size:14px;color:var(--ink)}
.rv-f .ck input{width:auto}
.rv-note{font-size:12px;color:var(--ink-2)}
.rv.warn .rv-note{color:var(--gold);font-weight:700}
.sumline{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:14px;align-items:center}
.sumline b{font-family:var(--f-display);font-size:18px}
.acts{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;border-top:1px dashed var(--rule);padding-top:8px}
.mini{border:1px solid var(--rule);background:transparent;border-radius:999px;padding:3px 10px;font-size:12px;cursor:pointer;color:var(--ink-2)}
.mini[aria-pressed="true"]{border-color:var(--ink);color:var(--ink);font-weight:700}
.mini.del{margin-left:auto}.mini.del.armed{border-color:var(--signal);color:var(--signal);font-weight:700}
.tokrow{display:flex;gap:8px;flex-wrap:wrap}.tokrow input{flex:1 1 220px;min-width:0;border:1.5px solid var(--rule);background:var(--sheet);border-radius:8px;padding:8px 10px}
@media (max-width:860px){.stats{grid-template-columns:repeat(4,1fr)}.stat:last-child{grid-column:span 2}.stat{padding:12px}}
@media (max-width:560px){
  .rv-f{grid-template-columns:repeat(2,minmax(0,1fr))}
  .art{width:40px;height:40px}.who{gap:4px}
  .top{grid-template-columns:1fr}.imp{justify-content:flex-start}
  .grid{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .card{padding:12px 10px 10px}.name{font-size:15px}.pct{font-size:22px}.pct.pfoot{font-size:26px}.cpbig{font-size:19px}
  .ind{grid-template-columns:1fr}.count{margin-left:0;width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1>寶可夢圖鑑 <b>·</b> Aaron</h1>
      <p id="sub">Pokémon GO 收藏，依 Poke Genie 掃描的 IV 整理</p>
    </div>
    <div class="imp">
      <button class="btn primary" id="openImport" type="button">上傳截圖</button>
      <button class="btn" id="syncBtn" type="button" hidden>設定自動同步</button>
      <span class="sync" id="syncState"><span class="dot"></span><span id="syncTxt">讀取中</span></span>
    </div>
  </header>

  <div class="notice" id="note" hidden><span id="noteTxt"></span></div>

  <section class="stats" aria-label="收藏統計">
    <div class="stat"><div class="v" id="sTotal">0</div><div class="k">寶可夢總數</div></div>
    <div class="stat"><div class="v" id="sSpecies">0</div><div class="k">登錄物種</div></div>
    <div class="stat hundo"><div class="v" id="sHundo">0</div><div class="k">100% 完美個體</div></div>
    <div class="stat"><div class="v" id="sHigh">0</div><div class="k">IV ≥ 90%</div></div>
    <div class="stat shinyst"><div class="v" id="sShiny">0</div><div class="k">異色</div></div>
    <div class="stat"><div class="v" id="sLucky">0</div><div class="k">亮晶晶</div></div>
    <div class="stat"><div class="v" id="sShadow">0</div><div class="k">暗影 / 淨化</div></div>
  </section>

  <section class="bar" aria-label="篩選">
    <div class="seg" role="group" aria-label="檢視方式">
      <button type="button" id="vAll" aria-pressed="true">每一隻</button>
      <button type="button" id="vDex" aria-pressed="false">依種類合併</button>
    </div>
    <input class="search" id="q" type="search" placeholder="搜尋名稱、編號或招式">
    <select id="sort" aria-label="排序">
      <option value="dex">圖鑑編號</option>
      <option value="iv">IV 由高到低</option>
      <option value="cp">CP 由高到低</option>
      <option value="count">持有數量</option>
      <option value="date">最近捕獲</option>
    </select>
    <div class="chips" role="group" aria-label="快速篩選">
      <button class="chip" type="button" data-f="all" aria-pressed="true">全部</button>
      <button class="chip" type="button" data-f="hundo" aria-pressed="false">100%</button>
      <button class="chip" type="button" data-f="high" aria-pressed="false">IV ≥ 90%</button>
      <button class="chip" type="button" data-f="shiny" aria-pressed="false">異色</button>
      <button class="chip" type="button" data-f="lucky" aria-pressed="false">亮晶晶</button>
      <button class="chip" type="button" data-f="shadow" aria-pressed="false">暗影</button>
      <button class="chip" type="button" data-f="purified" aria-pressed="false">淨化</button>
      <button class="chip" type="button" data-f="fav" aria-pressed="false">我的最愛</button>
      <span class="count" id="count"></span>
    </div>
  </section>

  <main class="grid" id="grid" aria-live="polite"></main>
</div>

<div class="scrim" id="scrim" hidden></div>
<aside class="sheet" id="sheet" aria-modal="true" role="dialog" aria-labelledby="sTitle" hidden>
  <div class="s-head">
    <div class="who"><span id="sArt"></span><div><div class="dex" id="sDex"></div><h2 id="sTitle"></h2><div class="mult" id="sMeta" style="text-align:left"></div></div></div>
    <button class="x" id="sClose" type="button" aria-label="關閉">×</button>
  </div>
  <div class="s-body" id="sBody"></div>
</aside>

<input type="file" id="file" accept=".csv,text/csv" hidden>
<input type="file" id="shots" accept="image/*" multiple hidden>
<datalist id="dlNames"></datalist><datalist id="dlMoves"></datalist>

<script>
/* PGOCR: read Poke Genie「我的精靈」list screenshots in the browser with Tesseract.js */
(function(global){
'use strict';
const FORM_MARK={'阿':'阿羅拉','伽':'伽勒爾','洗':'洗翠','帕':'帕底亞','另':'別種','勇':'百戰勇者','起':'起源'};

function lcs(a,b){const m=a.length,n=b.length;if(!m||!n)return 0;let prev=new Array(n+1).fill(0);
  for(let i=1;i<=m;i++){const cur=new Array(n+1).fill(0);for(let j=1;j<=n;j++)cur[j]=a[i-1]===b[j-1]?prev[j-1]+1:Math.max(prev[j],cur[j-1]);prev=cur}return prev[n]}
function sim(a,b){return a&&b?2*lcs(a,b)/(a.length+b.length):0}
function bestMatch(txt,list){let best=null,bs=0;for(let i=0;i<list.length;i++){const s=sim(txt,list[i])+(list[i].length===txt.length?0.01:0);if(s>bs){bs=s;best=i}}return{idx:best,score:bs}}
const cjk=s=>(s||'').replace(/[^一-鿿]/g,'');

function loadImg(file){return new Promise((res,rej)=>{const u=URL.createObjectURL(file);const im=new Image();im.onload=()=>{res(im)};im.onerror=()=>rej(new Error('圖片讀取失敗'));im.src=u})}
function canvasOf(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.round(w));c.height=Math.max(1,Math.round(h));return c}
function crop(src,x,y,w,h,scale){scale=scale||1;const c=canvasOf(w*scale,h*scale);const g=c.getContext('2d');g.imageSmoothingEnabled=true;g.drawImage(src,x,y,w,h,0,0,c.width,c.height);return c}

/* dark text on light background -> black on white */
function binDark(c,th){const g=c.getContext('2d');const d=g.getImageData(0,0,c.width,c.height);const p=d.data;
  for(let i=0;i<p.length;i+=4){const v=(p[i]+p[i+1]+p[i+2])/3<th?0:255;p[i]=p[i+1]=p[i+2]=v}g.putImageData(d,0,0);return c}

/* move chips: white text inside coloured chips. White pixels connected to the strip border are page background. */
function chipText(c){const w=c.width,h=c.height,g=c.getContext('2d');const d=g.getImageData(0,0,w,h);const p=d.data;
  const white=new Uint8Array(w*h),bg=new Uint8Array(w*h);
  for(let i=0,j=0;j<w*h;i+=4,j++)white[j]=(Math.min(p[i],p[i+1],p[i+2])>205)?1:0;
  const q=new Int32Array(w*h);let qh=0,qt=0;
  const push=j=>{if(white[j]&&!bg[j]){bg[j]=1;q[qt++]=j}};
  for(let x=0;x<w;x++){push(x);push((h-1)*w+x)}for(let y=0;y<h;y++){push(y*w);push(y*w+w-1)}
  while(qh<qt){const j=q[qh++],x=j%w;if(x>0)push(j-1);if(x<w-1)push(j+1);if(j>=w)push(j-w);if(j<w*(h-1))push(j+w)}
  for(let i=0,j=0;j<w*h;i+=4,j++){const v=(white[j]&&!bg[j])?0:255;p[i]=p[i+1]=p[i+2]=v}
  g.putImageData(d,0,0);return c}

/* find chip spans: columns where most of the strip height is coloured (not near-white) */
function chipSpans(c){const w=c.width,h=c.height,g=c.getContext('2d');const p=g.getImageData(0,0,w,h).data;
  const on=new Uint8Array(w*h);const rowF=new Array(h).fill(0);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;const mx=Math.max(p[i],p[i+1],p[i+2]),mn=Math.min(p[i],p[i+1],p[i+2]);if(mn<200&&(mx-mn>25||mx<170)){on[y*w+x]=1;rowF[y]++}}
  const mxF=Math.max(...rowF);if(mxF<w*0.05)return[];
  const band=[];for(let y=0;y<h;y++)if(rowF[y]>=mxF*0.9)band.push(y);
  const colOn=new Array(w).fill(false);
  for(let x=0;x<w;x++){let n=0;for(const y of band)n+=on[y*w+x];colOn[x]=n>=band.length*0.7}
  const spans=[];let s=-1,gap=0;
  for(let x=0;x<=w;x++){const v=x<w&&colOn[x];
    if(v){if(s<0)s=x;gap=0}else if(s>=0){gap++;if(gap>3||x===w){const e=x-gap+1;if(e-s>w*0.04)spans.push([s,e]);s=-1;gap=0}}}
  return spans}

function isLucky(c){const g=c.getContext('2d');const p=g.getImageData(0,0,c.width,c.height).data;let r=0,gg=0,b=0,n=0;
  for(let i=0;i<p.length;i+=16){r+=p[i];gg+=p[i+1];b+=p[i+2];n++}r/=n;gg/=n;b/=n;return r>170&&gg>120&&b<110&&r-b>90}

function parseNums(cpText,ivText){
  const o={};const cp=cpText.replace(/\s/g,'').match(/CP(\d{2,4})\/?HP(\d{1,3})/i)||cpText.match(/CP\s*(\d{2,4}).*?HP\s*(\d{1,3})/i);
  if(cp){o.cp=+cp[1];o.hp=+cp[2]}
  const t=ivText.replace(/\s/g,'');
  let m=t.match(/(\d{1,2})[-.–—](\d{1,2})[-.–—](\d{1,2})/);
  if(m&&+m[1]<=15&&+m[2]<=15&&+m[3]<=15){o.atk=+m[1];o.def=+m[2];o.sta=+m[3]}
  else{const r=t.match(/(\d{2,3})%[-–—~](\d{2,3})%/);const s=t.match(/IV(\d{2,3})%/i);
    if(r){o.ivp=(+r[1]+ +r[2])/2;o.ivRange=r[1]+'–'+r[2]+'%'}else if(s){o.ivp=+s[1];o.ivRange=s[1]+'%'}}
  const lv=t.match(/級(\d{1,2}(?:\.\d)?)/)||t.match(/\/(\d{1,2}\.\d)(?:\/|$|\D)/);if(lv)o.lv=+lv[1];
  const rk=[...t.matchAll(/(\d{1,3}\.\d)%/g)];if(rk.length){let v=+rk[rk.length-1][1];if(v>100)v=+String(rk[rk.length-1][1]).slice(1);if(v<=100)o.rankU=v}
  return o}

async function setPSM(worker,psm){await worker.setParameters({tessedit_pageseg_mode:String(psm)})}

async function readShot(file,worker,dict,onStep){
  const im=await loadImg(file);const W=im.naturalWidth,H=im.naturalHeight;
  const full=crop(im,0,0,W,H,1);
  const cx0=Math.round(W*0.165),cx1=Math.round(W*0.83);
  const col=crop(full,cx0,0,cx1-cx0,H,1);
  await setPSM(worker,6);
  const {data}=await worker.recognize(col);
  const lines=data.lines.map(l=>({t:l.text.replace(/\n/g,' '),b:l.bbox,words:l.words}));
  const rows=[];
  for(let i=0;i<lines.length;i++){
    const L=lines[i];if(!/CP\s*\d/i.test(L.t))continue;
    const iv=lines.slice(i+1,i+3).find(x=>/IV|級|\d{1,2}[-.]\d{1,2}[-.]\d{1,2}|\d%/.test(x.t));
    if(!iv)continue;
    rows.push({L,iv})}
  /* drop a row cut off under the app header: it sits at the very top and its text line is shorter than the others */
  const hs=rows.map(r=>r.L.b.y1-r.L.b.y0).sort((a,b)=>a-b);const medH=hs[Math.floor(hs.length/2)]||0;
  while(rows.length&&rows[0].L.b.y0<H*0.16&&(rows[0].L.b.y0<H*0.118||(rows[0].L.b.y1-rows[0].L.b.y0)<medH*0.85))rows.shift();
  const out=[];
  for(let k=0;k<rows.length;k++){
    const {L,iv}=rows[k];if(onStep)onStep(k+1,rows.length);
    const o=parseNums(L.t,iv.t);if(o.cp==null)continue;
    const lineH=L.b.y1-L.b.y0;
    const cpWord=(L.words||[]).find(w=>/CP/i.test(w.text));
    const nameRight=cpWord?cpWord.bbox.x0:(L.b.x0+(L.b.x1-L.b.x0)*0.45);
    const top=L.b.y0, rowBottom=iv.b.y1+lineH*1.9;
    /* name */
    await setPSM(worker,7);
    let rawName='';
    for(const th of [140,180,100]){
      const nc=binDark(crop(full,cx0,top-4,Math.max(20,nameRight-6),lineH+8,2),th);
      const nr=await worker.recognize(nc);rawName=nr.data.text.trim();
      const b=cjk(rawName.replace(/[（(].*?[)）]/g,''));
      if(b&&bestMatch(b,dict.names).score>=0.6)break}
    let formMark='';const fm=rawName.match(/[（(]\s*([一-鿿])\s*[)）]/);if(fm&&FORM_MARK[fm[1]])formMark=FORM_MARK[fm[1]];
    const base=cjk(rawName.replace(/[（(].*?[)）]/g,''))||cjk(L.t.split(/CP/i)[0]);
    let bm=bestMatch(base,dict.names);
    if(base.length>2){const b2=bestMatch(base.slice(0,-1),dict.names);if(b2.score>bm.score)bm=b2}
    o.rawName=rawName;o.name=bm.score>=0.5?dict.names[bm.idx]:base;o.dex=bm.score>=0.5?bm.idx+1:0;o.nameScore=bm.score;o.form=formMark;
    /* moves */
    const sy=iv.b.y1+lineH*0.35,sh=lineH*1.35;
    const strip=crop(full,cx0,sy,cx1-cx0,sh,1);
    const spans=chipSpans(strip);
    const moves=[];
    for(const [a,b] of spans){
      const chip=chipText(crop(strip,a,0,b-a,sh,4));
      let pick={score:0,t:''};
      for(const psm of [8,7]){await setPSM(worker,psm);const r=await worker.recognize(chip);const t=cjk(r.data.text);if(!t)continue;
        const mm=bestMatch(t,dict.moves);if(mm.score>pick.score)pick={score:mm.score,t:mm.score>=0.34?dict.moves[mm.idx]:t};if(mm.score>=1)break}
      moves.push(pick.t)}
    o.quick=moves[0]||'';o.charge=moves[1]||'';o.charge2=moves[2]||'';
    /* lucky guess from thumbnail */
    const th=crop(full,Math.round(W*0.03),top,Math.round(W*0.1),Math.min(lineH*3,rowBottom-top),1);
    o.lucky=isLucky(th);
    /* preview crop of the whole row */
    const pv=crop(full,0,Math.max(0,top-lineH*0.5),W,Math.min(H,rowBottom)-Math.max(0,top-lineH*0.5),Math.min(1,560/W));
    o.preview=pv.toDataURL('image/jpeg',0.7);
    out.push(o)}
  await setPSM(worker,6);
  return out}

global.PGOCR={readShot,bestMatch,sim,parseNums};
})(window);

const ivPct=p=>p.ivp!=null?p.ivp:(p.atk+p.def+p.sta)/45*100;
const isHundo=p=>p.atk===15&&p.def===15&&p.sta===15;
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pad=n=>'#'+String(n||0).padStart(4,'0');
const fmtPct=v=>(Math.round(v*10)/10).toFixed(v>=99.95?0:1).replace(/\.0$/,'');
const dateVal=s=>{if(!s)return 0;const t=Date.parse(String(s).replace(/\//g,'-'));return isNaN(t)?0:t};

function ticks(n){if(n==null)n=-1;const max=n===15;let h='<span class="ticks'+(max?' max':'')+'">';for(let i=0;i<15;i++)h+='<i class="'+(i<n?'on':'')+'"></i>';return h+'</span>'}

function art(p,cls){const u=sprite(p);return u?'<img class="'+cls+'" src="'+u+'" alt="" loading="lazy" onerror="this.remove()">':''}

function ivBlock(p){return '<div class="iv"><span class="l">攻</span>'+ticks(p.atk)+'<span class="n">'+ivn(p.atk)+'</span><span class="l">防</span>'+ticks(p.def)+'<span class="n">'+ivn(p.def)+'</span><span class="l">HP</span>'+ticks(p.sta)+'<span class="n">'+ivn(p.sta)+'</span></div>'+(p.ivRange?'<div class="mult" style="text-align:left">Poke Genie 未鎖定單項 IV</div>':'')}

function pass(p){
  switch(filt){
    case 'hundo':return isHundo(p);case 'high':return ivPct(p)>=90;case 'lucky':return p.lucky;case 'shiny':return !!p.shiny;
    case 'shadow':return p.shadow;case 'purified':return p.purified;case 'fav':return p.fav;default:return true}
}
function matchQ(p,q){if(!q)return true;q=q.toLowerCase();
  return [p.name,p.form,p.quick,p.charge,p.charge2,String(p.dex),pad(p.dex)].some(x=>String(x||'').toLowerCase().includes(q))}
const key=p=>p.dex+'|'+p.name+'|'+(p.form||'');

function stats(){
  const sp=new Set(mons.map(p=>p.dex+'|'+p.name));

}

function render(){
  const q=$('q').value.trim(), sort=$('sort').value, list=mons.filter(p=>pass(p)&&matchQ(p,q));
  const grid=$('grid');
  if(!list.length){grid.innerHTML='<div class="empty" style="grid-column:1/-1">沒有符合條件的寶可夢。換個篩選或清除搜尋字試試。</div>';$('count').textContent='';return}
  let items;
  if(view==='dex'){
    const m=new Map();
    list.forEach(p=>{const k=key(p);if(!m.has(k))m.set(k,[]);m.get(k).push(p)});
    items=[...m.values()].map(g=>{g.sort((a,b)=>ivPct(b)-ivPct(a)||b.cp-a.cp);return{best:g[0],all:g,cp:Math.max(...g.map(x=>x.cp)),date:Math.max(...g.map(x=>dateVal(x.catch)))}});
  }else items=list.map(p=>({best:p,all:[p],cp:p.cp,date:dateVal(p.catch)}));
  const by={dex:(a,b)=>a.best.dex-b.best.dex||ivPct(b.best)-ivPct(a.best),iv:(a,b)=>ivPct(b.best)-ivPct(a.best)||b.cp-a.cp,
    cp:(a,b)=>b.cp-a.cp,count:(a,b)=>b.all.length-a.all.length||a.best.dex-b.best.dex,date:(a,b)=>b.date-a.date};
  items.sort(by[sort]||by.dex);
  grid.innerHTML=items.map((it,i)=>{const p=it.best,h=isHundo(p),pc=ivPct(p);
    return '<button class="card'+(h?' is-hundo':'')+'" type="button" data-i="'+i+'">'+
      (h?'<span class="seal">100</span>':'')+
      '<div class="c-head"><div class="who">'+art(p,'art')+'<div style="min-width:0"><div class="dex">'+pad(p.dex)+'</div><div class="name">'+esc(p.name)+(p.form?'<small>'+esc(p.form)+'</small>':'')+'</div></div></div>'+
      '<div><div class="cpbig"><small>CP</small>'+p.cp+'</div><div class="mult">'+(p.lv?'Lv '+p.lv:'')+(view==='dex'?(p.lv?' · ':'')+'持有 '+it.all.length:'')+'</div></div></div>'+
      ivBlock(p)+
      '<div class="c-foot"><span class="pct pfoot'+pctCls(p)+'">'+pctTxt(p)+'<small>%</small></span><span class="tags">'+tags(p)+'</span></div></button>'}).join('');
  grid._items=items;
  $('count').textContent=view==='dex'?items.length+' 種 · '+list.length+' 隻':list.length+' 隻';
}

/* ---------- CSV import ---------- */
function parseCSV(t){
  t=t.replace(/^﻿/,'');const rows=[];let row=[],f='',q=false;
  for(let i=0;i<t.length;i++){const c=t[i];
    if(q){if(c==='"'){if(t[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"')q=true;else if(c===','){row.push(f);f=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&t[i+1]==='\n')i++;row.push(f);rows.push(row);row=[];f=''}
    else f+=c}
  if(f!==''||row.length){row.push(f);rows.push(row)}
  return rows.filter(r=>r.some(x=>x.trim()!==''));
}
const norm=s=>String(s).toLowerCase().replace(/[\s_\-\.]/g,'').replace('é','e');
const ALIAS={
  name:['name','名稱','名字','寶可夢'],form:['form','型態','形態'],dex:['pokemonnumber','pokedexnumber','number','no','編號','圖鑑編號'],
  gender:['gender','性別'],cp:['cp'],hp:['hp'],atk:['ativ','atkiv','attackiv','攻擊'],def:['defiv','defenseiv','防禦'],sta:['staiv','staminaiv','hpiv','耐力'],
  lv:['levelmin','level','等級'],quick:['quickmove','fastmove','一般招式','快速招式'],charge:['chargemove','chargemove1','特殊招式'],charge2:['chargemove2','特殊招式2'],
  catch:['catchdate','捕獲日期','originalscandate','scandate'],lucky:['lucky','亮晶晶'],sp:['shadow/purified','shadowpurified','暗影/淨化'],fav:['favorite','我的最愛'],
  rankG:['rank%(g)','rank%g'],rankU:['rank%(u)','rank%u'],rankL:['rank%(l)','rank%l']
};
function importText(text){
  const rows=parseCSV(text);if(rows.length<2)throw new Error('檔案裡沒有資料列。請確認是從 Poke Genie 匯出的 CSV。');
  const head=rows[0].map(norm),col={};
  for(const k in ALIAS){for(const a of ALIAS[k]){const i=head.indexOf(norm(a));if(i>=0){col[k]=i;break}}}
  const miss=['name','atk','def','sta'].filter(k=>col[k]==null);
  if(miss.length)throw new Error('找不到必要欄位：'+miss.join('、')+'。第一列欄位是：'+rows[0].slice(0,8).join(', ')+'…');
  const g=(r,k)=>col[k]==null?'':String(r[col[k]]||'').trim();
  const num=(r,k)=>{const v=parseFloat(g(r,k));return isNaN(v)?0:v};
  const pnum=(r,k)=>{const v=parseFloat(g(r,k).replace('%',''));return isNaN(v)?null:v};
  const yes=v=>/^(1|true|yes|y|是)$/i.test(v);
  const out=rows.slice(1).map(r=>{const sp=g(r,'sp');
    return{dex:Math.round(num(r,'dex')),name:g(r,'name'),form:g(r,'form'),gender:g(r,'gender'),cp:Math.round(num(r,'cp')),hp:Math.round(num(r,'hp')),
      atk:Math.round(num(r,'atk')),def:Math.round(num(r,'def')),sta:Math.round(num(r,'sta')),lv:num(r,'lv')||'',
      quick:g(r,'quick'),charge:g(r,'charge'),charge2:g(r,'charge2'),catch:g(r,'catch'),
      lucky:yes(g(r,'lucky')),shadow:sp==='1'||/shadow|暗影/i.test(sp),purified:sp==='2'||/purif|淨化/i.test(sp),fav:yes(g(r,'fav'))||(+g(r,'fav')>0),
      rankG:pnum(r,'rankG'),rankU:pnum(r,'rankU'),rankL:pnum(r,'rankL')}}).filter(p=>p.name);
  if(!out.length)throw new Error('沒有讀到任何寶可夢。');
  return out;
}
function load(list){list.forEach(p=>{if(!p.id)p.id=rid()});mons=list;markDirty();stats();render()}

  $('sBody').dataset.mode='csv';
  $('sArt').innerHTML='';$('sDex').textContent='匯入';$('sTitle').textContent='用 CSV 匯入';$('sMeta').textContent='CSV 會整份取代目前的圖鑑';
  $('sBody').innerHTML='<ol class="steps"><li>打開 Poke Genie，進到「寶可夢」列表</li><li>右上角選單 → 匯出 → 選 CSV</li><li>把檔案拖到下面，或點按鈕選檔</li></ol>'+
    '<div class="drop" id="drop"><p style="margin:0 0 10px">把 CSV 檔拖到這裡</p><button class="btn primary" type="button" id="pick">選擇 CSV 檔</button></div>'+
    '<label for="paste" style="font-size:13px;color:var(--ink-2)">或直接貼上 CSV 內容</label><textarea id="paste" placeholder="Index,Name,Form,Pokemon Number,…"></textarea>'+
    '<button class="btn" type="button" id="usePaste">匯入貼上的內容</button><div id="imsg"></div>';
  const msg=(t,err)=>{$('imsg').innerHTML='<div class="msg'+(err?' err':'')+'">'+esc(t)+'</div>'};
  const run=text=>{try{const l=importText(text);load(l);msg('已匯入 '+l.length+' 隻寶可夢。');setTimeout(hide,900)}catch(e){msg(e.message,true)}};
  const readFile=f=>{if(!f)return;const r=new FileReader();r.onload=()=>run(r.result);r.onerror=()=>msg('檔案讀取失敗，請再選一次。',true);r.readAsText(f,'utf-8')};
  $('pick').onclick=()=>$('file').click();$('file').onchange=e=>{readFile(e.target.files[0]);e.target.value=''};
  $('usePaste').onclick=()=>run($('paste').value);
  const d=$('drop');
  d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');readFile(e.dataTransfer.files[0])};
  show();
}

/* ---------- GitHub sync (pokedex-data.json, same pattern as the rest of the site) ---------- */
const GH={owner:'sumoai-boop',repo:'sumoai-boop.github.io',branch:'main',path:'pokedex-data.json',tokenKey:'sumoai_gh_token'};
const RAW='https://raw.githubusercontent.com/'+GH.owner+'/'+GH.repo+'/'+GH.branch+'/'+GH.path;
const API='https://api.github.com/repos/'+GH.owner+'/'+GH.repo+'/contents/'+GH.path;
function b64enc(str){const b=new TextEncoder().encode(str);let s='';for(let i=0;i<b.length;i+=0x8000)s+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(s)}
function b64dec(b64){const bin=atob(String(b64).replace(/\s/g,''));const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return new TextDecoder().decode(u)}
let cloud={known:false,exists:false,updated:'',count:0};
let syncErr='',syncConflict=null,pushing=false,editVer=0,autoTimer=null,lastSync='';
const hm=d=>{d=new Date(d);return isNaN(d)?'':String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function syncUI(){
  const s=$('syncState'),t=$('syncTxt'),b=$('syncBtn');s.classList.remove('ok','dirty');
  const tok=!!lsGet(GH.tokenKey);
  if(pushing){s.classList.add('dirty');t.textContent='同步中…'}
  else if(syncConflict){s.classList.add('dirty');t.textContent='雲端有別的版本'}
  else if(meta.dirty&&!tok){s.classList.add('dirty');t.textContent='還沒設定同步'}
  else if(meta.dirty&&syncErr){s.classList.add('dirty');t.textContent='同步失敗'}
  else if(meta.dirty){s.classList.add('dirty');t.textContent='等待同步…'}
  else if(cloud.known&&cloud.exists){s.classList.add('ok');t.textContent='已自動同步'+(lastSync?' · '+lastSync:'')}
  else if(cloud.known)t.textContent='雲端還沒有資料';
  else t.textContent='只存在這台裝置';
  /* the button only shows when something needs the user */
  b.hidden=!( (!tok&&(meta.dirty||!cloud.exists)) || (meta.dirty&&syncErr) );
  b.textContent=!tok?'設定自動同步':'重試同步';
}
function scheduleSync(delay){clearTimeout(autoTimer);if(lsGet(GH.tokenKey))autoTimer=setTimeout(()=>pushRemote(),delay==null?1500:delay);syncUI()}
function adoptRemote(d){d.items.forEach(p=>{if(!p.id)p.id=rid()});mons=d.items;meta={dirty:false,base:d.updated||''};cloud={known:true,exists:true,updated:d.updated||'',count:d.items.length};lastSync=hm(d.updated);saveLocal();stats();render()}
async function pullRemote(){
  if(pushing)return;
  try{
    const r=await fetch(RAW+'?t='+Date.now(),{cache:'no-store'});
    cloud.known=true;
    if(r.status===404){cloud.exists=false;syncUI();if(meta.dirty||mons.length)scheduleSync(300);return}
    if(!r.ok)throw new Error(r.status);
    const d=await r.json();if(!d||!Array.isArray(d.items))throw new Error('格式不對');
    cloud={known:true,exists:true,updated:d.updated||'',count:d.items.length};
    if(!meta.dirty){if(d.updated!==meta.base||!lastSync)adoptRemote(d)}
    else scheduleSync(300);
  }catch(e){cloud.known=false}
  syncUI();
}
/* force: overwrite the cloud even if another device changed it since this one last synced */
async function pushRemote(force){
  if(pushing){scheduleSync(1000);return}
  const tok=lsGet(GH.tokenKey);if(!tok){syncUI();return}
  if(!meta.dirty&&cloud.exists&&!force){syncUI();return}
  pushing=true;syncErr='';syncUI();const ver=editVer;
  try{
    const hd={Authorization:'token '+tok,Accept:'application/vnd.github+json'};
    const g=await fetch(API+'?ref='+GH.branch+'&t='+Date.now(),{headers:hd,cache:'no-store'});
    let sha=null,remote=null;
    if(g.status===200){const j=await g.json();sha=j.sha;try{remote=JSON.parse(b64dec(j.content))}catch(e){}}
    else if(g.status===401||g.status===403)throw new Error('GitHub 權杖無效或沒有寫入權限（'+g.status+'），按「設定自動同步」重新輸入。');
    else if(g.status!==404)throw new Error('讀取雲端失敗（'+g.status+'）');
    if(remote&&remote.updated&&remote.updated!==meta.base&&force!==true){
      syncConflict=remote;
      note('另一台裝置在你上次同步後也改過圖鑑（雲端 '+(remote.items||[]).length+' 隻，這台 '+mons.length+' 隻），所以先暫停自動同步。'+
        ' <button class="mini" type="button" data-sync="mine">用這台的覆蓋雲端</button> <button class="mini" type="button" data-sync="cloud">改用雲端的</button>',true);
      return}
    const body={version:1,updated:new Date().toISOString(),items:mons};
    const put=await fetch(API,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},hd),
      body:JSON.stringify(Object.assign({message:'pokedex: '+mons.length+' Pokémon',content:b64enc(JSON.stringify(body)),branch:GH.branch},sha?{sha}:{}))});
    if(put.status===409){scheduleSync(800);return}
    if(!put.ok){const j=await put.json().catch(()=>({}));throw new Error('上傳失敗（'+put.status+'）'+(j.message?'：'+j.message:''))}
    meta.base=body.updated;if(editVer===ver)meta.dirty=false;
    cloud={known:true,exists:true,updated:body.updated,count:mons.length};lastSync=hm(body.updated);syncConflict=null;saveLocal();
    if(/同步|另一台/.test($('noteTxt').textContent))note('');
    if(meta.dirty)scheduleSync(500);
  }catch(e){syncErr=e.message||'同步失敗';note(esc(syncErr==='Failed to fetch'?'連不上 GitHub，等網路恢復會自動再試。':syncErr),true)}
  finally{pushing=false;syncUI()}
}
$('syncBtn').onclick=()=>{if(!lsGet(GH.tokenKey))tokenDialog();else pushRemote()};
$('note').addEventListener('click',e=>{const b=e.target.closest('[data-sync]');if(!b)return;
  if(b.dataset.sync==='mine'){syncConflict=null;note('');pushRemote(true)}
  else if(syncConflict){adoptRemote(syncConflict);syncConflict=null;note('');syncUI()}});
window.addEventListener('online',()=>{if(meta.dirty)scheduleSync(300)});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(meta.dirty)scheduleSync(300);else pullRemote()}});
function tokenDialog(){
  $('sBody').dataset.mode='token';
  $('sArt').innerHTML='';$('sDex').textContent='同步';$('sTitle').textContent='設定自動同步';$('sMeta').textContent='跟網站其他頁面共用同一組權杖';
  $('sBody').innerHTML='<p style="margin:0">同步會把圖鑑存成 repo 裡的 <b>pokedex-data.json</b>，手機和電腦就會看到同一份。需要一組有這個 repo 寫入權限的 GitHub 權杖（Personal access token）。</p>'+
    '<div class="tokrow"><input id="tokIn" type="password" autocomplete="off" placeholder="ghp_… 或 github_pat_…"><button class="btn primary" type="button" id="tokSave">儲存，開始自動同步</button></div>'+
    '<p class="prog" style="margin:0">權杖只存在這個瀏覽器裡，不會出現在網頁或 repo 中。</p>';
  $('tokSave').onclick=()=>{const v=$('tokIn').value.trim();if(!v){$('tokIn').focus();return}lsSet(GH.tokenKey,v);hide();syncErr='';pushRemote(!cloud.exists)};
  show();
}

/* ---------- screenshot import ---------- */
const TESS_URL='https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrWorker=null,pend=[],busy=false;
function loadScript(u){return new Promise((res,rej)=>{if(window.Tesseract)return res();const s=document.createElement('script');s.src=u;s.onload=()=>res();s.onerror=()=>rej(new Error('文字辨識程式載入失敗，請確認網路連線後再試一次。'));document.head.appendChild(s)})}
async function getWorker(log){
  await loadScript(TESS_URL);
  if(!ocrWorker)ocrWorker=await Tesseract.createWorker(['chi_tra','eng'],1,{logger:m=>{if(m.status&&/load|init/i.test(m.status)&&m.progress!=null)log('準備中文辨識資料（第一次要下載約 5 MB，之後會快很多）… '+Math.round(m.progress*100)+'%',m.progress)}});
  return ocrWorker;
}
function fillLists(){
  if($('dlNames').childElementCount)return;
  $('dlNames').innerHTML=NAMES.map(n=>'<option value="'+n+'">').join('');
  $('dlMoves').innerHTML=GOMOVES.map(n=>'<option value="'+n+'">').join('');
}
function shotDialog(){
  $('sBody').dataset.mode='shots';
  $('sArt').innerHTML='';$('sDex').textContent='新增';$('sTitle').textContent='上傳 Poke Genie 截圖';$('sMeta').textContent='辨識完會先讓你檢查，再加進圖鑑';
  $('sBody').innerHTML='<ol class="steps"><li>在 Poke Genie 打開「我的精靈」列表</li><li>一頁一頁往下滑著截圖，上下重疊沒關係</li><li>把截圖選進來，可以一次選很多張</li></ol>'+
    '<div class="drop" id="drop"><p style="margin:0 0 10px">把截圖拖到這裡</p><button class="btn primary" type="button" id="pickShots">選擇截圖</button></div>'+
    '<div id="shotOut"></div>'+
    '<p class="prog" style="margin:0">有 Poke Genie 匯出的 CSV？<button class="mini" type="button" id="toCsv">改用 CSV 匯入</button></p>';
  $('pickShots').onclick=()=>$('shots').click();
  $('toCsv').onclick=importDialog;
  const d=$('drop');
  d.ondragover=e=>{e.preventDefault();d.classList.add('over')};d.ondragleave=()=>d.classList.remove('over');
  d.ondrop=e=>{e.preventDefault();d.classList.remove('over');runShots([...e.dataTransfer.files].filter(f=>/^image\//.test(f.type)))};
  show();
}
$('shots').onchange=e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)runShots(fs)};

const ivKey=o=>o.ivRange?('r'+o.ivRange):(o.atk+'-'+o.def+'-'+o.sta);
const sameMon=(a,b)=>(a.dex&&b.dex?a.dex===b.dex:a.name===b.name)&&(a.form||'')===(b.form||'');
function classify(o){
  const c=mons.filter(m=>sameMon(m,o));
  const same=c.find(m=>m.cp===o.cp&&ivKey(m)===ivKey(o));
  if(same)return{act:'skip',target:same.id,why:'已經在圖鑑裡'};
  if(!o.ivRange){const r=c.find(m=>m.ivRange&&m.cp===o.cp);if(r)return{act:'upd',target:r.id,why:'會補上 CP '+r.cp+' 那隻的完整 IV'}}
  const up=c.find(m=>!m.ivRange&&!o.ivRange&&ivKey(m)===ivKey(o)&&o.cp>m.cp&&(+o.lv||0)>=(+m.lv||0));
  if(up)return{act:'upd',target:up.id,why:'IV 跟 CP '+up.cp+' 那隻一樣、CP 變高了，應該是強化過，會更新那隻'};
  return{act:'add',target:'',why:o.dex?'新的寶可夢':'認不出名稱，請手動填寫'};
}
async function runShots(files){
  if(busy||!files.length)return;busy=true;
  const out=$('shotOut');if(!out){busy=false;return}
  out.innerHTML='<div class="prog" id="pTxt">準備中…</div><div class="bar-p"><i id="pBar"></i></div>';
  const log=(t,f)=>{const a=$('pTxt'),b=$('pBar');if(a)a.textContent=t;if(b&&f!=null)b.style.width=Math.round(f*100)+'%'};
  const dict={names:NAMES,moves:GOMOVES};
  const got=[],seen=new Set();let fail=0;
  try{
    const w=await getWorker(log);
    for(let i=0;i<files.length;i++){
      log('辨識第 '+(i+1)+' / '+files.length+' 張…',i/files.length);
      let rows=[];
      try{rows=await PGOCR.readShot(files[i],w,dict,(k,n)=>log('辨識第 '+(i+1)+' / '+files.length+' 張：第 '+k+' / '+n+' 隻',(i+k/n)/files.length))}catch(e){fail++}
      if(!rows.length)fail++;
      for(const o of rows){const k=o.name+'|'+o.form+'|'+o.cp+'|'+ivKey(o);if(seen.has(k))continue;seen.add(k);got.push(o)}
    }
  }catch(e){out.innerHTML='<div class="msg err">'+esc(e.message)+'</div>';busy=false;return}
  busy=false;
  if(!got.length){out.innerHTML='<div class="msg err">這幾張截圖裡沒有讀到寶可夢。請確認是 Poke Genie「我的精靈」列表的截圖，而且沒有被裁切或縮小。</div>';return}
  const ord={upd:0,add:1,skip:2};
  pend=got.map(o=>Object.assign(o,classify(o))).sort((a,b)=>(a.dex?0:-1)-(b.dex?0:-1)||ord[a.act]-ord[b.act]);
  renderReview(fail);
}
function ivStr(o){return o.ivRange?o.ivRange:(o.atk!=null?o.atk+'-'+o.def+'-'+o.sta:'')}
const FORMS=['','阿羅拉','伽勒爾','洗翠','帕底亞','別種','起源','百戰勇者'];
function renderReview(fail){
  fillLists();
  const st=$('sBody').querySelector('.steps'),dr=$('drop');if(st)st.hidden=true;if(dr)dr.hidden=true;
  const n={add:0,upd:0,skip:0};pend.forEach(o=>n[o.act]++);
  const sum='<div class="sumline"><span>讀到 <b>'+pend.length+'</b> 隻</span><span>新增 <b>'+n.add+'</b></span><span>更新 <b>'+n.upd+'</b></span><span>已在圖鑑 <b>'+n.skip+'</b></span>'+(fail?'<span style="color:var(--signal)">'+fail+' 張沒讀到</span>':'')+'</div>';
  const btn='<button class="btn primary" type="button" data-commit="1">加入圖鑑</button>';
  $('shotOut').innerHTML=sum+'<p class="prog" style="margin:0">先對照截圖檢查一下，辨識錯的直接改；黃色框是需要你確認的。</p>'+
    pend.map((o,i)=>{const warn=!o.dex||o.act==='upd';
      return '<div class="rv'+(warn?' warn':'')+(o.act==='skip'?' skip':'')+'" data-i="'+i+'">'+
      (o.preview?'<img class="rv-img" src="'+o.preview+'" alt="截圖第 '+(i+1)+' 隻">':'')+
      '<div class="rv-f">'+
      '<label class="wide">名稱<input data-f="name" list="dlNames" value="'+esc(o.name)+'"></label>'+
      '<label>型態<select data-f="form">'+FORMS.map(f=>'<option value="'+f+'"'+(f===(o.form||'')?' selected':'')+'>'+(f||'一般')+'</option>').join('')+'</select></label>'+
      '<label>CP<input data-f="cp" inputmode="numeric" value="'+(o.cp||'')+'"></label>'+
      '<label>HP<input data-f="hp" inputmode="numeric" value="'+(o.hp||'')+'"></label>'+
      '<label>等級<input data-f="lv" inputmode="decimal" value="'+(o.lv||'')+'"></label>'+
      '<label>IV（攻-防-HP）<input data-f="iv" value="'+esc(ivStr(o))+'"></label>'+
      '<label>一般招式<input data-f="quick" list="dlMoves" value="'+esc(o.quick)+'"></label>'+
      '<label>特殊招式<input data-f="charge" list="dlMoves" value="'+esc(o.charge)+'"></label>'+
      '<label>特殊招式 2<input data-f="charge2" list="dlMoves" value="'+esc(o.charge2)+'"></label>'+
      '<label class="ck"><input type="checkbox" data-f="lucky"'+(o.lucky?' checked':'')+'>亮晶晶</label>'+
      '<label class="ck"><input type="checkbox" data-f="shiny"'+(o.shiny?' checked':'')+'>異色</label>'+
      '<label class="wide actl">處理方式<select data-f="act"><option value="add"'+(o.act==='add'?' selected':'')+'>新增成一隻</option>'+(o.target?'<option value="upd"'+(o.act==='upd'?' selected':'')+'>更新圖鑑裡那隻</option>':'')+'<option value="skip"'+(o.act==='skip'?' selected':'')+'>略過</option></select></label>'+
      '</div><div class="rv-note">'+esc(o.why)+'</div></div>'}).join('')+
    '<div style="display:flex;gap:8px;flex-wrap:wrap">'+btn+'<button class="btn" type="button" id="moreShots">再加截圖</button></div>';
  $('moreShots').onclick=()=>$('shots').click();
}
function parseIV(s){s=String(s||'').replace(/\s/g,'');
  let m=s.match(/^(\d{1,2})[-.\/,](\d{1,2})[-.\/,](\d{1,2})$/);if(m&&+m[1]<=15&&+m[2]<=15&&+m[3]<=15)return{atk:+m[1],def:+m[2],sta:+m[3],ivp:null,ivRange:''};
  m=s.match(/^(\d{1,3})%?[-–~](\d{1,3})%?$/);if(m)return{atk:null,def:null,sta:null,ivp:(+m[1]+ +m[2])/2,ivRange:m[1]+'–'+m[2]+'%'};
  m=s.match(/^(\d{1,3})%$/);if(m)return{atk:null,def:null,sta:null,ivp:+m[1],ivRange:m[1]+'%'};
  return null}
$('sBody').addEventListener('change',e=>{const f=e.target.closest('[data-f="act"]');if(!f)return;const rv=f.closest('.rv');rv.classList.toggle('skip',f.value==='skip')});
$('sBody').addEventListener('click',e=>{
  if(!e.target.closest('[data-commit]')||$('sBody').dataset.mode!=='shots')return;
  const rows=[...$('sBody').querySelectorAll('.rv')];let added=0,upd=0,bad=0;
  rows.forEach(rv=>{rv.style.outline='';
    const o=pend[+rv.dataset.i];const v=f=>{const el=rv.querySelector('[data-f="'+f+'"]');return el.type==='checkbox'?el.checked:el.value.trim()};
    const act=v('act');if(act==='skip')return;
    const iv=parseIV(v('iv'));const name=v('name');const cp=parseInt(v('cp'),10);
    if(!iv||!name||!cp){bad++;rv.style.outline='2px solid var(--signal)';return}
    const dex=NAMES.indexOf(name)+1;
    const rec={name,form:v('form'),dex,cp,hp:parseInt(v('hp'),10)||0,lv:parseFloat(v('lv'))||'',quick:v('quick'),charge:v('charge'),charge2:v('charge2'),rankU:o.rankU!=null?o.rankU:null};
    Object.assign(rec,iv);
    if(act==='upd'&&o.target){const t=mons.find(m=>m.id===o.target);if(t){Object.assign(t,rec);if(v('lucky'))t.lucky=true;if(v('shiny'))t.shiny=true;upd++;return}}
    mons.push(Object.assign({id:rid(),gender:'',grade:'',catch:'',lucky:v('lucky'),shiny:v('shiny'),shadow:false,purified:false,fav:false,rankG:null,rankL:null},rec));added++;
  });
  if(bad){note('有 '+bad+' 隻的名稱、CP 或 IV 格式不對（紅框），改好再按一次「加入圖鑑」。IV 請寫成 13-14-15 或 96%。',true);return}
  if(!added&&!upd){note('沒有要加入的寶可夢。');hide();return}
  markDirty();stats();render();hide();
  note('已新增 '+added+' 隻、更新 '+upd+' 隻。'+(lsGet(GH.tokenKey)?'會自動同步到其他裝置。':'按右上角「設定自動同步」，其他裝置才看得到。'));
});


/* whole-page drop */
document.addEventListener('dragover',e=>e.preventDefault());
document.addEventListener('drop',e=>{if(e.target.closest&&e.target.closest('#drop'))return;e.preventDefault();
  const fs=[...e.dataTransfer.files];if(!fs.length)return;
  const imgs=fs.filter(f=>/^image\//.test(f.type));if(imgs.length){shotDialog();runShots(imgs);return}
  const f=fs[0];const r=new FileReader();r.onload=()=>{try{load(importText(r.result))}catch(err){importDialog();$('imsg').innerHTML='<div class="msg err">'+esc(err.message)+'</div>'}};r.readAsText(f,'utf-8')});

setView(view);stats();syncUI();pullRemote();
})();
</script>
