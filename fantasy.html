<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>夢幻籃球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FFFFFF; --card:#FFFFFF; --card2:#F5F6F8; --line:#E8EAEE; --line2:#D6DAE0;
  --ink:#16181D; --ink2:#5B6270; --ink3:#8A919D;
  --me:#D9621C; --me2:#C2540F; --op:#3B7BD0; --meSoft:#FFF2E8; --meLine:#F4CDB0;
  --win:#1F9D5C; --loss:#D9443B; --tie:#8A919D;
  --shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --sans:'Noto Sans TC',system-ui,-apple-system,sans-serif; --mono:'Space Mono',ui-monospace,monospace; --disp:'Bebas Neue','Oswald',Impact,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 28px 120px}
.hidden{display:none!important}
.num{font-family:var(--mono)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 6px}
.back{font-size:13px;color:var(--ink2);text-decoration:none}
.back:hover{color:var(--me2)}
.top-r{display:flex;align-items:center;gap:8px;position:relative}
.brand{display:flex;align-items:flex-end;gap:14px;margin:12px 0 4px;flex-wrap:wrap}
.brand h1{font-weight:900;font-size:clamp(32px,5vw,44px);letter-spacing:.06em;line-height:1}
.brand .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--me2);padding-bottom:6px}
.lgs{display:flex;gap:8px;flex-wrap:wrap;margin:16px 0 2px}
.lg{display:flex;align-items:center;gap:9px;border:1px solid var(--line2);background:var(--card);border-radius:14px;padding:9px 14px 9px 11px;cursor:pointer;text-align:left;transition:border-color .15s,background .15s}
.lg:hover{border-color:var(--ink3)}
.lg .ball{width:26px;height:26px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:14px;background:var(--line);color:var(--ink2)}
.lg .nm{font-weight:700;font-size:14.5px;line-height:1.2}
.lg .mt{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:2px;letter-spacing:.04em}
.lg.on{border-color:var(--me);background:var(--meSoft)}
.lg.on .ball{background:var(--me);color:#fff}
.lg.add{border-style:dashed;color:var(--ink2);font-size:13.5px;padding:9px 14px}
.sub{color:var(--ink2);font-size:13.5px;margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub a{color:var(--ink2);text-decoration:none;border-bottom:1px dashed var(--line2)}
.sub a:hover{color:var(--me2);border-color:var(--me2)}

.btn{font-weight:500;font-size:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:999px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--me);border-color:var(--me);color:#fff}
.btn.pri:hover{background:var(--me2);border-color:var(--me2)}
.btn.danger{color:var(--loss);border-color:#F2C6C2}
.btn.danger:hover{background:var(--loss);color:#fff;border-color:var(--loss)}
.btn.icon{padding:8px 12px;line-height:1}
.btn.sm{font-size:12.5px;padding:5px 11px}

.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--win)}
.sync.dirty .dot{background:var(--me);animation:pulse 1.2s infinite}
.sync.busy .dot{background:var(--op);animation:pulse .8s infinite}
.sync.err .dot{background:var(--loss)}
.sync.demo .dot{background:var(--ink3)}
.sync.err{color:#B42318;border-color:#F2C6C2}
@keyframes pulse{50%{opacity:.35}}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:210px;display:none;z-index:40;box-shadow:0 12px 34px rgba(16,24,40,.14)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-size:13.5px;cursor:pointer}
.menu button:hover{background:var(--line)}

.demo-bar{display:none;margin:12px 0 0;background:#FFF6EA;border:1px solid #F5D3A8;color:#8A4B0F;border-radius:12px;padding:10px 14px;font-size:13px;align-items:center;justify-content:space-between;gap:10px}
.demo-bar.on{display:flex}
.demo-bar button{background:none;border:1px solid #E2B47F;color:#8A4B0F;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12.5px}

/* scoreboard */
.board{margin:20px 0 6px;display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:12px}
.sb{box-shadow:var(--shadow);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.sb .lb{font-size:12px;color:var(--ink2);letter-spacing:.04em}
.sb .v{font-family:var(--disp);font-size:44px;line-height:1;margin-top:6px;letter-spacing:.02em}
.sb .v small{font-family:var(--sans);font-size:13px;color:var(--ink2);margin-left:6px;letter-spacing:0}
.sb .f{font-size:12px;color:var(--ink3);margin-top:6px}
.sb.hero{background:linear-gradient(135deg,var(--meSoft) 0%,#FFFFFF 75%);border-color:var(--meLine)}
.sb.hero::after{content:"";position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;
  border:2px solid rgba(217,98,28,.18);box-shadow:inset 0 0 0 26px transparent}
.sb.hero .v{color:var(--ink);font-size:54px}
.wlt b{font-weight:400}
.wlt .w{color:var(--win)} .wlt .l{color:var(--loss)} .wlt .t{color:var(--tie)}

/* tabs */
.tabs{display:flex;gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 16px;font-size:15px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--me);font-weight:700}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.bar h2{font-size:17px;font-weight:700}
.bar .hint{font-size:12.5px;color:var(--ink3)}
.card{box-shadow:var(--shadow);background:var(--card);border:1px solid var(--line);border-radius:16px}
.empty{padding:38px 20px;text-align:center;color:var(--ink2);font-size:14px;line-height:1.8}
.empty .big{font-size:34px;margin-bottom:6px}

/* draft */
.slotpick{padding:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-bottom:12px}
.slotpick select{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:7px 10px}
.draftinfo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink2)}
.chip b{color:var(--ink);font-family:var(--mono);font-weight:700}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.drow{box-shadow:var(--shadow);display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 10px;cursor:pointer;transition:border-color .15s,transform .15s}
.drow:hover{border-color:var(--line2);transform:translateY(-1px)}
.drow .rd{background:var(--card2);border-radius:10px;text-align:center;padding:6px 0}
.drow .rd .r{font-family:var(--disp);font-size:24px;line-height:1}
.drow .rd .o{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:2px}
.drow.got .rd{background:var(--meSoft)}
.drow.got .rd .r{color:var(--me2)}
.drow .pn{font-weight:700;font-size:15px;line-height:1.3}
.drow .pm{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drow .add{color:var(--ink3);font-size:14px}
.drow .gap{font-size:11px;color:var(--ink3);font-family:var(--mono);text-align:right;line-height:1.4}
.pos{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--line);color:var(--ink)}
.team{font-family:var(--mono);font-size:11px;color:var(--ink2)}

/* roster */
.poscount{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:64px}
.pc .k{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.pc .n{font-family:var(--disp);font-size:26px;line-height:1.1}
.rhead{position:sticky;top:0;z-index:30;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;
  margin:0 -28px 16px;padding:12px 28px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.rh-l{display:flex;align-items:center;gap:16px;flex-wrap:wrap;min-width:0}
.rh-n{font-family:var(--disp);font-size:46px;line-height:.9;color:var(--me)}
.rh-n small{font-family:var(--sans);font-size:13px;color:var(--ink2);margin-left:6px;font-weight:500}
.rh-pos{display:flex;gap:5px;flex-wrap:wrap}
.rh-pos span{font-family:var(--mono);font-size:11.5px;background:var(--card2);border:1px solid var(--line);border-radius:7px;padding:3px 7px;color:var(--ink2)}
.rh-pos b{color:var(--ink);font-weight:700;margin-left:3px}
.rh-r{display:flex;align-items:center;gap:10px}
.rh-mv{font-size:12.5px;color:var(--ink2)}
.rh-mv b{font-family:var(--mono);color:var(--ink)}
.pcard{position:relative}
/* 球隊配色：左邊色條 + 右側淡淡的隊色漸層 + logo 浮水印 */
.tm{position:relative;overflow:hidden;border-left:5px solid var(--tc)!important;
  background:linear-gradient(100deg,var(--card) 52%,color-mix(in srgb,var(--tc) 13%,#fff) 100%)!important}
.tm>*:not(.tmlogo):not(.act){position:relative;z-index:1}
.tm>.act{z-index:2}
.tm .tmlogo{position:absolute;z-index:0;right:-10px;bottom:-18px;width:92px;height:92px;object-fit:contain;opacity:.2;pointer-events:none}
.drow.tm .tmlogo{right:64px;bottom:-22px;width:84px;height:84px;opacity:.16}
.pcard.out.tm{border-left-color:var(--line2)!important;background:var(--card2)!important}
.pcard.out .tmlogo{filter:grayscale(1);opacity:.1}
.tchip{display:inline-flex;align-items:center;gap:4px;background:var(--tc);color:var(--tci);font-family:var(--mono);font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px 1px 2px;line-height:16px;white-space:nowrap}
.tchip img{width:14px;height:14px;object-fit:contain;background:#fff;border-radius:50%;padding:1px}
.tchip.noimg{padding-left:6px}
.tchip small{font-family:var(--sans);font-weight:500;font-size:10.5px;opacity:.9}
.pcard.out .tchip{filter:grayscale(.85);opacity:.8}
.pcard .act{position:absolute;top:10px;right:10px;border:1px solid var(--line2);background:var(--card);color:var(--ink2);border-radius:999px;font-size:12px;padding:3px 10px;cursor:pointer}
.pcard .act:hover{border-color:var(--loss);color:var(--loss)}
.pcard .act.back:hover{border-color:var(--win);color:var(--win)}
.pcard .pn{padding-right:58px}
.tl{background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.tlr{display:grid;grid-template-columns:50px 74px minmax(0,1fr);gap:10px;align-items:center;padding:10px 14px;border-top:1px solid var(--line);cursor:pointer;font-size:14px}
.tlr:first-child{border-top:0}
.tlr:hover{background:var(--card2)}
.tlr .d{font-family:var(--mono);font-size:12px;color:var(--ink3)}
.tlr .who{min-width:0}
.tlr .who b{font-weight:700}
.tlr .who .nt{display:block;font-size:12px;color:var(--ink3);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mv{display:inline-flex;align-items:center;justify-content:center;gap:3px;font-size:12px;font-weight:700;border-radius:7px;padding:3px 0;width:68px}
.mv.in{background:#E7F6EE;color:var(--win)} .mv.out{background:#FCEBEA;color:var(--loss)}
.mv.trade{background:#EAF1FB;color:var(--op)} .mv.draft{background:var(--meSoft);color:var(--me)}
.plog{display:flex;flex-direction:column;gap:6px}
.plog .r{display:grid;grid-template-columns:72px 74px 1fr auto;gap:8px;align-items:center;font-size:13px;background:var(--card2);border-radius:9px;padding:6px 8px}
.plog .r .d{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.plog .r .n{color:var(--ink2);font-size:12.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.plog .r button{border:0;background:none;color:var(--ink3);font-size:16px;cursor:pointer;line-height:1}
.plog .r button:hover{color:var(--loss)}
@media (max-width:640px){
  .rhead{margin:0 -16px 14px;padding:10px 16px}
  .rh-n{font-size:38px}
  .rh-mv{display:none}
  .rhead{flex-wrap:nowrap;gap:8px}
  .rh-l{gap:10px;flex-wrap:nowrap}
  .rh-n{flex:none}
  .rh-pos{gap:4px}
  .rh-pos span{font-size:10.5px;padding:2px 5px}
  .rh-r{flex:none}
  .tlr{grid-template-columns:42px 70px minmax(0,1fr);gap:8px;padding:10px 12px}
  .plog .r{grid-template-columns:60px 70px 1fr auto}
}
.rgroup{margin:6px 0 18px}
.rgroup h3{font-size:13px;color:var(--ink2);font-weight:500;margin:0 0 8px;letter-spacing:.05em}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.pcard{box-shadow:var(--shadow);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.pcard:hover{border-color:var(--line2)}
.pcard.out{background:var(--card2);box-shadow:none}
.pcard.out .pn{color:var(--ink2)}
.pcard .pn{font-weight:700;font-size:15px}
.pcard .pm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--ink2)}
.how{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.how.draft{border-color:var(--meLine);color:var(--me2)}
.how.fa{border-color:#BFE3CE;color:var(--win)}
.how.trade{border-color:#C7D9F1;color:#2F66B0}

/* weeks */
.wlist{display:flex;flex-direction:column;gap:10px}
.wk{box-shadow:var(--shadow);background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wk-h{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:12px 16px;cursor:pointer}
.wk-n{font-family:var(--disp);font-size:28px;line-height:1;color:var(--ink2);min-width:44px}
.wk-n small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3)}
.wk-o{font-weight:700;font-size:15px}
.wk-o .d{display:block;font-weight:400;font-size:12px;color:var(--ink3);font-family:var(--mono);margin-top:2px}
.wk-s{font-family:var(--disp);font-size:30px;letter-spacing:.04em;line-height:1}
.res{font-family:var(--disp);font-size:20px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;line-height:1}
.res.W{background:rgba(61,190,122,.16);color:var(--win)}
.res.L{background:rgba(229,83,75,.16);color:var(--loss)}
.res.T{background:rgba(154,163,175,.16);color:var(--tie)}
.res.P{background:var(--line);color:var(--ink3);font-size:13px;font-family:var(--sans)}
.wk-b{display:none;border-top:1px solid var(--line);padding:12px 16px 16px}
.wk.open .wk-b{display:block}
.box{width:100%;max-width:640px;border-collapse:collapse;font-size:13.5px}
.box th{font-weight:500;color:var(--ink3);font-size:11.5px;text-align:right;padding:6px 10px;letter-spacing:.05em}
.box th:first-child{text-align:left}
.box td{padding:7px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono)}
.box td:first-child{text-align:left;font-family:var(--mono);color:var(--ink2);font-size:12.5px}
.box td .v{display:inline-block;padding:2px 8px;border-radius:7px;min-width:56px}
.box td.win{color:var(--ink);font-weight:700}
.box td.me.win .v{background:rgba(217,98,28,.12);box-shadow:inset 0 0 0 1px rgba(217,98,28,.45)}
.box td.op.win .v{background:rgba(59,123,208,.11);box-shadow:inset 0 0 0 1px rgba(59,123,208,.42)}
.box td.dim{color:var(--ink3)}
.box .lowtag{font-size:10px;color:var(--ink3);margin-left:4px}
.wk-note{font-size:13px;color:var(--ink2);margin-top:10px;white-space:pre-wrap}
.wk-act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

/* stats */
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sgrid>*{min-width:0}
.panel{box-shadow:var(--shadow);background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:4px}
.panel .ps{font-size:12px;color:var(--ink3);margin-bottom:12px}
.panel.full{grid-column:1/-1}
.crow{display:grid;grid-template-columns:62px 1fr 74px 96px;gap:10px;align-items:center;padding:6px 0;font-size:13px;position:relative}
.crow .ck{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.crow .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex;gap:2px}
.crow .seg{height:100%}
.crow .seg.w{background:var(--win);border-radius:5px 0 0 5px}
.crow .seg.t{background:var(--tie)}
.crow .seg.l{background:var(--loss);border-radius:0 5px 5px 0}
.crow .pct{font-family:var(--mono);text-align:right}
.crow .rec{font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right}
.crow:hover .tip{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:2px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.catpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.catpick button{border:1px solid var(--line2);background:var(--card2);color:var(--ink2);border-radius:999px;padding:4px 11px;font-family:var(--mono);font-size:12px;cursor:pointer}
.catpick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.ctip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12px;min-width:130px;box-shadow:0 10px 28px rgba(16,24,40,.14);display:none;z-index:5}
.ctip .t{color:var(--ink2);margin-bottom:4px}
.ctip .r{display:flex;justify-content:space-between;gap:14px;font-family:var(--mono)}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--ink3);font-size:11.5px;text-align:right;padding:6px 8px;letter-spacing:.04em;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono);white-space:nowrap}
.tbl td:first-child{font-family:var(--sans);font-weight:500}
.scroll-x{overflow-x:auto}
.avgtbl td.better{color:var(--me2)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(22,24,29,.32);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 14px;overflow-y:auto}
.modal.open{display:flex}
.mbox{background:var(--card);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:560px;padding:20px 22px 18px;animation:pop .2s ease;margin:auto 0}
.mbox.wide{max-width:640px}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mbox h3{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.mbox h3 .x{border:0;background:none;color:var(--ink3);font-size:22px;cursor:pointer;line-height:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--ink2)}
.fld input,.fld select,.fld textarea{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:14.5px;width:100%;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--me)}
.fld textarea{resize:vertical;min-height:70px}
.fld .help{font-size:11.5px;color:var(--ink3);line-height:1.5}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{border:1px solid var(--line2);background:var(--card2);border-radius:8px;padding:6px 11px;font-family:var(--mono);font-size:12.5px;cursor:pointer;color:var(--ink2)}
.toggles button.on{background:var(--me);border-color:var(--me);color:#fff}
.mact{display:flex;justify-content:space-between;gap:8px;margin-top:18px;align-items:center}
.mact .r{display:flex;gap:8px;margin-left:auto}
.statin{width:100%;border-collapse:collapse;margin-top:6px}
.statin th{font-size:11.5px;font-weight:500;color:var(--ink3);text-align:center;padding:4px 6px}
.statin th:first-child{text-align:left}
.statin td{padding:3px 4px}
.statin td:first-child{font-family:var(--mono);font-size:12.5px;color:var(--ink2);white-space:nowrap;padding-right:8px}
.statin input{width:100%;background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-family:var(--mono);font-size:14px;text-align:right;outline:none}
.statin input:focus{border-color:var(--me)}
.wgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.wgrid label{display:flex;flex-direction:column;gap:3px;font-family:var(--mono);font-size:11px;color:var(--ink2)}
.wgrid input{background:var(--card2);border:1px solid var(--line2);border-radius:8px;padding:7px 6px;font-family:var(--mono);font-size:13.5px;text-align:right;width:100%;outline:none}
.statin tr.sep td{padding-top:12px;font-size:11px;color:var(--ink3);font-family:var(--sans)}
.statin tr.main input{font-size:16px;font-weight:700;border-color:var(--meLine);background:var(--meSoft)}
.ptsline{font-family:var(--disp);letter-spacing:.03em}
.ptsline .me{color:var(--ink)} .ptsline .op{color:var(--ink2)}
.ptsline small{font-family:var(--sans);font-size:12px;color:var(--ink3);margin:0 4px}
.wk-s.pt{font-size:26px}
.sb .v.ptsline{font-size:32px;white-space:nowrap}
.sb .v.ptsline small{margin:0 3px}
@media (max-width:640px){.sb .v.ptsline{font-size:24px}}
.srcrow{display:grid;grid-template-columns:52px 1fr 120px;gap:10px;align-items:center;padding:6px 0;font-size:13px}
.srcrow .ck{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.srcrow .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.srcrow .fill{height:100%;background:var(--me);border-radius:0 4px 4px 0}
.srcrow .fill.neg{background:var(--loss)}
.srcrow .vv{font-family:var(--mono);text-align:right;font-size:12.5px}
.srcrow .vv span{color:var(--ink3)}
.kv{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--card2);border-radius:12px;padding:10px 12px}
.kv .k{font-size:11.5px;color:var(--ink3)}
.kv .v{font-family:var(--disp);font-size:28px;line-height:1.1;margin-top:2px}
.kv .v small{font-family:var(--sans);font-size:11.5px;color:var(--ink3);margin-left:4px}
@media (max-width:640px){.wgrid{grid-template-columns:repeat(3,1fr)}}
.statin td.flag{width:34px;text-align:center;font-family:var(--disp);font-size:16px}
.statin td.flag.W{color:var(--win)} .statin td.flag.L{color:var(--loss)} .statin td.flag.T{color:var(--tie)}
.livescore{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:12px;font-family:var(--disp);font-size:28px;letter-spacing:.04em}
.livescore .res{width:34px;height:34px;font-size:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:860px){
  .board{grid-template-columns:1fr 1fr}
  .sgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .wrap{padding:0 16px 90px}
  .sb .v{font-size:36px} .sb.hero .v{font-size:44px}
  .board{gap:8px}
  .lgs{display:grid;grid-template-columns:1fr 1fr}

  .lg.add{display:none}
  .sb{padding:12px 13px}
  .dlist,.plist{grid-template-columns:1fr}

  .fg{grid-template-columns:1fr}
  .crow{grid-template-columns:52px 1fr 54px 78px;gap:7px}

}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--me2);outline-offset:2px}

<!-- 球員 -->

<!-- 對戰 -->

<script>
/* ===== 設定 ===== */
const REPO='sumoai-boop/sumoai-boop.github.io', BRANCH='main', FILE='fantasy-data.json';
const RAW_URL='https://raw.githubusercontent.com/'+REPO+'/'+BRANCH+'/'+FILE;
const API_URL='https://api.github.com/repos/'+REPO+'/contents/'+FILE;
const LS={data:'fb_data',dirty:'fb_dirty',tomb:'fb_tomb',sha:'gh_json_sha_fantasy',token:'sumoai_gh_token',view:'fb_view',cat:'fb_trend_cat'};

/* 類別：low=越少越好，dec=比較與顯示的小數位，pct=百分比 */
const CATS=[
  {k:'FGP',l:'FG%',pct:1,dec:3},{k:'FTP',l:'FT%',pct:1,dec:3},{k:'3PTM',l:'3PTM'},{k:'3PP',l:'3PT%',pct:1,dec:3},
  {k:'PTS',l:'PTS'},{k:'OREB',l:'OREB'},{k:'REB',l:'REB'},{k:'AST',l:'AST'},{k:'ST',l:'ST'},{k:'BLK',l:'BLK'},
  {k:'TO',l:'TO',low:1},{k:'AT',l:'A/T',dec:2},{k:'TECH',l:'TECH',low:1},{k:'DD',l:'DD'}];
const POS=['PG','SG','SF','PF','C'];
/* 積分制：總分、預估分，以及可選填的六項數據（和 Yahoo 對戰頁的欄位一樣） */
const EXTRA=[{k:'FP',l:'Fan Pts',dec:2},{k:'PROJ',l:'原始預估',dec:2}];
const PSTATS=['PTS','REB','AST','BLK','ST','TO'];
const DEF_W={PTS:1,REB:1.2,AST:1.5,BLK:3,ST:3,TO:-1};
const NBA=[['ATL','老鷹'],['BOS','塞爾提克'],['BKN','籃網'],['CHA','黃蜂'],['CHI','公牛'],['CLE','騎士'],['DAL','獨行俠'],['DEN','金塊'],['DET','活塞'],['GSW','勇士'],
  ['HOU','火箭'],['IND','溜馬'],['LAC','快艇'],['LAL','湖人'],['MEM','灰熊'],['MIA','熱火'],['MIL','公鹿'],['MIN','灰狼'],['NOP','鵜鶘'],['NYK','尼克'],
  ['OKC','雷霆'],['ORL','魔術'],['PHI','七六人'],['PHX','太陽'],['POR','拓荒者'],['SAC','國王'],['SAS','馬刺'],['TOR','暴龍'],['UTA','爵士'],['WAS','巫師']];
const YAHOO='https://basketball.fantasysports.yahoo.com/nba';
const DEF_LEAGUE={name:'',team:'',teams:14,rounds:13,slot:0,week1:'',url:'',cats:['FGP','FTP','3PTM','3PP','PTS','REB','AST','ST','BLK','TO'],opps:[],u:0};
/* 兩個聯盟用固定 id，各裝置第一次開啟時會建出同一組，不會同步成重複的 */
const SEEDS=[
  {id:'lg1',name:'沒有特異功能俱樂部',teams:14,rounds:13,url:YAHOO+'/64615',cats:['FGP','FTP','3PTM','3PP','PTS','REB','AST','ST','BLK','TO','AT','TECH','DD']},
  {id:'lg2',name:'馬化騰',teams:16,rounds:13,url:'',cats:['FGP','FTP','3PTM','3PP','PTS','OREB','REB','AST','ST','BLK','TO']}];
/* ===== 狀態 ===== */
let D={leagues:[],players:[],weeks:[]};
let curLg=lsGetRaw('fb_cur','lg1');
function lsGetRaw(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
let isDemo=false,pushing=false,loading=true,view='draft',curP=null,curW=null,openWeeks=new Set();

/* ===== 工具 ===== */
const $=id=>document.getElementById(id);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function p2(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function todayStr(){return dstr(new Date())}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)}
function md(s){return s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):''}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function catOf(k){return CATS.find(c=>c.k===k)||EXTRA.find(c=>c.k===k)}
function LG(){return D.leagues.find(l=>l.id===curLg)||D.leagues[0]||normL(SEEDS[0])}
function Pl(){const id=LG().id;return D.players.filter(p=>p.lg===id)}
function Wk(){const id=LG().id;return D.weeks.filter(w=>w.lg===id)}
function setLg(id){curLg=id;lsSet('fb_cur',id)}
function isPts(lg){return (lg||LG()).mode==='pts'}
function activeCats(){const a=(LG().cats||[]).filter(k=>catOf(k));return (a.length?a:CATS.map(c=>c.k)).map(catOf)}

function logoUrl(a){const t=TC[a];return t?'https://a.espncdn.com/i/teamlogos/nba/500/'+t[2]+'.png':''}
function inkOn(hex){const n=parseInt(hex.slice(1),16),r=n>>16&255,g=n>>8&255,b=n&255;return (r*299+g*587+b*114)/1000>150?'#16181D':'#FFFFFF'}

let _tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2600)}

function b64enc(s){const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(s){const bin=atob(String(s).replace(/\s/g,''));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)}

/* 數值：百分比輸入 47.5 → .475；空白 → null */
function parseVal(cat,s){
  s=String(s==null?'':s).trim().replace(/,/g,'');if(s==='')return null;
  let v=parseFloat(s);if(!isFinite(v))return null;
  if(cat.pct&&v>1)v=v/100;
  return v;
}
function fmtVal(cat,v){
  if(v==null||!isFinite(v))return '—';
  if(cat.pct)return v.toFixed(3).replace(/^0/,'');
  if(cat.dec)return v.toFixed(cat.dec);
  return Number.isInteger(v)?String(v):v.toFixed(1);
}
function rnd(cat,v){const p=Math.pow(10,cat.dec||0);return Math.round(v*p)/p}
/* 單一類別勝負：回傳 'W' 'L' 'T' 或 null */
function judge(cat,a,b){
  if(a==null||b==null)return null;
  const x=rnd(cat,a),y=rnd(cat,b);
  if(x===y)return 'T';
  return (cat.low?x<y:x>y)?'W':'L';
}
function scoreWeek(w){return scoreWeekFor(w,LG())}
function scoreWeekFor(w,lg){
  if(isPts(lg)){
    const a=(w.me||{}).FP,b=(w.op||{}).FP;
    if(a==null||b==null)return {W:0,L:0,T:0,n:0,per:{},res:null,done:false,a,b};
    const x=Math.round(a*100),y=Math.round(b*100),res=x===y?'T':x>y?'W':'L';
    return {W:+(res==='W'),L:+(res==='L'),T:+(res==='T'),n:1,per:{FP:res},res,done:!w.end||w.end<todayStr(),a,b};
  }
  const cats=(lg.cats||[]).map(catOf).filter(Boolean);
  let W=0,L=0,T=0,n=0;const per={};
  cats.forEach(c=>{const r=judge(c,(w.me||{})[c.k],(w.op||{})[c.k]);per[c.k]=r;if(r){n++;if(r==='W')W++;else if(r==='L')L++;else T++}});
  const done=n===cats.length;
  const res=n===0?null:(W>L?'W':W<L?'L':'T');
  return {W,L,T,n,per,res,done};
}

/* ===== 正規化 ===== */
/* 異動：每位球員有自己的 log，最後一筆決定在不在隊 */
const MOVE={'選秀':{c:'draft',l:'＋ 選秀'},'自由球員':{c:'in',l:'＋ 撿人'},'交易':{c:'trade',l:'⇄ 換進'},'釋出':{c:'out',l:'− 丟掉'},'交易出':{c:'trade',l:'⇄ 換出'}};
function isOut(a){return a==='釋出'||a==='交易出'}
function sortLog(l){return l.sort((a,b)=>String(a.d).localeCompare(String(b.d))||(a.t||0)-(b.t||0))}
function statusFrom(l){const x=l[l.length-1];return !x?'在隊':x.a==='釋出'?'已釋出':x.a==='交易出'?'交易出':'在隊'}
function normP(p){
  const how=['選秀','自由球員','交易'].includes(p.how)?p.how:'選秀',date=p.date||'';
  let log=Array.isArray(p.log)?p.log.filter(x=>x&&MOVE[x.a]).map((x,i)=>({a:x.a,d:x.d||'',n:String(x.n||''),t:+x.t||i+1})):[];
  if(!log.length){log=[{a:how,d:date,n:'',t:1}];if(p.status==='已釋出'||p.status==='交易出')log.push({a:p.status==='交易出'?'交易出':'釋出',d:date,n:'',t:2})}
  sortLog(log);
  return {id:p.id||uid('p'),lg:p.lg||'lg1',name:String(p.name||'').trim(),nba:p.nba||'',pos:Array.isArray(p.pos)?p.pos.filter(x=>POS.includes(x)):[],
    how,round:+p.round||0,date,status:statusFrom(log),log,note:p.note||'',u:+p.u||0};
}
function addMove(p,a,d,n){p.log.push({a,d,n:n||'',t:Date.now()+p.log.length});sortLog(p.log);p.status=statusFrom(p.log);p.u=Date.now()}
function normW(w){const me={},op={};CATS.concat(EXTRA).forEach(c=>{const a=w.me&&w.me[c.k],b=w.op&&w.op[c.k];if(a!=null&&a!==''&&isFinite(+a))me[c.k]=+a;if(b!=null&&b!==''&&isFinite(+b))op[c.k]=+b});
  return {id:w.id||uid('w'),lg:w.lg||'lg1',week:+w.week||0,start:w.start||'',end:w.end||'',opp:String(w.opp||'').trim(),playoff:!!w.playoff,me,op,note:w.note||'',u:+w.u||0}}
function normL(l){l=Object.assign({},DEF_LEAGUE,l||{});l.id=l.id||uid('lg');l.name=String(l.name||'').trim();l.teams=Math.min(20,Math.max(2,+l.teams||14));l.rounds=Math.min(30,Math.max(1,+l.rounds||13));
  l.slot=+l.slot||0;if(l.slot>l.teams)l.slot=0;l.opps=Array.isArray(l.opps)?l.opps.map(s=>String(s).trim()).filter(Boolean):[];
  l.cats=Array.isArray(l.cats)?l.cats.filter(k=>CATS.some(c=>c.k===k)):DEF_LEAGUE.cats.slice();
  l.mode=l.mode==='pts'||l.mode==='cat'?l.mode:(/pts|points|積分/i.test(l.name)?'pts':'cat');
  const w0=l.w&&typeof l.w==='object'?l.w:{};l.w={};PSTATS.forEach(k=>{l.w[k]=isFinite(+w0[k])&&w0[k]!==''&&w0[k]!=null?+w0[k]:DEF_W[k]});l.url=String(l.url||'').trim();l.u=+l.u||0;return l}
function normAll(j){
  if(!j||typeof j!=='object'||Array.isArray(j))return null;
  const deleted=Array.isArray(j.deleted)?j.deleted:[];
  let leagues=Array.isArray(j.leagues)?j.leagues.map(normL):[];
  if(!Array.isArray(j.leagues)&&j.league&&typeof j.league==='object'){       // 舊版（只有一個聯盟）→ 併入沒有特異功能俱樂部
    const o=Object.assign({},j.league,{id:'lg1'});if(!o.name)o.name=SEEDS[0].name;leagues=[normL(o)];
  }
  return {leagues:withSeeds(leagues,deleted),players:(Array.isArray(j.players)?j.players:[]).map(normP).filter(p=>p.name),
    weeks:(Array.isArray(j.weeks)?j.weeks:[]).map(normW).filter(w=>w.week>0),deleted};
}
function withSeeds(leagues,deleted){
  const gone=new Set(getTomb().concat(deleted||[]).map(x=>x&&x.id));
  SEEDS.forEach(s=>{if(!leagues.some(l=>l.id===s.id)&&!gone.has(s.id))leagues.push(normL(Object.assign({u:0},s)))});
  if(!leagues.length)leagues.push(normL(Object.assign({u:0},SEEDS[0])));
  const ord=l=>{const i=SEEDS.findIndex(s=>s.id===l.id);return i<0?99:i};
  return leagues.sort((a,b)=>ord(a)-ord(b));
}
function emptyD(){const e=normAll({});return {leagues:e.leagues,players:[],weeks:[]}}

/* ===== 本機 / 雲端（同 buy.html：自動同步 + 依修改時間合併 + 刪除墓碑） ===== */
let syncTimer=null,failN=0,lastErr='';
function getDirty(){return +lsGet(LS.dirty,'0')||0}
function setDirty(n){lsSet(LS.dirty,String(n))}
function saveLocal(){lsSet(LS.data,JSON.stringify({version:2,leagues:D.leagues,players:D.players,weeks:D.weeks}))}
function readLocal(){try{return normAll(JSON.parse(lsGet(LS.data,'null')))}catch(e){return null}}
function getTomb(){try{const a=JSON.parse(lsGet(LS.tomb,'[]'));return Array.isArray(a)?a:[]}catch(e){return []}}
function setTomb(a){lsSet(LS.tomb,JSON.stringify(a.slice(-500)))}
function markDirty(obj){if(isDemo){render();return}if(obj)obj.u=Date.now();saveLocal();setDirty(getDirty()+1);setSync();render();scheduleSync(1500)}
function mergeList(local,remote,T){
  const m=new Map();[remote,local].forEach(L=>L.forEach(it=>{const r=m.get(it.id);if(!r||(+it.u||0)>=(+r.u||0))m.set(it.id,it)}));
  return Array.from(m.values()).filter(it=>!(T.has(it.id)&&T.get(it.id)>=(+it.u||0)));
}
function mergeAll(local,remote,tombs){
  const T=new Map();tombs.forEach(x=>{if(x&&x.id&&(!T.has(x.id)||T.get(x.id)<x.t))T.set(x.id,+x.t||0)});
  let leagues=mergeList(local.leagues,remote.leagues,T);if(!leagues.length)leagues=local.leagues.slice(0,1);
  return {leagues,
    players:mergeList(local.players,remote.players,T),weeks:mergeList(local.weeks,remote.weeks,T),
    tombs:Array.from(T,([id,t])=>({id,t})).sort((a,b)=>a.t-b.t)};
}
function setSync(mode){
  const b=$('syncBox'),t=$('syncTxt');b.className='sync';b.title='自動同步狀態';
  if(isDemo){b.classList.add('demo');t.textContent='範例模式';return}
  if(mode==='busy'||pushing){b.classList.add('busy');t.textContent='同步中…';return}
  if(loading){b.classList.add('busy');t.textContent='載入中…';return}
  const d=getDirty();
  if(d>0&&!lsGet(LS.token,'')){b.classList.add('err');t.textContent='未設定金鑰，點此設定';return}
  if(d>0&&lastErr){b.classList.add('err');t.textContent='同步失敗，點此重試';b.title=lastErr;return}
  if(d>0){b.classList.add('dirty');t.textContent='等待同步…';return}
  t.textContent='已同步';
}
function scheduleSync(ms){if(isDemo)return;clearTimeout(syncTimer);if(!lsGet(LS.token,'')){setSync();return}syncTimer=setTimeout(syncNow,ms==null?1500:ms)}
async function syncNow(){
  clearTimeout(syncTimer);
  if(isDemo||pushing||loading||getDirty()<=0)return;
  const token=lsGet(LS.token,'');if(!token){setSync();return}
  pushing=true;setSync('busy');const snap=getDirty();
  try{
    const h={Authorization:'token '+token,Accept:'application/vnd.github+json'};
    let sha=null,remote={leagues:[],players:[],weeks:[],deleted:[]};
    const r=await fetch(API_URL+'?ref='+BRANCH+'&t='+Date.now(),{headers:h,cache:'no-store'});
    if(r.ok){
      const j=await r.json();sha=j.sha;
      let txt=j.content?b64dec(j.content):null;
      if(txt==null&&j.size>0){const rr=await fetch(RAW_URL+'?t='+Date.now(),{cache:'no-store'});if(!rr.ok)throw new Error('讀不到雲端內容 '+rr.status);txt=await rr.text()}
      if(txt){const pr=normAll(JSON.parse(txt));if(!pr)throw new Error('雲端資料格式不正確，已停止同步');remote=pr}
    }else if(r.status!==404){const e=await r.json().catch(()=>({}));throw new Error('讀取失敗 '+r.status+' '+(e.message||''))}
    const mg=mergeAll(D,remote,getTomb().concat(remote.deleted));
    const body={message:'fantasy: '+mg.leagues.length+' leagues, '+mg.players.length+' players, '+mg.weeks.length+' weeks',branch:BRANCH,
      content:b64enc(JSON.stringify({version:2,updated:new Date().toISOString(),leagues:mg.leagues,players:mg.players,weeks:mg.weeks,deleted:mg.tombs.slice(-500)}))};
    if(sha)body.sha=sha;
    const res=await fetch(API_URL,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},h),body:JSON.stringify(body)});
    if(res.status===409||res.status===422)throw Object.assign(new Error('雲端剛被更新，重新合併'),{quick:true});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(res.status+' '+(e.message||''))}
    const out=await res.json();lsSet(LS.sha,(out.content&&out.content.sha)||'');
    setTomb(mg.tombs);
    const cur=mergeAll(D,{leagues:mg.leagues,players:mg.players,weeks:mg.weeks},mg.tombs);   // 推送期間的新修改保留到下一輪
    D.leagues=cur.leagues;D.players=cur.players;D.weeks=cur.weeks;saveLocal();
    setDirty(Math.max(0,getDirty()-snap));failN=0;lastErr='';
    if(!document.querySelector('.modal.open'))render();
  }catch(e){
    lastErr=e.message;failN++;console.warn('[自動同步]',e.message);pushing=false;setSync();
    if(!/格式不正確/.test(e.message))scheduleSync(e.quick?800:[5000,15000,30000,60000][Math.min(failN-1,3)]);
    return;
  }
  pushing=false;setSync();if(getDirty()>0)scheduleSync(1500);
}
async function init(force){
  loading=true;setSync();
  const local=readLocal();
  if(local&&!force){D=local;render()}
  try{
    const r=await fetch(RAW_URL+'?t='+Date.now(),{cache:'no-store'});
    if(r.status===404){if(force||!local){D=emptyD()}}
    else{
      if(!r.ok)throw new Error('HTTP '+r.status);
      const rm=normAll(await r.json());if(!rm)throw new Error('資料格式不正確');
      if(force||!local){D=rm;setTomb(rm.deleted);if(force)setDirty(0)}
      else{const mg=mergeAll(local,rm,getTomb().concat(rm.deleted));D={leagues:mg.leagues,players:mg.players,weeks:mg.weeks};setTomb(mg.tombs)}
      saveLocal();
    }
  }catch(e){if(!local)D=emptyD();toast('讀不到雲端資料（'+e.message+'），先顯示本機資料')}
  loading=false;setSync();render();
  if(getDirty()>0)scheduleSync(800);
}

/* ===== 選秀計算（蛇形） ===== */
function pickInRound(r){const L=LG();return r%2===1?L.slot:L.teams+1-L.slot}
function overallPick(r){return (r-1)*LG().teams+pickInRound(r)}
function draftedIn(r){return Pl().find(p=>p.how==='選秀'&&p.round===r)}

/* ===== 統計 ===== */
function sortedWeeks(){return Wk().slice().sort((a,b)=>a.week-b.week||(a.playoff-b.playoff))}
function season(){
  const o={mW:0,mL:0,mT:0,cW:0,cL:0,cT:0,played:0};
  o.pf=0;o.pa=0;o.pn=0;
  Wk().forEach(w=>{const s=scoreWeek(w);if(!s.n)return;o.cW+=s.W;o.cL+=s.L;o.cT+=s.T;
    if(s.a!=null){o.pf+=s.a;o.pa+=s.b;o.pn++}
    if(!s.done)return;o.played++;if(s.res==='W')o.mW++;else if(s.res==='L')o.mL++;else o.mT++});
  return o;
}
function catStats(){
  return activeCats().map(c=>{
    let W=0,L=0,T=0,sm=0,so=0,n=0;
    Wk().forEach(w=>{const a=w.me[c.k],b=w.op[c.k],r=judge(c,a,b);if(!r)return;n++;sm+=a;so+=b;if(r==='W')W++;else if(r==='L')L++;else T++});
    return {c,W,L,T,n,am:n?sm/n:null,ao:n?so/n:null,rate:n?(W+T*.5)/n:null};
  });
}
function wlt(W,L,T){return '<span class="wlt"><b class="w">'+W+'</b>-<b class="l">'+L+'</b>-<b class="t">'+T+'</b></span>'}
function fp(v){return v==null||!isFinite(v)?'—':(+v).toFixed(1)}
function pctTxt(x){return x==null?'—':(x*100).toFixed(0)+'%'}

function renderBoard(){
  const s=season(),last=sortedWeeks().filter(w=>scoreWeek(w).n).pop();

  const rate=(s.cW+s.cL+s.cT)?((s.cW+s.cT*.5)/(s.cW+s.cL+s.cT)):null;
  let lastHtml='<div class="v">—</div><div class="f">還沒有對戰紀錄</div>';
  if(last){const sc=scoreWeek(last);lastHtml='<div class="v">'+sc.W+'-'+sc.L+'-'+sc.T+'<small>'+(sc.done?({W:'勝',L:'敗',T:'和'}[sc.res]):'進行中')+'</small></div><div class="f">第 '+last.week+' 週 vs '+esc(last.opp||'—')+'</div>'}
  if(isPts()){
    if(last){const sc=scoreWeek(last);lastHtml='<div class="v ptsline">'+fp(sc.a)+'<small>:</small><span class="op">'+fp(sc.b)+'</span><small>'+(sc.done?({W:'勝',L:'敗',T:'和'}[sc.res]):'進行中')+'</small></div><div class="f">第 '+last.week+' 週 vs '+esc(last.opp||'—')+'</div>'}
    $('board').innerHTML=
      '<div class="sb hero"><div class="lb">對戰戰績</div><div class="v">'+s.mW+'-'+s.mL+'-'+s.mT+'</div><div class="f">'+(s.played?'已打 '+s.played+' 週':'選秀後開打')+'</div></div>'+

function renderPtsStats(){
  const el=$('v-stats'),ws=sortedWeeks().filter(w=>scoreWeek(w).n),L=LG();
  let h='<div class="bar"><h2>統計</h2><span class="hint">只計算雙方都有 Fan Pts 的週</span></div>';
  if(!ws.length){el.innerHTML=h+'<div class="card empty"><div class="big">📈</div>有對戰紀錄後，這裡會顯示每週得分走勢、得失分、<br>和預估比起來是超前還是落後。</div>';return}

  const pf=S.reduce((a,x)=>a+x.a,0),pa=S.reduce((a,x)=>a+x.b,0),n=S.length;
  const hi=S.reduce((m,x)=>x.a>m.a?x:m,S[0]),lo=S.reduce((m,x)=>x.a<m.a?x:m,S[0]);
  const pj=S.filter(x=>x.w.me.PROJ!=null),beat=pj.filter(x=>x.a>=x.w.me.PROJ).length;

    '<div><div class="k">最低單週</div><div class="v">'+fp(lo.a)+'<small>W'+lo.w.week+'</small></div></div>'+

    '<div><div class="k">差距 15 分內</div><div class="v">'+(close.length?close.filter(x=>x.res==='W').length+'-'+close.filter(x=>x.res==='L').length+'<small>險勝-惜敗</small>':'—')+'</div></div>'+
    '</div></div>';
  /* 得分來源 */
  const tot={};let any=0;PSTATS.forEach(k=>{tot[k]=0});

  h+='<div class="panel"><h3>我的得分來源</h3><div class="ps">'+(any?'用計分公式把每週填的數據換算成分數（PTS×'+L.w.PTS+'、REB×'+L.w.REB+'、AST×'+L.w.AST+'…）':'對戰時順便填 PTS、REB、AST、BLK、ST、TO，就能看出分數主要從哪裡來')+'</div>';
  if(any){const sum=PSTATS.reduce((a,k)=>a+Math.max(0,tot[k]),0)||1,mx=Math.max.apply(null,PSTATS.map(k=>Math.abs(tot[k])))||1;
    PSTATS.forEach(k=>{const v=tot[k];h+='<div class="srcrow" title="'+k+'：'+fp(v)+' 分"><span class="ck">'+k+'</span><div class="track"><div class="fill'+(v<0?' neg':'')+'" style="width:'+(Math.abs(v)/mx*100)+'%"></div></div><span class="vv">'+(v<0?'−':'')+fp(Math.abs(v))+' <span>'+(v>0?Math.round(v/sum*100)+'%':'')+'</span></span></div>'})}
  else h+='<div class="empty" style="padding:22px 10px">還沒有數據</div>';
  h+='</div>';

  h+='<div class="panel full"><h3>每週走勢</h3><div class="ps">我和當週對手的 Fan Pts'+(keys.length>1?'，也可以切換看單項數據':'')+'</div><div class="catpick" id="catPick">'+
     keys.map(k=>'<button data-k="'+k+'" class="'+(k===curCat?'on':'')+'">'+catOf(k).l+'</button>').join('')+'</div>'+
     '<div class="legend"><span><i style="background:var(--me)"></i>我</span><span><i style="background:var(--op)"></i>對手</span></div><div class="chartbox" id="trend"></div></div>';
  /* 對手 */
  const by={};S.forEach(x=>{const k=x.w.opp||'（未填）';const o=by[k]||(by[k]={n:0,W:0,L:0,T:0,pf:0,pa:0});o.n++;o.pf+=x.a;o.pa+=x.b;if(x.done)o[x.res]++});

     '</tbody></table></div></div></div>';

}

  cs.forEach(x=>{if(!x.n){h+='<tr><td>'+x.c.l+'</td><td>—</td><td>—</td><td>—</td></tr>';return}
    const r=judge(x.c,x.am,x.ao),d=x.am-x.ao;
    h+='<tr><td>'+x.c.l+'</td><td class="'+(r==='W'?'better':'')+'">'+fmtVal(x.c,x.am)+'</td><td>'+fmtVal(x.c,x.ao)+'</td><td>'+(d>0?'+':d<0?'−':'')+fmtVal(x.c,Math.abs(d))+'</td></tr>'});
  h+='</tbody></table></div></div>';
  /* 走勢 */
  const curCat=catOf(lsGet(LS.cat,'PTS'))&&activeCats().some(c=>c.k===lsGet(LS.cat,'PTS'))?lsGet(LS.cat,'PTS'):activeCats()[0].k;
  h+='<div class="panel full"><h3>每週走勢</h3><div class="ps">選一個類別，看我和當週對手的數字</div><div class="catpick" id="catPick">'+
     activeCats().map(c=>'<button data-k="'+c.k+'" class="'+(c.k===curCat?'on':'')+'">'+c.l+'</button>').join('')+'</div>'+
     '<div class="legend"><span><i style="background:var(--me)"></i>我</span><span><i style="background:var(--op)"></i>對手</span></div>'+
     '<div class="chartbox" id="trend"></div></div>';
  /* 對手 */
  const by={};sortedWeeks().forEach(w=>{const s=scoreWeek(w);if(!s.n)return;const k=w.opp||'（未填）';const o=by[k]||(by[k]={n:0,mW:0,mL:0,mT:0,cW:0,cL:0,cT:0});o.n++;o.cW+=s.W;o.cL+=s.L;o.cT+=s.T;o[{W:'mW',L:'mL',T:'mT'}[s.res]]++});
  h+='<div class="panel full"><h3>對每一隊的戰績</h3><div class="ps">一個賽季通常會碰到同一隊不只一次</div><div class="scroll-x"><table class="tbl"><thead><tr><th>對手</th><th>碰過</th><th>對戰</th><th>類別</th><th>類別勝率</th></tr></thead><tbody>'+
     Object.keys(by).sort((a,b)=>by[b].n-by[a].n).map(k=>{const o=by[k],t=o.cW+o.cL+o.cT;return '<tr><td>'+esc(k)+'</td><td>'+o.n+'</td><td>'+wlt(o.mW,o.mL,o.mT)+'</td><td>'+wlt(o.cW,o.cL,o.cT)+'</td><td>'+pctTxt(t?(o.cW+o.cT*.5)/t:null)+'</td></tr>'}).join('')+
     '</tbody></table></div></div>';

}

function drawTrend(k){
  const c=catOf(k),box=$('trend');
  const pts=sortedWeeks().filter(w=>w.me[k]!=null||w.op[k]!=null);
  if(!pts.length){box.innerHTML='<div class="empty" style="padding:24px">這個類別還沒有數字</div>';return}
  const W=Math.round(Math.max(320,Math.min(760,box.clientWidth||760))),H=W<500?220:260,ml=W<500?40:46,mr=W<500?38:44,mt=14,mb=30,iw=W-ml-mr,ih=H-mt-mb;
  const vals=[];pts.forEach(w=>{if(w.me[k]!=null)vals.push(w.me[k]);if(w.op[k]!=null)vals.push(w.op[k])});
  let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(lo===hi){lo-=lo?Math.abs(lo)*.1:1;hi+=hi?Math.abs(hi)*.1:1}
  const pad=(hi-lo)*.12;lo-=pad;hi+=pad;if(!c.pct&&lo<0&&Math.min.apply(null,vals)>=0)lo=0;
  const X=i=>ml+(pts.length===1?iw/2:i*iw/(pts.length-1)),Y=v=>mt+ih-(v-lo)/(hi-lo)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+c.l+' 每週走勢">';
  for(let g=0;g<=4;g++){const v=lo+(hi-lo)*g/4,y=Y(v);s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y+'" y2="'+y+'" stroke="#E8EAEE" stroke-width="1"/>'+
    '<text x="'+(ml-8)+'" y="'+(y+4)+'" text-anchor="end" font-family="Space Mono" font-size="10.5" fill="#8A919D">'+fmtVal(c,v)+'</text>'}
  const step=Math.max(1,Math.ceil(pts.length/(W<500?6:12)));
  pts.forEach((w,i)=>{if(i%step===0||i===pts.length-1)s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-family="Space Mono" font-size="10.5" fill="#8A919D">W'+w.week+'</text>'});
  const line=(side,col)=>{let d='',started=false,dots='';pts.forEach((w,i)=>{const v=w[side][k];if(v==null){started=false;return}d+=(started?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);started=true;
      dots+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4.5" fill="'+col+'" stroke="#FFFFFF" stroke-width="2"/>'});
    return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots};
  s+=line('op','#3B7BD0')+line('me','#D9621C');
  /* 線尾直接標籤 */
  const lastOf=side=>{for(let i=pts.length-1;i>=0;i--)if(pts[i][side][k]!=null)return [i,pts[i][side][k]];return null};
  const lm=lastOf('me'),lp=lastOf('op');
  if(lm&&lp){let ym=Y(lm[1]),yp=Y(lp[1]);if(Math.abs(ym-yp)<14){if(ym<=yp){ym-=7;yp+=7}else{ym+=7;yp-=7}}
    s+='<text x="'+(X(lm[0])+9)+'" y="'+(ym+4)+'" font-size="11.5" fill="#16181D">我</text><text x="'+(X(lp[0])+9)+'" y="'+(yp+4)+'" font-size="11.5" fill="#5B6270">對手</text>'}
  s+='<line id="xhair" x1="0" x2="0" y1="'+mt+'" y2="'+(mt+ih)+'" stroke="#8A919D" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>';
  pts.forEach((w,i)=>{const x0=pts.length===1?ml:(i===0?ml:(X(i-1)+X(i))/2),x1=pts.length===1?W-mr:(i===pts.length-1?W-mr:(X(i)+X(i+1))/2);
    s+='<rect class="hit" data-i="'+i+'" x="'+x0+'" y="'+mt+'" width="'+(x1-x0)+'" height="'+ih+'" fill="transparent"/>'});
  s+='</svg><div class="ctip" id="ctip"></div>';
  box.innerHTML=s;
  const svg=box.querySelector('svg'),tip=$('ctip'),xh=box.querySelector('#xhair');
  box.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('pointerenter',()=>{
      const i=+r.dataset.i,w=pts[i],res=judge(c,w.me[k],w.op[k]);
      xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));xh.style.display='';
      tip.innerHTML='<div class="t">第 '+w.week+' 週 vs '+esc(w.opp||'—')+'</div><div class="r"><span><i style="background:#D9621C"></i>我</span><b>'+fmtVal(c,w.me[k])+'</b></div><div class="r"><span><i style="background:#3B7BD0"></i>對手</span><b>'+fmtVal(c,w.op[k])+'</b></div>'+
        (res?'<div class="r" style="margin-top:4px;color:'+({W:'var(--win)',L:'var(--loss)',T:'var(--tie)'}[res])+'"><span>結果</span><b>'+({W:'勝',L:'敗',T:'和'}[res])+'</b></div>':'');
      tip.style.display='block';
      const sc=svg.getBoundingClientRect().width/W,bx=box.getBoundingClientRect().width;
      let left=X(i)*sc+12;if(left+tip.offsetWidth>bx)left=X(i)*sc-tip.offsetWidth-12;
      tip.style.left=Math.max(0,left)+'px';tip.style.top='8px';
    });
  });
  svg.addEventListener('pointerleave',()=>{tip.style.display='none';xh.style.display='none'});
}

function weekDates(n){const w1=LG().week1;if(!w1||!n)return null;const s=addDays(w1,(n-1)*7);return [s,addDays(s,6)]}

    :activeCats().map(c=>row(c)).join('');

/* 用計分公式從六項數據算 Fan Pts（全部空白就回傳 null） */

function readStatForm(){const me={},op={};$('statRows').querySelectorAll('input').forEach(i=>{const c=catOf(i.dataset.k),v=parseVal(c,i.value);if(v!=null)(i.dataset.s==='me'?me:op)[c.k]=v});return {me,op}}

let sCatSel=new Set(),editLg=null;
function openSettings(isNew){
  const L=isNew?normL({id:'new'}):LG();editLg=isNew?null:L.id;
  $('smTitle').textContent=isNew?'新增聯盟':'聯盟設定';
  $('sLeague').value=L.name;$('sTeam').value=L.team;$('sTeams').value=L.teams;$('sRounds').value=L.rounds;$('sWeek1').value=L.week1;$('sUrl').value=L.url;$('sOpps').value=L.opps.join('\n');
  $('sUrl').placeholder=YAHOO+'/聯盟編號';
  fillSlot(L.teams,L.slot);
  sCatSel=new Set(L.cats);
  $('sMode').value=L.mode;syncMode();
  $('sW').innerHTML=PSTATS.map(k=>'<label>'+k+'<input data-w="'+k+'" inputmode="decimal" value="'+L.w[k]+'"></label>').join('');
  $('sCats').innerHTML=CATS.map(c=>'<button type="button" data-k="'+c.k+'" class="'+(sCatSel.has(c.k)?'on':'')+'">'+c.l+'</button>').join('');
  $('sCats').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;sCatSel.has(k)?sCatSel.delete(k):sCatSel.add(k);b.classList.toggle('on')});
  $('sDel').classList.toggle('hidden',isNew||D.leagues.length<2);
  show('setModal');if(isNew)setTimeout(()=>$('sLeague').focus(),60);
}
function syncMode(){const p=$('sMode').value==='pts';$('sCatsBox').classList.toggle('hidden',p);$('sWBox').classList.toggle('hidden',!p)}
$('sMode').onchange=syncMode;
function fillSlot(n,cur){let h='<option value="0">還不知道</option>';for(let i=1;i<=n;i++)h+='<option value="'+i+'"'+(cur===i?' selected':'')+'>第 '+i+' 順位</option>';$('sSlot').innerHTML=h}
$('sTeams').addEventListener('input',()=>fillSlot(Math.min(20,Math.max(2,+$('sTeams').value||14)),+$('sSlot').value));
$('sSave').onclick=()=>{
  const name=$('sLeague').value.trim();if(!name){toast('請輸入聯盟名稱');$('sLeague').focus();return}
  const mode=$('sMode').value;
  if(mode==='cat'&&!sCatSel.size){toast('至少要選一個計分類別');return}
  const wts={};let bad=false;$('sW').querySelectorAll('input').forEach(i=>{const v=parseFloat(i.value);if(!isFinite(v))bad=true;wts[i.dataset.w]=v});
  if(mode==='pts'&&bad){toast('計分公式要填數字');return}
  const data={name,team:$('sTeam').value.trim(),teams:+$('sTeams').value,rounds:+$('sRounds').value,
    slot:+$('sSlot').value,week1:$('sWeek1').value,url:$('sUrl').value.trim(),cats:CATS.map(c=>c.k).filter(k=>sCatSel.has(k)),mode,w:bad?undefined:wts,
    opps:Array.from(new Set($('sOpps').value.split('\n').map(s=>s.trim()).filter(Boolean)))};
  let L;
  if(editLg){L=D.leagues.find(l=>l.id===editLg);Object.assign(L,normL(Object.assign({},L,data)))}
  else{L=normL(data);D.leagues.push(L);setLg(L.id);openWeeks.clear()}
  hide('setModal');markDirty(L);toast(editLg?'設定已儲存':'已新增「'+name+'」');
};
$('sDel').onclick=()=>{
  const L=D.leagues.find(l=>l.id===editLg);if(!L||D.leagues.length<2)return;
  const np=D.players.filter(p=>p.lg===L.id).length,nw=D.weeks.filter(w=>w.lg===L.id).length;
  if(!confirm('刪除聯盟「'+L.name+'」？'+(np||nw?'\n裡面的 '+np+' 位球員、'+nw+' 週對戰也會一起刪除。':'')))return;
  const ids=[L.id].concat(D.players.filter(p=>p.lg===L.id).map(p=>p.id),D.weeks.filter(w=>w.lg===L.id).map(w=>w.id));
  D.leagues=D.leagues.filter(l=>l.id!==L.id);D.players=D.players.filter(p=>p.lg!==L.id);D.weeks=D.weeks.filter(w=>w.lg!==L.id);
  if(!isDemo){const now=Date.now(),t=getTomb();ids.forEach(id=>t.push({id,t:now}));setTomb(t)}
  setLg(D.leagues[0].id);hide('setModal');markDirty(null);toast('已刪除');
};

/* ===== 範例 ===== */
function demoData(){
  const names=[['Nikola Jokić','DEN',['C']],['Shai Gilgeous-Alexander','OKC',['PG','SG']],['Jalen Brunson','NYK',['PG']],['Karl-Anthony Towns','NYK',['PF','C']],
    ['Derrick White','BOS',['PG','SG']],['Jalen Johnson','ATL',['SF','PF']],['Mikal Bridges','NYK',['SG','SF']],['Ivica Zubac','LAC',['C']],['Josh Hart','NYK',['SG','SF']],
    ['Tobias Harris','DET',['PF']],['Naz Reid','MIN',['PF','C']],['Malik Monk','SAC',['SG']],['Keegan Murray','SAC',['SF','PF']]];
  const players=names.map((n,i)=>normP({id:'dp'+i,name:n[0],nba:n[1],pos:n[2],how:'選秀',round:i+1,date:'2026-10-18',
    log:i===11?[{a:'選秀',d:'2026-10-18',t:1},{a:'釋出',d:'2026-11-09',n:'換 Ausar Thompson',t:2}]:i===10?[{a:'選秀',d:'2026-10-18',t:1},{a:'釋出',d:'2026-11-02',n:'上場時間被砍',t:2},{a:'自由球員',d:'2026-11-23',n:'先發中鋒受傷，撿回來',t:3}]:undefined}));
  players.push(normP({id:'dpx',name:'Ausar Thompson',nba:'DET',pos:['SG','SF'],how:'自由球員',date:'2026-11-09',note:'抄截阻攻雙棲，撿來補 ST/BLK',log:[{a:'自由球員',d:'2026-11-09',n:'丟掉 Malik Monk',t:1}]}));
  players.push(normP({id:'dpy',name:'Day\'Ron Sharpe',nba:'BKN',pos:['C'],how:'自由球員',date:'2026-11-02',log:[{a:'自由球員',d:'2026-11-02',n:'丟掉 Naz Reid',t:1},{a:'釋出',d:'2026-11-23',n:'換 Naz Reid',t:2}]}));
  const opps=['Splash Bros','Taipei Hoopers','Punt FT%','Rim Protectors','Triple Double Club','Courtside','Bank Shot'];
  let seed=7;const rnd2=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const gen=(b)=>({FGP:.455+rnd2()*.05+b*.006,FTP:.76+rnd2()*.07,'3PTM':Math.round(52+rnd2()*28+b*3),'3PP':.34+rnd2()*.05,PTS:Math.round(520+rnd2()*120+b*15),
    REB:Math.round(200+rnd2()*60+b*6),AST:Math.round(125+rnd2()*40+b*4),ST:Math.round(30+rnd2()*15),BLK:Math.round(20+rnd2()*14),TO:Math.round(60+rnd2()*20),
    AT:0,TECH:Math.round(rnd2()*4),DD:Math.round(6+rnd2()*8+b)});
  const weeks=[];
  for(let i=0;i<7;i++){const me=gen(1),op=gen(0);me.AT=+(me.AST/me.TO).toFixed(2);op.AT=+(op.AST/op.TO).toFixed(2);
    weeks.push(normW({id:'dw'+i,week:i+1,start:addDays('2026-10-20',i*7),end:addDays('2026-10-26',i*7),opp:opps[i],me,op,note:i===2?'Jokić 背靠背輪休兩場，PTS/REB 都差一點':''}))}
  /* 第二個聯盟：16 隊、含 OREB */
  const gen2=(b)=>{const o=gen(b);o.OREB=Math.round(48+rnd2()*22+b*3);return o};
  const players2=names.slice().reverse().map((n,i)=>normP({id:'dq'+i,lg:'lg2',name:n[0],nba:n[1],pos:n[2],how:'選秀',round:i+1,date:'2026-10-19'}));
  const opps2=['騰訊總部','微信支付','QQ 堂','鵝廠','王者榮耀'];
  const weeks2=[];for(let i=0;i<5;i++){const me=gen2(i%2?0:1),op=gen2(i%2?1:0);weeks2.push(normW({id:'dv'+i,lg:'lg2',week:i+1,start:addDays('2026-10-20',i*7),end:addDays('2026-10-26',i*7),opp:opps2[i],me,op}))}
  /* 第三個聯盟：積分制 */
  const opps3=["Shan Liao's Expert Team",'Dunk City','Free Throw Merchants','Big Men Only','Bench Mob','Clutch Gene'];
  const weeks3=[];for(let i=0;i<6;i++){const g=()=>({PTS:Math.round(500+rnd2()*130),REB:Math.round(190+rnd2()*60),AST:Math.round(110+rnd2()*45),BLK:Math.round(18+rnd2()*14),ST:Math.round(28+rnd2()*14),TO:Math.round(55+rnd2()*20)});
    const me=g(),op=g(),f=o=>+(o.PTS+o.REB*1.2+o.AST*1.5+o.BLK*3+o.ST*3-o.TO).toFixed(2);me.FP=f(me);op.FP=f(op);me.PROJ=+(me.FP+(rnd2()-.5)*80).toFixed(2);op.PROJ=+(op.FP+(rnd2()-.5)*80).toFixed(2);
    if(i===5){PSTATS.forEach(k=>{delete me[k];delete op[k]})}
    const st=addDays(todayStr(),-(6-i)*7-7);weeks3.push(normW({id:'du'+i,lg:'lg3demo',week:i+1,start:st,end:addDays(st,6),opp:opps3[i],me,op}))}
  const players3=names.slice(0,8).map((n,i)=>normP({id:'dr'+i,lg:'lg3demo',name:n[0],nba:n[1],pos:n[2],how:'選秀',round:i+1,date:'2026-10-17'}));
  return {leagues:[normL(Object.assign({},SEEDS[0],{team:'Banqiao Ballers',slot:5,week1:'2026-10-20',opps})),normL(Object.assign({},SEEDS[1],{team:'板橋大三元',slot:12,week1:'2026-10-20',opps:opps2})),
      normL({id:'lg3demo',name:'Yahoo H2H-Pts 231351',mode:'pts',team:'雞屁股',teams:10,rounds:13,slot:2,week1:'2026-10-20',opps:opps3,url:YAHOO+'/231351'})],
    players:players.concat(players2,players3),weeks:weeks.concat(weeks2,weeks3)};
}
function loadDemo(){isDemo=true;D=demoData();$('demoBar').classList.add('on');setSync();render()}
function exitDemo(){isDemo=false;$('demoBar').classList.remove('on');D=readLocal()||emptyD();setSync();render()}

/* ===== 事件 ===== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.v;lsSet(LS.view,view);render()});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m)hide(m.id)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.querySelector('.modal.open');if(m)hide(m.id);$('moreMenu').classList.remove('open')}});
$('btnMore').onclick=e=>{e.stopPropagation();$('moreMenu').classList.toggle('open')};
document.addEventListener('click',()=>$('moreMenu').classList.remove('open'));
$('moreMenu').onclick=e=>{const m=e.target.dataset.m;if(!m)return;$('moreMenu').classList.remove('open');
  if(m==='settings')openSettings(false);
  else if(m==='newlg')openSettings(true);
  else if(m==='keys'){$('kGh').value=lsGet(LS.token,'');show('keyModal')}
  else if(m==='export'){const blob=new Blob([JSON.stringify({version:2,exported:new Date().toISOString(),leagues:D.leagues,players:D.players,weeks:D.weeks},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fantasy-backup-'+todayStr()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  else if(m==='import')$('importFile').click();
  else if(m==='reload'){if(getDirty()>0&&!confirm('還有修改沒同步，重新載入會用雲端版本蓋掉本機。確定？'))return;if(isDemo)exitDemo();init(true)}
  else if(m==='demo')loadDemo();
};
$('importFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=normAll(JSON.parse(await f.text()));if(!j)throw new Error('格式不正確');
    if(!confirm('匯入 '+j.leagues.length+' 個聯盟、'+j.players.length+' 位球員、'+j.weeks.length+' 週對戰？會和現有資料合併（同一筆以新的為準）。'))return;
    if(isDemo)exitDemo();const now=Date.now();j.players.forEach(p=>p.u=now);j.weeks.forEach(w=>w.u=now);j.leagues.forEach(l=>l.u=now);
    const mg=mergeAll(j,D,[]);D={leagues:mg.leagues,players:mg.players,weeks:mg.weeks};markDirty(null);toast('已匯入')}
  catch(err){toast('匯入失敗：'+err.message)}};
$('kSave').onclick=()=>{lsSet(LS.token,$('kGh').value.trim());hide('keyModal');toast('金鑰已儲存');lastErr='';failN=0;setSync();if(getDirty()>0)scheduleSync(300)};
$('syncBox').onclick=()=>{if(isDemo)return;if(!lsGet(LS.token,'')){$('kGh').value='';show('keyModal');return}if(getDirty()>0){failN=0;syncNow()}};
$('btnExitDemo').onclick=exitDemo;
window.addEventListener('online',()=>scheduleSync(300));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&getDirty()>0)scheduleSync(300)});
window.addEventListener('beforeunload',e=>{if(!isDemo&&getDirty()>0){syncNow();e.preventDefault();e.returnValue=''}});

view=['draft','roster','weeks','stats'].includes(lsGet(LS.view,''))?lsGet(LS.view,''):'draft';
init();
</script>
