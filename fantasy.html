<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0E1116">
<title>夢幻籃球</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Noto+Sans+TC:wght@400;500;700;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0E1116; --card:#161A21; --card2:#1C212A; --line:#262C36; --line2:#323946;
  --ink:#EDEFF3; --ink2:#A3AAB6; --ink3:#6B7380;
  --me:#E06A22; --me2:#F08A48; --op:#4F8DDB;
  --win:#3DBE7A; --loss:#E5534B; --tie:#9AA3AF;
  --sans:'Noto Sans TC',system-ui,-apple-system,sans-serif; --mono:'Space Mono',ui-monospace,monospace; --disp:'Bebas Neue','Oswald',Impact,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;
  background:radial-gradient(900px 420px at 85% -120px,rgba(224,106,34,.16),transparent 70%),
             radial-gradient(700px 380px at -10% 10%,rgba(79,141,219,.08),transparent 70%)}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{position:relative;z-index:1;max-width:1240px;margin:0 auto;padding:0 28px 120px}
.hidden{display:none!important}
.num{font-family:var(--mono)}

/* header */
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:18px 0 6px}
.back{font-size:13px;color:var(--ink2);text-decoration:none}
.back:hover{color:var(--me2)}
.top-r{display:flex;align-items:center;gap:8px;position:relative}
.brand{display:flex;align-items:flex-end;gap:14px;margin:12px 0 4px;flex-wrap:wrap}
.brand h1{font-weight:900;font-size:clamp(32px,5vw,44px);letter-spacing:.06em;line-height:1}
.brand .kick{font-family:var(--mono);font-size:10.5px;letter-spacing:.2em;color:var(--me2);padding-bottom:6px}
.sub{color:var(--ink2);font-size:13.5px;margin-top:6px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sub a{color:var(--ink2);text-decoration:none;border-bottom:1px dashed var(--line2)}
.sub a:hover{color:var(--me2);border-color:var(--me2)}

.btn{font-weight:500;font-size:14px;border:1px solid var(--line2);background:var(--card);color:var(--ink);padding:8px 15px;border-radius:999px;cursor:pointer;transition:border-color .15s,background .15s,transform .1s;white-space:nowrap}
.btn:hover{border-color:var(--ink2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--me);border-color:var(--me);color:#fff}
.btn.pri:hover{background:var(--me2);border-color:var(--me2)}
.btn.danger{color:var(--loss);border-color:#5a2a28}
.btn.danger:hover{background:var(--loss);color:#fff;border-color:var(--loss)}
.btn.icon{padding:8px 12px;line-height:1}
.btn.sm{font-size:12.5px;padding:5px 11px}

.sync{display:flex;align-items:center;gap:7px;font-size:12px;color:var(--ink2);border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 12px;cursor:pointer}
.sync .dot{width:7px;height:7px;border-radius:50%;background:var(--win)}
.sync.dirty .dot{background:var(--me);animation:pulse 1.2s infinite}
.sync.busy .dot{background:var(--op);animation:pulse .8s infinite}
.sync.err .dot{background:var(--loss)}
.sync.demo .dot{background:var(--ink3)}
.sync.err{color:#F3A39E;border-color:#5a2a28}
@keyframes pulse{50%{opacity:.35}}
.menu{position:absolute;right:0;top:calc(100% + 6px);background:var(--card2);border:1px solid var(--line2);border-radius:12px;padding:6px;min-width:210px;display:none;z-index:40;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.menu.open{display:block}
.menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:8px;font-size:13.5px;cursor:pointer}
.menu button:hover{background:var(--line)}

.demo-bar{display:none;margin:12px 0 0;background:#2a2116;border:1px solid #5b3d1d;color:#F5C79C;border-radius:12px;padding:10px 14px;font-size:13px;align-items:center;justify-content:space-between;gap:10px}
.demo-bar.on{display:flex}
.demo-bar button{background:none;border:1px solid #8a5a2b;color:#F5C79C;border-radius:999px;padding:4px 12px;cursor:pointer;font-size:12.5px}

/* scoreboard */
.board{margin:20px 0 6px;display:grid;grid-template-columns:1.35fr 1fr 1fr 1fr;gap:12px}
.sb{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 16px;position:relative;overflow:hidden}
.sb .lb{font-size:12px;color:var(--ink2);letter-spacing:.04em}
.sb .v{font-family:var(--disp);font-size:44px;line-height:1;margin-top:6px;letter-spacing:.02em}
.sb .v small{font-family:var(--sans);font-size:13px;color:var(--ink2);margin-left:6px;letter-spacing:0}
.sb .f{font-size:12px;color:var(--ink3);margin-top:6px}
.sb.hero{background:linear-gradient(135deg,#2a1608 0%,var(--card) 70%);border-color:#4a2a14}
.sb.hero::after{content:"";position:absolute;right:-30px;bottom:-30px;width:130px;height:130px;border-radius:50%;
  border:2px solid rgba(224,106,34,.25);box-shadow:inset 0 0 0 26px transparent}
.sb.hero .v{color:#fff;font-size:54px}
.wlt b{font-weight:400}
.wlt .w{color:var(--win)} .wlt .l{color:var(--loss)} .wlt .t{color:var(--tie)}

/* tabs */
.tabs{display:flex;gap:4px;margin:22px 0 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:10px 16px;font-size:15px;color:var(--ink2);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap;font-weight:500}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--ink);border-bottom-color:var(--me);font-weight:700}
.view{display:none;animation:fade .25s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 0 12px;flex-wrap:wrap}
.bar h2{font-size:17px;font-weight:700}
.bar .hint{font-size:12.5px;color:var(--ink3)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px}
.empty{padding:38px 20px;text-align:center;color:var(--ink2);font-size:14px;line-height:1.8}
.empty .big{font-size:34px;margin-bottom:6px}

/* draft */
.slotpick{padding:18px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-size:14px;color:var(--ink2);margin-bottom:12px}
.slotpick select{background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:7px 10px}
.draftinfo{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.chip{display:inline-flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--ink2)}
.chip b{color:var(--ink);font-family:var(--mono);font-weight:700}
.dlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:10px}
.drow{display:grid;grid-template-columns:62px 1fr auto;gap:12px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px 10px 10px;cursor:pointer;transition:border-color .15s,transform .15s}
.drow:hover{border-color:var(--line2);transform:translateY(-1px)}
.drow .rd{background:var(--card2);border-radius:10px;text-align:center;padding:6px 0}
.drow .rd .r{font-family:var(--disp);font-size:24px;line-height:1}
.drow .rd .o{font-family:var(--mono);font-size:10.5px;color:var(--ink3);margin-top:2px}
.drow.got .rd{background:#2a1608}
.drow.got .rd .r{color:var(--me2)}
.drow .pn{font-weight:700;font-size:15px;line-height:1.3}
.drow .pm{font-size:12px;color:var(--ink2);margin-top:3px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.drow .add{color:var(--ink3);font-size:14px}
.drow .gap{font-size:11px;color:var(--ink3);font-family:var(--mono);text-align:right;line-height:1.4}
.pos{display:inline-block;font-family:var(--mono);font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--line);color:var(--ink)}
.team{font-family:var(--mono);font-size:11px;color:var(--ink2)}

/* roster */
.poscount{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.pc{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:8px 14px;text-align:center;min-width:64px}
.pc .k{font-family:var(--mono);font-size:11px;color:var(--ink2)}
.pc .n{font-family:var(--disp);font-size:26px;line-height:1.1}
.rgroup{margin:6px 0 18px}
.rgroup h3{font-size:13px;color:var(--ink2);font-weight:500;margin:0 0 8px;letter-spacing:.05em}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.pcard{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;cursor:pointer;transition:border-color .15s}
.pcard:hover{border-color:var(--line2)}
.pcard.out{opacity:.55}
.pcard .pn{font-weight:700;font-size:15px}
.pcard .pm{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12px;color:var(--ink2)}
.how{font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--line2);color:var(--ink2)}
.how.draft{border-color:#5b3d1d;color:var(--me2)}
.how.fa{border-color:#1f4a35;color:var(--win)}
.how.trade{border-color:#22395a;color:#8DB6EC}

/* weeks */
.wlist{display:flex;flex-direction:column;gap:10px}
.wk{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.wk-h{display:grid;grid-template-columns:auto 1fr auto auto;gap:14px;align-items:center;padding:12px 16px;cursor:pointer}
.wk-n{font-family:var(--disp);font-size:28px;line-height:1;color:var(--ink2);min-width:44px}
.wk-n small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.1em;color:var(--ink3)}
.wk-o{font-weight:700;font-size:15px}
.wk-o .d{display:block;font-weight:400;font-size:12px;color:var(--ink3);font-family:var(--mono);margin-top:2px}
.wk-s{font-family:var(--disp);font-size:30px;letter-spacing:.04em;line-height:1}
.res{font-family:var(--disp);font-size:20px;width:38px;height:38px;border-radius:10px;display:flex;align-items:center;justify-content:center;line-height:1}
.res.W{background:rgba(61,190,122,.16);color:var(--win)}
.res.L{background:rgba(229,83,75,.16);color:var(--loss)}
.res.T{background:rgba(154,163,175,.16);color:var(--tie)}
.res.P{background:var(--line);color:var(--ink3);font-size:13px;font-family:var(--sans)}
.wk-b{display:none;border-top:1px solid var(--line);padding:12px 16px 16px}
.wk.open .wk-b{display:block}
.box{width:100%;max-width:640px;border-collapse:collapse;font-size:13.5px}
.box th{font-weight:500;color:var(--ink3);font-size:11.5px;text-align:right;padding:6px 10px;letter-spacing:.05em}
.box th:first-child{text-align:left}
.box td{padding:7px 10px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono)}
.box td:first-child{text-align:left;font-family:var(--mono);color:var(--ink2);font-size:12.5px}
.box td .v{display:inline-block;padding:2px 8px;border-radius:7px;min-width:56px}
.box td.win{color:#fff;font-weight:700}
.box td.me.win .v{background:rgba(224,106,34,.22);box-shadow:inset 0 0 0 1px rgba(224,106,34,.5)}
.box td.op.win .v{background:rgba(79,141,219,.2);box-shadow:inset 0 0 0 1px rgba(79,141,219,.5)}
.box td.dim{color:var(--ink3)}
.box .lowtag{font-size:10px;color:var(--ink3);margin-left:4px}
.wk-note{font-size:13px;color:var(--ink2);margin-top:10px;white-space:pre-wrap}
.wk-act{display:flex;gap:8px;justify-content:flex-end;margin-top:12px}

/* stats */
.sgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px}
.sgrid>*{min-width:0}
.panel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 18px}
.panel h3{font-size:15px;font-weight:700;margin-bottom:4px}
.panel .ps{font-size:12px;color:var(--ink3);margin-bottom:12px}
.panel.full{grid-column:1/-1}
.crow{display:grid;grid-template-columns:62px 1fr 74px 96px;gap:10px;align-items:center;padding:6px 0;font-size:13px;position:relative}
.crow .ck{font-family:var(--mono);font-size:12px;color:var(--ink2)}
.crow .track{height:10px;background:var(--line);border-radius:5px;overflow:hidden;display:flex;gap:2px}
.crow .seg{height:100%}
.crow .seg.w{background:var(--win);border-radius:5px 0 0 5px}
.crow .seg.t{background:var(--tie)}
.crow .seg.l{background:var(--loss);border-radius:0 5px 5px 0}
.crow .pct{font-family:var(--mono);text-align:right}
.crow .rec{font-family:var(--mono);font-size:12px;color:var(--ink2);text-align:right}
.crow:hover .tip{display:block}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin:2px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
.catpick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.catpick button{border:1px solid var(--line2);background:var(--card2);color:var(--ink2);border-radius:999px;padding:4px 11px;font-family:var(--mono);font-size:12px;cursor:pointer}
.catpick button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chartbox{position:relative}
.chartbox svg{display:block;width:100%;height:auto;overflow:visible}
.ctip{position:absolute;pointer-events:none;background:var(--card2);border:1px solid var(--line2);border-radius:10px;padding:8px 11px;font-size:12px;min-width:130px;box-shadow:0 10px 28px rgba(0,0,0,.45);display:none;z-index:5}
.ctip .t{color:var(--ink2);margin-bottom:4px}
.ctip .r{display:flex;justify-content:space-between;gap:14px;font-family:var(--mono)}
.ctip i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:6px}
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{font-weight:500;color:var(--ink3);font-size:11.5px;text-align:right;padding:6px 8px;letter-spacing:.04em;white-space:nowrap}
.tbl th:first-child,.tbl td:first-child{text-align:left}
.tbl td{padding:8px;border-top:1px solid var(--line);text-align:right;font-family:var(--mono);white-space:nowrap}
.tbl td:first-child{font-family:var(--sans);font-weight:500}
.scroll-x{overflow-x:auto}
.avgtbl td.better{color:var(--me2)}

/* modal */
.modal{position:fixed;inset:0;background:rgba(5,7,10,.66);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;align-items:flex-start;justify-content:center;z-index:100;padding:5vh 14px;overflow-y:auto}
.modal.open{display:flex}
.mbox{background:var(--card);border:1px solid var(--line2);border-radius:18px;width:100%;max-width:560px;padding:20px 22px 18px;animation:pop .2s ease;margin:auto 0}
.mbox.wide{max-width:640px}
@keyframes pop{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}
.mbox h3{font-size:18px;font-weight:700;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center}
.mbox h3 .x{border:0;background:none;color:var(--ink3);font-size:22px;cursor:pointer;line-height:1}
.fg{display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:5px}
.fld.full{grid-column:1/-1}
.fld label{font-size:12px;color:var(--ink2)}
.fld input,.fld select,.fld textarea{background:var(--bg);border:1px solid var(--line2);border-radius:10px;padding:9px 11px;font-size:14.5px;width:100%;outline:none}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--me)}
.fld textarea{resize:vertical;min-height:70px}
.fld .help{font-size:11.5px;color:var(--ink3);line-height:1.5}
.toggles{display:flex;gap:6px;flex-wrap:wrap}
.toggles button{border:1px solid var(--line2);background:var(--bg);border-radius:8px;padding:6px 11px;font-family:var(--mono);font-size:12.5px;cursor:pointer;color:var(--ink2)}
.toggles button.on{background:var(--me);border-color:var(--me);color:#fff}
.mact{display:flex;justify-content:space-between;gap:8px;margin-top:18px;align-items:center}
.mact .r{display:flex;gap:8px;margin-left:auto}
.statin{width:100%;border-collapse:collapse;margin-top:6px}
.statin th{font-size:11.5px;font-weight:500;color:var(--ink3);text-align:center;padding:4px 6px}
.statin th:first-child{text-align:left}
.statin td{padding:3px 4px}
.statin td:first-child{font-family:var(--mono);font-size:12.5px;color:var(--ink2);white-space:nowrap;padding-right:8px}
.statin input{width:100%;background:var(--bg);border:1px solid var(--line2);border-radius:8px;padding:7px 9px;font-family:var(--mono);font-size:14px;text-align:right;outline:none}
.statin input:focus{border-color:var(--me)}
.statin td.flag{width:34px;text-align:center;font-family:var(--disp);font-size:16px}
.statin td.flag.W{color:var(--win)} .statin td.flag.L{color:var(--loss)} .statin td.flag.T{color:var(--tie)}
.livescore{display:flex;align-items:center;justify-content:center;gap:12px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:12px;font-family:var(--disp);font-size:28px;letter-spacing:.04em}
.livescore .res{width:34px;height:34px;font-size:18px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;z-index:200;pointer-events:none;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%)}

@media (max-width:860px){
  .board{grid-template-columns:1fr 1fr}
  .sgrid{grid-template-columns:minmax(0,1fr)}
}
@media (max-width:640px){
  .wrap{padding:0 16px 90px}
  .sb .v{font-size:36px} .sb.hero .v{font-size:44px}
  .board{gap:8px}
  .sb{padding:12px 13px}
  .dlist,.plist{grid-template-columns:1fr}
  .wk-h{grid-template-columns:auto 1fr auto;gap:10px}
  .wk-h .wk-s{grid-column:2;grid-row:2;font-size:24px}
  .wk-h .res{grid-column:3;grid-row:1/span 2}
  .fg{grid-template-columns:1fr}
  .crow{grid-template-columns:52px 1fr 54px 78px;gap:7px}
  .mbox{padding:18px 16px 16px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
:focus-visible{outline:2px solid var(--me2);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="index.html">‹ 主畫面</a>
    <div class="top-r">
      <button type="button" class="sync" id="syncBox" title="自動同步狀態"><span class="dot"></span><span id="syncTxt">已同步</span></button>
      <button class="btn icon" id="btnMore" aria-label="更多">⋯</button>
      <div class="menu" id="moreMenu">
        <button data-m="settings">聯盟設定</button>
        <button data-m="keys">設定 GitHub 金鑰</button>
        <button data-m="export">匯出備份 JSON</button>
        <button data-m="import">匯入 JSON</button>
        <button data-m="reload">重新從雲端載入</button>
        <button data-m="demo">看範例資料</button>
      </div>
    </div>
  </div>
  <div class="brand"><h1>夢幻籃球</h1><span class="kick" id="kick">YAHOO FANTASY NBA</span></div>
  <p class="sub"><span id="leagueName"></span><a id="yLink" href="#" target="_blank" rel="noopener">開啟 Yahoo 聯盟 ↗</a></p>

  <div class="demo-bar" id="demoBar"><span>範例模式：這些是示範資料，不會儲存也不會同步。</span><button id="btnExitDemo">結束範例</button></div>

  <section class="board" id="board"></section>

  <nav class="tabs" id="tabs">
    <button class="tab" data-v="draft">選秀</button>

<script>
/* ===== 設定 ===== */
const REPO='sumoai-boop/sumoai-boop.github.io', BRANCH='main', FILE='fantasy-data.json';
const RAW_URL='https://raw.githubusercontent.com/'+REPO+'/'+BRANCH+'/'+FILE;
const API_URL='https://api.github.com/repos/'+REPO+'/contents/'+FILE;
const LS={data:'fb_data',dirty:'fb_dirty',tomb:'fb_tomb',sha:'gh_json_sha_fantasy',token:'sumoai_gh_token',view:'fb_view',cat:'fb_trend_cat'};

/* 類別：low=越少越好，dec=比較與顯示的小數位，pct=百分比 */
const CATS=[
  {k:'FGP',l:'FG%',pct:1,dec:3},{k:'FTP',l:'FT%',pct:1,dec:3},{k:'3PTM',l:'3PTM'},{k:'3PP',l:'3PT%',pct:1,dec:3},
  {k:'PTS',l:'PTS'},{k:'REB',l:'REB'},{k:'AST',l:'AST'},{k:'ST',l:'ST'},{k:'BLK',l:'BLK'},
  {k:'TO',l:'TO',low:1},{k:'AT',l:'A/T',dec:2},{k:'TECH',l:'TECH',low:1},{k:'DD',l:'DD'}];
const POS=['PG','SG','SF','PF','C'];
const NBA=[['ATL','老鷹'],['BOS','塞爾提克'],['BKN','籃網'],['CHA','黃蜂'],['CHI','公牛'],['CLE','騎士'],['DAL','獨行俠'],['DEN','金塊'],['DET','活塞'],['GSW','勇士'],
  ['HOU','火箭'],['IND','溜馬'],['LAC','快艇'],['LAL','湖人'],['MEM','灰熊'],['MIA','熱火'],['MIL','公鹿'],['MIN','灰狼'],['NOP','鵜鶘'],['NYK','尼克'],
  ['OKC','雷霆'],['ORL','魔術'],['PHI','七六人'],['PHX','太陽'],['POR','拓荒者'],['SAC','國王'],['SAS','馬刺'],['TOR','暴龍'],['UTA','爵士'],['WAS','巫師']];
const DEF_LEAGUE={name:'',team:'',teams:14,rounds:13,slot:0,week1:'',url:'https://basketball.fantasysports.yahoo.com/nba/64615',cats:CATS.map(c=>c.k),opps:[],u:0};

/* ===== 狀態 ===== */
let D={league:Object.assign({},DEF_LEAGUE),players:[],weeks:[]};
let isDemo=false,pushing=false,loading=true,view='draft',curP=null,curW=null,openWeeks=new Set();

/* ===== 工具 ===== */
const $=id=>document.getElementById(id);
function lsGet(k,d){try{const v=localStorage.getItem(k);return v==null?d:v}catch(e){return d}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function p2(n){return String(n).padStart(2,'0')}
function dstr(d){return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
function todayStr(){return dstr(new Date())}
function addDays(s,n){const d=new Date(s+'T00:00:00');d.setDate(d.getDate()+n);return dstr(d)}
function md(s){return s?(+s.slice(5,7))+'/'+(+s.slice(8,10)):''}
function uid(p){return p+Date.now().toString(36)+Math.random().toString(36).slice(2,6)}
function catOf(k){return CATS.find(c=>c.k===k)}
function activeCats(){const a=(D.league.cats||[]).filter(k=>catOf(k));return (a.length?a:CATS.map(c=>c.k)).map(catOf)}
function teamZh(a){const t=NBA.find(x=>x[0]===a);return t?t[1]:''}
let _tt;function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(_tt);_tt=setTimeout(()=>t.classList.remove('show'),2600)}
function show(id){$(id).classList.add('open');document.body.style.overflow='hidden'}
function hide(id){$(id).classList.remove('open');if(!document.querySelector('.modal.open'))document.body.style.overflow=''}
function b64enc(s){const b=new TextEncoder().encode(s);let bin='';for(let i=0;i<b.length;i+=0x8000)bin+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(bin)}
function b64dec(s){const bin=atob(String(s).replace(/\s/g,''));const b=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)b[i]=bin.charCodeAt(i);return new TextDecoder().decode(b)}

/* 數值：百分比輸入 47.5 → .475；空白 → null */
function parseVal(cat,s){
  s=String(s==null?'':s).trim().replace(/,/g,'');if(s==='')return null;
  let v=parseFloat(s);if(!isFinite(v))return null;
  if(cat.pct&&v>1)v=v/100;
  return v;
}
function fmtVal(cat,v){
  if(v==null||!isFinite(v))return '—';
  if(cat.pct)return v.toFixed(3).replace(/^0/,'');
  if(cat.dec)return v.toFixed(cat.dec);
  return Number.isInteger(v)?String(v):v.toFixed(1);
}
function rnd(cat,v){const p=Math.pow(10,cat.dec||0);return Math.round(v*p)/p}
/* 單一類別勝負：回傳 'W' 'L' 'T' 或 null */
function judge(cat,a,b){
  if(a==null||b==null)return null;
  const x=rnd(cat,a),y=rnd(cat,b);
  if(x===y)return 'T';
  return (cat.low?x<y:x>y)?'W':'L';
}
function scoreWeek(w){
  let W=0,L=0,T=0,n=0;const per={};
  activeCats().forEach(c=>{const r=judge(c,(w.me||{})[c.k],(w.op||{})[c.k]);per[c.k]=r;if(r){n++;if(r==='W')W++;else if(r==='L')L++;else T++}});
  const done=n===activeCats().length;
  const res=n===0?null:(W>L?'W':W<L?'L':'T');
  return {W,L,T,n,per,res,done};
}

/* ===== 正規化 ===== */
function normP(p){return {id:p.id||uid('p'),name:String(p.name||'').trim(),nba:p.nba||'',pos:Array.isArray(p.pos)?p.pos.filter(x=>POS.includes(x)):[],
  how:['選秀','自由球員','交易'].includes(p.how)?p.how:'選秀',round:+p.round||0,date:p.date||'',status:['在隊','已釋出','交易出'].includes(p.status)?p.status:'在隊',note:p.note||'',u:+p.u||0}}
function normW(w){const me={},op={};CATS.forEach(c=>{const a=w.me&&w.me[c.k],b=w.op&&w.op[c.k];if(a!=null&&a!==''&&isFinite(+a))me[c.k]=+a;if(b!=null&&b!==''&&isFinite(+b))op[c.k]=+b});
  return {id:w.id||uid('w'),week:+w.week||0,start:w.start||'',end:w.end||'',opp:String(w.opp||'').trim(),playoff:!!w.playoff,me,op,note:w.note||'',u:+w.u||0}}
function normL(l){l=Object.assign({},DEF_LEAGUE,l||{});l.teams=Math.min(20,Math.max(2,+l.teams||14));l.rounds=Math.min(30,Math.max(1,+l.rounds||13));
  l.slot=+l.slot||0;if(l.slot>l.teams)l.slot=0;l.opps=Array.isArray(l.opps)?l.opps.map(s=>String(s).trim()).filter(Boolean):[];
  l.cats=Array.isArray(l.cats)?l.cats.filter(k=>catOf(k)):CATS.map(c=>c.k);l.u=+l.u||0;return l}
function normAll(j){
  if(!j||typeof j!=='object'||Array.isArray(j))return null;
  return {league:normL(j.league),players:(Array.isArray(j.players)?j.players:[]).map(normP).filter(p=>p.name),
    weeks:(Array.isArray(j.weeks)?j.weeks:[]).map(normW).filter(w=>w.week>0),deleted:Array.isArray(j.deleted)?j.deleted:[]};
}

/* ===== 本機 / 雲端（同 buy.html：自動同步 + 依修改時間合併 + 刪除墓碑） ===== */
let syncTimer=null,failN=0,lastErr='';
function getDirty(){return +lsGet(LS.dirty,'0')||0}
function setDirty(n){lsSet(LS.dirty,String(n))}
function saveLocal(){lsSet(LS.data,JSON.stringify({league:D.league,players:D.players,weeks:D.weeks}))}
function readLocal(){try{return normAll(JSON.parse(lsGet(LS.data,'null')))}catch(e){return null}}
function getTomb(){try{const a=JSON.parse(lsGet(LS.tomb,'[]'));return Array.isArray(a)?a:[]}catch(e){return []}}
function setTomb(a){lsSet(LS.tomb,JSON.stringify(a.slice(-500)))}
function markDirty(obj){if(isDemo){render();return}if(obj)obj.u=Date.now();saveLocal();setDirty(getDirty()+1);setSync();render();scheduleSync(1500)}
function mergeList(local,remote,T){
  const m=new Map();[remote,local].forEach(L=>L.forEach(it=>{const r=m.get(it.id);if(!r||(+it.u||0)>=(+r.u||0))m.set(it.id,it)}));
  return Array.from(m.values()).filter(it=>!(T.has(it.id)&&T.get(it.id)>=(+it.u||0)));
}
function mergeAll(local,remote,tombs){
  const T=new Map();tombs.forEach(x=>{if(x&&x.id&&(!T.has(x.id)||T.get(x.id)<x.t))T.set(x.id,+x.t||0)});
  return {league:(+local.league.u||0)>=(+remote.league.u||0)?local.league:remote.league,
    players:mergeList(local.players,remote.players,T),weeks:mergeList(local.weeks,remote.weeks,T),
    tombs:Array.from(T,([id,t])=>({id,t})).sort((a,b)=>a.t-b.t)};
}
function setSync(mode){
  const b=$('syncBox'),t=$('syncTxt');b.className='sync';b.title='自動同步狀態';
  if(isDemo){b.classList.add('demo');t.textContent='範例模式';return}
  if(mode==='busy'||pushing){b.classList.add('busy');t.textContent='同步中…';return}
  if(loading){b.classList.add('busy');t.textContent='載入中…';return}
  const d=getDirty();
  if(d>0&&!lsGet(LS.token,'')){b.classList.add('err');t.textContent='未設定金鑰，點此設定';return}
  if(d>0&&lastErr){b.classList.add('err');t.textContent='同步失敗，點此重試';b.title=lastErr;return}
  if(d>0){b.classList.add('dirty');t.textContent='等待同步…';return}
  t.textContent='已同步';
}
function scheduleSync(ms){if(isDemo)return;clearTimeout(syncTimer);if(!lsGet(LS.token,'')){setSync();return}syncTimer=setTimeout(syncNow,ms==null?1500:ms)}
async function syncNow(){
  clearTimeout(syncTimer);
  if(isDemo||pushing||loading||getDirty()<=0)return;
  const token=lsGet(LS.token,'');if(!token){setSync();return}
  pushing=true;setSync('busy');const snap=getDirty();
  try{
    const h={Authorization:'token '+token,Accept:'application/vnd.github+json'};
    let sha=null,remote={league:normL({}),players:[],weeks:[],deleted:[]};
    const r=await fetch(API_URL+'?ref='+BRANCH+'&t='+Date.now(),{headers:h,cache:'no-store'});
    if(r.ok){
      const j=await r.json();sha=j.sha;
      let txt=j.content?b64dec(j.content):null;
      if(txt==null&&j.size>0){const rr=await fetch(RAW_URL+'?t='+Date.now(),{cache:'no-store'});if(!rr.ok)throw new Error('讀不到雲端內容 '+rr.status);txt=await rr.text()}
      if(txt){const pr=normAll(JSON.parse(txt));if(!pr)throw new Error('雲端資料格式不正確，已停止同步');remote=pr}
    }else if(r.status!==404){const e=await r.json().catch(()=>({}));throw new Error('讀取失敗 '+r.status+' '+(e.message||''))}
    const mg=mergeAll(D,remote,getTomb().concat(remote.deleted));
    const body={message:'fantasy: '+mg.players.length+' players, '+mg.weeks.length+' weeks',branch:BRANCH,
      content:b64enc(JSON.stringify({version:1,updated:new Date().toISOString(),league:mg.league,players:mg.players,weeks:mg.weeks,deleted:mg.tombs.slice(-500)}))};
    if(sha)body.sha=sha;
    const res=await fetch(API_URL,{method:'PUT',headers:Object.assign({'Content-Type':'application/json'},h),body:JSON.stringify(body)});
    if(res.status===409||res.status===422)throw Object.assign(new Error('雲端剛被更新，重新合併'),{quick:true});
    if(!res.ok){const e=await res.json().catch(()=>({}));throw new Error(res.status+' '+(e.message||''))}
    const out=await res.json();lsSet(LS.sha,(out.content&&out.content.sha)||'');
    setTomb(mg.tombs);
    const cur=mergeAll(D,{league:mg.league,players:mg.players,weeks:mg.weeks},mg.tombs);   // 推送期間的新修改保留到下一輪
    D.league=cur.league;D.players=cur.players;D.weeks=cur.weeks;saveLocal();
    setDirty(Math.max(0,getDirty()-snap));failN=0;lastErr='';
    if(!document.querySelector('.modal.open'))render();
  }catch(e){
    lastErr=e.message;failN++;console.warn('[自動同步]',e.message);pushing=false;setSync();
    if(!/格式不正確/.test(e.message))scheduleSync(e.quick?800:[5000,15000,30000,60000][Math.min(failN-1,3)]);
    return;
  }
  pushing=false;setSync();if(getDirty()>0)scheduleSync(1500);
}
async function init(force){
  loading=true;setSync();
  const local=readLocal();
  if(local&&!force){D=local;render()}
  try{
    const r=await fetch(RAW_URL+'?t='+Date.now(),{cache:'no-store'});
    if(r.status===404){if(force){D={league:normL({}),players:[],weeks:[]}}}
    else{
      if(!r.ok)throw new Error('HTTP '+r.status);
      const rm=normAll(await r.json());if(!rm)throw new Error('資料格式不正確');
      if(force||!local){D=rm;setTomb(rm.deleted);if(force)setDirty(0)}
      else{const mg=mergeAll(local,rm,getTomb().concat(rm.deleted));D={league:mg.league,players:mg.players,weeks:mg.weeks};setTomb(mg.tombs)}
      saveLocal();
    }
  }catch(e){if(!local)D={league:normL({}),players:[],weeks:[]};toast('讀不到雲端資料（'+e.message+'），先顯示本機資料')}
  loading=false;setSync();render();
  if(getDirty()>0)scheduleSync(800);
}

/* ===== 選秀計算（蛇形） ===== */
function pickInRound(r){const L=D.league;return r%2===1?L.slot:L.teams+1-L.slot}
function overallPick(r){return (r-1)*D.league.teams+pickInRound(r)}
function draftedIn(r){return D.players.find(p=>p.how==='選秀'&&p.round===r)}

/* ===== 統計 ===== */
function sortedWeeks(){return D.weeks.slice().sort((a,b)=>a.week-b.week||(a.playoff-b.playoff))}
function season(){
  const o={mW:0,mL:0,mT:0,cW:0,cL:0,cT:0,played:0};
  D.weeks.forEach(w=>{const s=scoreWeek(w);if(!s.n)return;o.played++;o.cW+=s.W;o.cL+=s.L;o.cT+=s.T;if(s.res==='W')o.mW++;else if(s.res==='L')o.mL++;else o.mT++});
  return o;
}
function catStats(){
  return activeCats().map(c=>{
    let W=0,L=0,T=0,sm=0,so=0,n=0;
    D.weeks.forEach(w=>{const a=w.me[c.k],b=w.op[c.k],r=judge(c,a,b);if(!r)return;n++;sm+=a;so+=b;if(r==='W')W++;else if(r==='L')L++;else T++});
    return {c,W,L,T,n,am:n?sm/n:null,ao:n?so/n:null,rate:n?(W+T*.5)/n:null};
  });
}
function wlt(W,L,T){return '<span class="wlt"><b class="w">'+W+'</b>-<b class="l">'+L+'</b>-<b class="t">'+T+'</b></span>'}
function pctTxt(x){return x==null?'—':(x*100).toFixed(0)+'%'}

/* ===== 渲染 ===== */
function render(){
  const L=D.league;
  $('kick').textContent='YAHOO FANTASY NBA · '+L.teams+' TEAMS · '+activeCats().length+'-CAT';
  $('leagueName').textContent=[L.name,L.team?('我的隊伍：'+L.team):''].filter(Boolean).join('　') || '還沒設定聯盟名稱';
  $('yLink').href=L.url||DEF_LEAGUE.url;
  renderBoard();
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('on',t.dataset.v===view));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+view));

function drawTrend(k){
  const c=catOf(k),box=$('trend');
  const pts=sortedWeeks().filter(w=>w.me[k]!=null||w.op[k]!=null);
  if(!pts.length){box.innerHTML='<div class="empty" style="padding:24px">這個類別還沒有數字</div>';return}
  const W=760,H=260,ml=46,mr=44,mt=14,mb=30,iw=W-ml-mr,ih=H-mt-mb;
  const vals=[];pts.forEach(w=>{if(w.me[k]!=null)vals.push(w.me[k]);if(w.op[k]!=null)vals.push(w.op[k])});
  let lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals);
  if(lo===hi){lo-=lo?Math.abs(lo)*.1:1;hi+=hi?Math.abs(hi)*.1:1}
  const pad=(hi-lo)*.12;lo-=pad;hi+=pad;if(!c.pct&&lo<0&&Math.min.apply(null,vals)>=0)lo=0;
  const X=i=>ml+(pts.length===1?iw/2:i*iw/(pts.length-1)),Y=v=>mt+ih-(v-lo)/(hi-lo)*ih;
  let s='<svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="'+c.l+' 每週走勢">';
  for(let g=0;g<=4;g++){const v=lo+(hi-lo)*g/4,y=Y(v);s+='<line x1="'+ml+'" x2="'+(W-mr)+'" y1="'+y+'" y2="'+y+'" stroke="#262C36" stroke-width="1"/>'+
    '<text x="'+(ml-8)+'" y="'+(y+4)+'" text-anchor="end" font-family="Space Mono" font-size="10.5" fill="#6B7380">'+fmtVal(c,v)+'</text>'}
  const step=Math.max(1,Math.ceil(pts.length/12));
  pts.forEach((w,i)=>{if(i%step===0||i===pts.length-1)s+='<text x="'+X(i)+'" y="'+(H-8)+'" text-anchor="middle" font-family="Space Mono" font-size="10.5" fill="#6B7380">W'+w.week+'</text>'});
  const line=(side,col)=>{let d='',started=false,dots='';pts.forEach((w,i)=>{const v=w[side][k];if(v==null){started=false;return}d+=(started?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);started=true;
      dots+='<circle cx="'+X(i)+'" cy="'+Y(v)+'" r="4.5" fill="'+col+'" stroke="#161A21" stroke-width="2"/>'});
    return '<path d="'+d+'" fill="none" stroke="'+col+'" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>'+dots};
  s+=line('op','#4F8DDB')+line('me','#E06A22');
  /* 線尾直接標籤 */
  const lastOf=side=>{for(let i=pts.length-1;i>=0;i--)if(pts[i][side][k]!=null)return [i,pts[i][side][k]];return null};
  const lm=lastOf('me'),lp=lastOf('op');
  if(lm&&lp){let ym=Y(lm[1]),yp=Y(lp[1]);if(Math.abs(ym-yp)<14){if(ym<=yp){ym-=7;yp+=7}else{ym+=7;yp-=7}}
    s+='<text x="'+(X(lm[0])+9)+'" y="'+(ym+4)+'" font-size="11.5" fill="#EDEFF3">我</text><text x="'+(X(lp[0])+9)+'" y="'+(yp+4)+'" font-size="11.5" fill="#A3AAB6">對手</text>'}
  s+='<line id="xhair" x1="0" x2="0" y1="'+mt+'" y2="'+(mt+ih)+'" stroke="#6B7380" stroke-width="1" stroke-dasharray="3 3" style="display:none"/>';
  pts.forEach((w,i)=>{const x0=pts.length===1?ml:(i===0?ml:(X(i-1)+X(i))/2),x1=pts.length===1?W-mr:(i===pts.length-1?W-mr:(X(i)+X(i+1))/2);
    s+='<rect class="hit" data-i="'+i+'" x="'+x0+'" y="'+mt+'" width="'+(x1-x0)+'" height="'+ih+'" fill="transparent"/>'});
  s+='</svg><div class="ctip" id="ctip"></div>';
  box.innerHTML=s;
  const svg=box.querySelector('svg'),tip=$('ctip'),xh=box.querySelector('#xhair');
  box.querySelectorAll('.hit').forEach(r=>{
    r.addEventListener('pointerenter',()=>{
      const i=+r.dataset.i,w=pts[i],res=judge(c,w.me[k],w.op[k]);
      xh.setAttribute('x1',X(i));xh.setAttribute('x2',X(i));xh.style.display='';
      tip.innerHTML='<div class="t">第 '+w.week+' 週 vs '+esc(w.opp||'—')+'</div><div class="r"><span><i style="background:#E06A22"></i>我</span><b>'+fmtVal(c,w.me[k])+'</b></div><div class="r"><span><i style="background:#4F8DDB"></i>對手</span><b>'+fmtVal(c,w.op[k])+'</b></div>'+
        (res?'<div class="r" style="margin-top:4px;color:'+({W:'var(--win)',L:'var(--loss)',T:'var(--tie)'}[res])+'"><span>結果</span><b>'+({W:'勝',L:'敗',T:'和'}[res])+'</b></div>':'');
      tip.style.display='block';
      const sc=svg.getBoundingClientRect().width/W,bx=box.getBoundingClientRect().width;
      let left=X(i)*sc+12;if(left+tip.offsetWidth>bx)left=X(i)*sc-tip.offsetWidth-12;
      tip.style.left=Math.max(0,left)+'px';tip.style.top='8px';
    });
  });
  svg.addEventListener('pointerleave',()=>{tip.style.display='none';xh.style.display='none'});
}

  $('pHow').value=v.how;$('pStatus').value=v.status;$('pDate').value=v.date||'';$('pNote').value=v.note||'';

$('pHow').onchange=syncHow;
$('pSave').onclick=()=>{
  const name=$('pName').value.trim();if(!name){toast('請輸入球員名字');$('pName').focus();return}
  const how=$('pHow').value,round=how==='選秀'?+$('pRound').value:0;
  const clash=round?draftedIn(round):null;
  if(clash&&clash.id!==curP){toast('第 '+round+' 輪已經有 '+clash.name+'，先改掉那一位');return}
  const data={name,nba:$('pTeam').value,pos:POS.filter(k=>pPosSel.has(k)),how,round,date:$('pDate').value,status:$('pStatus').value,note:$('pNote').value.trim()};
  let p=curP&&D.players.find(x=>x.id===curP);
  if(p)Object.assign(p,data);else{p=normP(data);D.players.push(p)}
  hide('playerModal');markDirty(p);toast('已儲存 '+name);
};
$('pDel').onclick=()=>{const p=D.players.find(x=>x.id===curP);if(!p)return;
  if(!confirm('刪除 '+p.name+'？\n（球員只是被釋出的話，把狀態改成「已釋出」就好）'))return;
  D.players=D.players.filter(x=>x.id!==curP);delItem(curP);hide('playerModal');toast('已刪除')};
function delItem(id){if(!isDemo){const t=getTomb();t.push({id,t:Date.now()});setTomb(t)}markDirty(null)}

/* ===== 對戰表單 ===== */
function weekDates(n){const w1=D.league.week1;if(!w1||!n)return null;const s=addDays(w1,(n-1)*7);return [s,addDays(s,6)]}
function openWeek(id){
  const w=id?D.weeks.find(x=>x.id===id):null;curW=w?w.id:null;
  const nextN=w?w.week:(D.weeks.reduce((m,x)=>Math.max(m,x.week),0)+1);
  $('wmTitle').textContent=w?'第 '+w.week+' 週':'新增一週';
  $('wNum').value=nextN;$('wOpp').value=w?w.opp:'';$('wPlayoff').value=w&&w.playoff?'1':'0';$('wNote').value=w?w.note:'';
  const dd=weekDates(nextN);$('wStart').value=w?w.start:(dd?dd[0]:'');$('wEnd').value=w?w.end:(dd?dd[1]:'');
  $('oppList').innerHTML=D.league.opps.map(o=>'<option value="'+esc(o)+'">').join('');
  $('statRows').innerHTML=activeCats().map(c=>'<tr><td>'+c.l+(c.low?' ↓':'')+'</td><td><input data-s="me" data-k="'+c.k+'" inputmode="decimal" value="'+(w&&w.me[c.k]!=null?fmtVal(c,w.me[c.k]):'')+'"></td>'+
    '<td><input data-s="op" data-k="'+c.k+'" inputmode="decimal" value="'+(w&&w.op[c.k]!=null?fmtVal(c,w.op[c.k]):'')+'"></td><td class="flag" data-f="'+c.k+'"></td></tr>').join('');
  $('statRows').querySelectorAll('input').forEach(i=>{i.addEventListener('input',liveScore);i.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();const all=Array.from($('statRows').querySelectorAll('input'));const n=all[all.indexOf(i)+1];if(n)n.focus();else $('wSave').focus()}})});
  $('wDel').classList.toggle('hidden',!w);
  liveScore();show('weekModal');
}
$('wNum').addEventListener('change',()=>{if(curW)return;const dd=weekDates(+$('wNum').value);if(dd){$('wStart').value=dd[0];$('wEnd').value=dd[1]}});
$('wStart').addEventListener('change',()=>{const s=$('wStart').value;if(s&&!$('wEnd').value)$('wEnd').value=addDays(s,6)});
function readStatForm(){const me={},op={};$('statRows').querySelectorAll('input').forEach(i=>{const c=catOf(i.dataset.k),v=parseVal(c,i.value);if(v!=null)(i.dataset.s==='me'?me:op)[c.k]=v});return {me,op}}
function liveScore(){
  const f=readStatForm(),s=scoreWeek(f);
  activeCats().forEach(c=>{const td=$('statRows').querySelector('[data-f="'+c.k+'"]'),r=s.per[c.k];td.className='flag'+(r?' '+r:'');td.textContent=r||''});
  $('liveScore').innerHTML=s.n?wlt(s.W,s.L,s.T)+'<span class="res '+(s.done?s.res:'P')+'">'+(s.done?s.res:'進行')+'</span>':'<span style="font-family:var(--sans);font-size:13px;color:var(--ink3)">填入數字後自動算勝負</span>';
}
$('wSave').onclick=()=>{
  const n=+$('wNum').value;if(!n||n<1){toast('請填第幾週');return}
  const playoff=$('wPlayoff').value==='1';
  const dup=D.weeks.find(x=>x.week===n&&x.playoff===playoff&&x.id!==curW);
  if(dup){toast('第 '+n+' 週已經有紀錄了');return}
  const f=readStatForm(),opp=$('wOpp').value.trim();
  const data={week:n,start:$('wStart').value,end:$('wEnd').value,opp,playoff,me:f.me,op:f.op,note:$('wNote').value.trim()};
  let w=curW&&D.weeks.find(x=>x.id===curW);
  if(w)Object.assign(w,data);else{w=normW(data);D.weeks.push(w)}
  openWeeks.add(w.id);
  if(opp&&!D.league.opps.includes(opp)){D.league.opps.push(opp);D.league.u=Date.now()}
  hide('weekModal');markDirty(w);toast('第 '+n+' 週已儲存');
};
$('wDel').onclick=()=>{const w=D.weeks.find(x=>x.id===curW);if(!w)return;if(!confirm('刪除第 '+w.week+' 週的紀錄？'))return;
  D.weeks=D.weeks.filter(x=>x.id!==curW);delItem(curW);hide('weekModal');toast('已刪除')};

/* ===== 聯盟設定 ===== */
let sCatSel=new Set();
function openSettings(){
  const L=D.league;
  $('sLeague').value=L.name;$('sTeam').value=L.team;$('sTeams').value=L.teams;$('sRounds').value=L.rounds;$('sWeek1').value=L.week1;$('sUrl').value=L.url;$('sOpps').value=L.opps.join('\n');
  fillSlot(L.teams,L.slot);
  sCatSel=new Set(L.cats);
  $('sCats').innerHTML=CATS.map(c=>'<button type="button" data-k="'+c.k+'" class="'+(sCatSel.has(c.k)?'on':'')+'">'+c.l+'</button>').join('');
  $('sCats').querySelectorAll('button').forEach(b=>b.onclick=()=>{const k=b.dataset.k;sCatSel.has(k)?sCatSel.delete(k):sCatSel.add(k);b.classList.toggle('on')});
  show('setModal');
}
function fillSlot(n,cur){let h='<option value="0">還不知道</option>';for(let i=1;i<=n;i++)h+='<option value="'+i+'"'+(cur===i?' selected':'')+'>第 '+i+' 順位</option>';$('sSlot').innerHTML=h}
$('sTeams').addEventListener('input',()=>fillSlot(Math.min(20,Math.max(2,+$('sTeams').value||14)),+$('sSlot').value));
$('sSave').onclick=()=>{
  if(!sCatSel.size){toast('至少要選一個計分類別');return}
  D.league=normL(Object.assign({},D.league,{name:$('sLeague').value.trim(),team:$('sTeam').value.trim(),teams:+$('sTeams').value,rounds:+$('sRounds').value,
    slot:+$('sSlot').value,week1:$('sWeek1').value,url:$('sUrl').value.trim()||DEF_LEAGUE.url,cats:CATS.map(c=>c.k).filter(k=>sCatSel.has(k)),
    opps:Array.from(new Set($('sOpps').value.split('\n').map(s=>s.trim()).filter(Boolean)))}));
  hide('setModal');markDirty(D.league);toast('設定已儲存');
};

/* ===== 範例 ===== */
function demoData(){
  const names=[['Nikola Jokić','DEN',['C']],['Shai Gilgeous-Alexander','OKC',['PG','SG']],['Jalen Brunson','NYK',['PG']],['Karl-Anthony Towns','NYK',['PF','C']],
    ['Derrick White','BOS',['PG','SG']],['Jalen Johnson','ATL',['SF','PF']],['Mikal Bridges','NYK',['SG','SF']],['Ivica Zubac','LAC',['C']],['Josh Hart','NYK',['SG','SF']],
    ['Tobias Harris','DET',['PF']],['Naz Reid','MIN',['PF','C']],['Malik Monk','SAC',['SG']],['Keegan Murray','SAC',['SF','PF']]];
  const players=names.map((n,i)=>normP({id:'dp'+i,name:n[0],nba:n[1],pos:n[2],how:'選秀',round:i+1,status:i===11?'已釋出':'在隊',date:'2026-10-18'}));
  players.push(normP({id:'dpx',name:'Ausar Thompson',nba:'DET',pos:['SG','SF'],how:'自由球員',date:'2026-11-09',note:'抄截阻攻雙棲，撿來補 ST/BLK'}));
  const opps=['Splash Bros','Taipei Hoopers','Punt FT%','Rim Protectors','Triple Double Club','Courtside','Bank Shot'];
  let seed=7;const rnd2=()=>{seed=(seed*16807)%2147483647;return seed/2147483647};
  const gen=(b)=>({FGP:.455+rnd2()*.05+b*.006,FTP:.76+rnd2()*.07,'3PTM':Math.round(52+rnd2()*28+b*3),'3PP':.34+rnd2()*.05,PTS:Math.round(520+rnd2()*120+b*15),
    REB:Math.round(200+rnd2()*60+b*6),AST:Math.round(125+rnd2()*40+b*4),ST:Math.round(30+rnd2()*15),BLK:Math.round(20+rnd2()*14),TO:Math.round(60+rnd2()*20),
    AT:0,TECH:Math.round(rnd2()*4),DD:Math.round(6+rnd2()*8+b)});
  const weeks=[];
  for(let i=0;i<7;i++){const me=gen(1),op=gen(0);me.AT=+(me.AST/me.TO).toFixed(2);op.AT=+(op.AST/op.TO).toFixed(2);
    weeks.push(normW({id:'dw'+i,week:i+1,start:addDays('2026-10-20',i*7),end:addDays('2026-10-26',i*7),opp:opps[i],me,op,note:i===2?'Jokić 背靠背輪休兩場，PTS/REB 都差一點':''}))}
  return {league:normL({name:'範例聯盟',team:'Banqiao Ballers',teams:14,rounds:13,slot:5,week1:'2026-10-20',opps}),players,weeks};
}
function loadDemo(){isDemo=true;D=demoData();$('demoBar').classList.add('on');setSync();render()}
function exitDemo(){isDemo=false;$('demoBar').classList.remove('on');D=readLocal()||{league:normL({}),players:[],weeks:[]};setSync();render()}

/* ===== 事件 ===== */
document.querySelectorAll('.tab').forEach(t=>t.onclick=()=>{view=t.dataset.v;lsSet(LS.view,view);render()});
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>hide(b.dataset.close));
document.querySelectorAll('.modal').forEach(m=>m.addEventListener('mousedown',e=>{if(e.target===m)hide(m.id)}));
document.addEventListener('keydown',e=>{if(e.key==='Escape'){const m=document.querySelector('.modal.open');if(m)hide(m.id);$('moreMenu').classList.remove('open')}});
$('btnMore').onclick=e=>{e.stopPropagation();$('moreMenu').classList.toggle('open')};
document.addEventListener('click',()=>$('moreMenu').classList.remove('open'));
$('moreMenu').onclick=e=>{const m=e.target.dataset.m;if(!m)return;$('moreMenu').classList.remove('open');
  if(m==='settings')openSettings();
  else if(m==='keys'){$('kGh').value=lsGet(LS.token,'');show('keyModal')}
  else if(m==='export'){const blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),league:D.league,players:D.players,weeks:D.weeks},null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='fantasy-backup-'+todayStr()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
  else if(m==='import')$('importFile').click();
  else if(m==='reload'){if(getDirty()>0&&!confirm('還有修改沒同步，重新載入會用雲端版本蓋掉本機。確定？'))return;if(isDemo)exitDemo();init(true)}
  else if(m==='demo')loadDemo();
};
$('importFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const j=normAll(JSON.parse(await f.text()));if(!j)throw new Error('格式不正確');
    if(!confirm('匯入 '+j.players.length+' 位球員、'+j.weeks.length+' 週對戰？會和現有資料合併（同一筆以新的為準）。'))return;
    if(isDemo)exitDemo();const now=Date.now();j.players.forEach(p=>p.u=now);j.weeks.forEach(w=>w.u=now);j.league.u=now;
    const mg=mergeAll(j,D,[]);D={league:mg.league,players:mg.players,weeks:mg.weeks};markDirty(null);toast('已匯入')}
  catch(err){toast('匯入失敗：'+err.message)}};
$('kSave').onclick=()=>{lsSet(LS.token,$('kGh').value.trim());hide('keyModal');toast('金鑰已儲存');lastErr='';failN=0;setSync();if(getDirty()>0)scheduleSync(300)};
$('syncBox').onclick=()=>{if(isDemo)return;if(!lsGet(LS.token,'')){$('kGh').value='';show('keyModal');return}if(getDirty()>0){failN=0;syncNow()}};
$('btnExitDemo').onclick=exitDemo;
window.addEventListener('online',()=>scheduleSync(300));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&getDirty()>0)scheduleSync(300)});
window.addEventListener('beforeunload',e=>{if(!isDemo&&getDirty()>0){syncNow();e.preventDefault();e.returnValue=''}});

view=['draft','roster','weeks','stats'].includes(lsGet(LS.view,''))?lsGet(LS.view,''):'draft';
init();
</script>
