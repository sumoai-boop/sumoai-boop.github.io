<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>旅遊行程記帳｜Sumoai's Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
html,body{min-height:100vh;}
/* ════════════════════════════════════════════════
   行程記帳 — 設計系統
   紙：簽證頁般的冷灰白；墨：護照深藍；
   顏色留給資料本身（類別彩虹、當地幣紅／台幣綠）。
   唯一的大膽元素：頁首的登機證。
   ════════════════════════════════════════════════ */
:root{
  --paper:#EEEFEA;
  --sheet:#FFFFFF;
  --ink:#1A2238;
  --ink-2:#465066;
  --ink-3:#687083;
  --rule:#D6D9D1;
  --rule-soft:#E8EAE5;
  --wash:#FFEDE3;
  --accent:#F25C22;
  --accent-dk:#D2490F;
  --accent-ink:#B2400E;
  --signal:#D3343C;
  --local:#B3242B;
  --twd:#2D7A33;
  --warn:#A86400;
  --r-sheet:14px;
  --r-ctl:9px;
  --f-ui:'Noto Sans TC',system-ui,-apple-system,sans-serif;
  --f-num:'Barlow Semi Condensed','Noto Sans TC',sans-serif;
  --sb-w:252px;
  /* 給 JS 內嵌樣式沿用的舊變數名 */
  --hint:var(--ink-3);
  --ink-soft:var(--ink-2);
  --line:var(--rule);
  --line-soft:var(--rule-soft);
  --red-dk:var(--local);
  --green-dk:var(--twd);
  --amber:var(--warn);
  --card:var(--sheet);
  --panel:var(--sheet);
}
body{font-family:var(--f-ui);font-size:14px;line-height:1.5;background:var(--paper);color:var(--ink);
  -webkit-font-smoothing:antialiased;-webkit-text-size-adjust:100%;}
button,input,select,textarea{font:inherit;color:inherit;}
button{cursor:pointer;}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}

/* ── 全站共用 Menubar（不變） ── */
.global-menubar{
  position:fixed;top:0;left:0;right:0;z-index:9999;height:28px;
  background:rgba(0,0,0,0.55);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  display:flex;align-items:center;justify-content:space-between;padding:0 16px;
  font-size:12px;color:rgba(255,255,255,0.92);font-family:'Inter','Noto Sans TC',sans-serif;
}
.gm-left{display:flex;align-items:center;gap:14px;font-weight:600;}
.gm-right{display:flex;align-items:center;gap:10px;font-size:11px;opacity:0.85;}
.mb-menu{padding:0 6px;border-radius:4px;cursor:default;font-size:12px;color:rgba(255,255,255,0.95);}
.mb-menu:hover{background:rgba(255,255,255,0.2);}

/* ════════ 版面 ════════ */
.app{display:flex;min-height:100vh;padding-top:28px;}

/* ── 側欄 ── */
.sidebar{position:fixed;top:28px;left:0;bottom:0;width:var(--sb-w);z-index:200;
  background:var(--sheet);border-right:1px solid var(--rule);display:flex;flex-direction:column;
  transition:transform .3s cubic-bezier(.32,.72,0,1);}
.sb-scroll{flex:1;overflow-y:auto;padding:16px 12px 12px;scrollbar-width:thin;scrollbar-color:var(--rule) transparent;}
.btn-newtrip{width:100%;height:42px;border:none;border-radius:var(--r-ctl);background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;letter-spacing:.02em;transition:background-color .15s;}
.btn-newtrip:hover{background:var(--accent-dk);}
.btn-newtrip:active{transform:scale(.98);}
.sb-year{font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--ink-3);
  margin:20px 6px 6px;font-variant-numeric:tabular-nums;}
.trip-item{position:relative;display:flex;flex-direction:column;justify-content:center;align-items:flex-end;
  min-height:58px;padding:9px 12px;margin:2px 0;border-radius:10px;cursor:pointer;
  transition:background-color .15s;}
.trip-item:hover{background-color:#F4F5F7;}
.trip-item.active{background-color:var(--wash);}
.trip-item.active::before{content:'';position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:0 3px 3px 0;background:var(--accent);}
.trip-city{font-size:15px;font-weight:700;color:var(--ink);text-align:right;line-height:1.3;}
.trip-dates{font-family:var(--f-num);font-size:13px;font-weight:500;color:var(--ink-2);
  text-align:right;font-variant-numeric:tabular-nums;}
.sb-fn{border-top:1px solid var(--rule);padding:10px 12px;}
.fn-item{display:flex;align-items:center;gap:10px;height:38px;padding:0 10px;border-radius:8px;
  font-size:14px;font-weight:500;color:var(--ink-2);cursor:pointer;user-select:none;transition:background-color .15s,color .15s;}
.fn-item:hover{background:#F4F5F7;color:var(--ink);}
.fn-item.active{background:var(--wash);color:var(--accent-ink);font-weight:700;}
.sb-sync{border-top:1px solid var(--rule);padding:12px 14px;display:flex;align-items:center;gap:8px;font-size:13px;}
.sync-state{flex:1;display:flex;align-items:center;gap:7px;font-weight:500;}
.sync-state::before{content:'';width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.sync-state.ok{color:var(--twd);}
.sync-state.ok::before{background:var(--twd);}
.sync-state.dirty{color:var(--warn);}
.sync-state.dirty::before{background:var(--warn);animation:syncPulse 1.8s ease-in-out infinite;}
@keyframes syncPulse{50%{opacity:.35;}}
.btn-sync{height:32px;padding:0 14px;border:1px solid var(--rule);border-radius:8px;background:var(--sheet);
  font-size:13px;font-weight:700;color:var(--ink);transition:border-color .15s,background-color .15s;}
.btn-sync:hover{border-color:var(--ink);}
.sb-overlay{display:none;position:fixed;inset:28px 0 0 0;background:rgba(26,34,56,.32);z-index:199;}

/* ── 主內容 ── */
.main{flex:1;min-width:0;margin-left:var(--sb-w);padding:24px 32px 28px;}
.main-empty{margin-left:var(--sb-w);flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:10px;padding:60px 20px;text-align:center;color:var(--ink-2);}
.main-empty h2{font-size:21px;font-weight:700;color:var(--ink);}
.main-empty p{font-size:14px;max-width:26em;}
.main-empty .btn-newtrip{width:auto;padding:0 22px;margin-top:8px;}
.hamburger{display:none;width:40px;height:40px;flex-shrink:0;border:1px solid var(--rule);border-radius:10px;
  background:var(--sheet);align-items:center;justify-content:center;color:var(--ink);}

/* ════════ 登機證頁首 ════════ */
.trip-header{position:relative;display:flex;align-items:flex-start;gap:12px;margin-bottom:22px;}
.ticket{position:relative;flex:1;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 260px;
  background:var(--sheet);border-radius:var(--r-sheet);
  box-shadow:0 1px 0 rgba(26,34,56,.04),0 8px 24px -12px rgba(26,34,56,.18);}
.tk-main{padding:22px 28px 22px;min-width:0;}
.tk-route{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;}
h1.th-title{font-size:36px;font-weight:900;line-height:1.1;letter-spacing:.01em;color:var(--ink);margin:0;}
.tk-en{font-family:var(--f-num);font-size:24px;font-weight:500;color:var(--ink-2);}
.th-meta{display:block;margin-top:6px;font-size:14px;color:var(--ink-2);}
.th-meta:empty{display:none;}
.tk-fields{display:flex;flex-wrap:wrap;gap:6px 36px;margin-top:18px;}
.tk-fields:empty{display:none;}
.tk-fields div{min-width:0;}
.tk-fields dt{font-size:12px;color:var(--ink-3);}
.tk-fields dd{font-family:var(--f-num);font-size:21px;font-weight:600;line-height:1.25;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;}
.tk-fields dd small{font-family:var(--f-ui);font-size:13px;font-weight:500;color:var(--ink-2);margin-left:4px;}
/* 票根：虛線打孔 + 上下兩個缺口 */
.tk-stub{position:relative;padding:20px 24px;background:linear-gradient(var(--accent),var(--accent)) top/100% 4px no-repeat;border-radius:0 var(--r-sheet) var(--r-sheet) 0;border-left:2px dashed var(--rule);display:flex;flex-direction:column;justify-content:center;}
.tk-stub::before,.tk-stub::after{content:'';position:absolute;left:-13px;width:24px;height:24px;border-radius:50%;background:var(--paper);}
.tk-stub::before{top:-12px;}
.tk-stub::after{bottom:-12px;}
.tk-total dt{font-size:12px;color:var(--ink-3);}
.tk-total dd{font-family:var(--f-num);font-size:36px;font-weight:700;line-height:1.1;color:var(--ink);font-variant-numeric:tabular-nums;white-space:nowrap;}
.tk-total dd .cur{font-size:18px;font-weight:600;color:var(--accent);margin-right:4px;}
.tk-split{display:grid;grid-template-columns:auto 1fr;gap:2px 12px;margin-top:12px;padding-top:10px;border-top:1px solid var(--rule-soft);}
.tk-split dt{font-size:13px;color:var(--ink-2);}
.tk-split dd{font-family:var(--f-num);font-size:16px;font-weight:600;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;}
#stLocalTotal{display:none;}
.main.v-cmp .tk-split,.main.v-cmp .tk-fields{display:none;}

/* ════════ 記帳：工具列 ════════ */
.cal-toolbar{display:flex;align-items:center;gap:6px;margin-bottom:14px;flex-wrap:wrap;}
.cal-today{height:36px;padding:0 16px;border:1px solid var(--rule);border-radius:99px;background:var(--sheet);
  font-size:13px;font-weight:700;color:var(--ink);transition:border-color .15s;}
.cal-today:hover{border-color:var(--ink);}
.cal-today[hidden]{display:none;}
.cal-nav{width:36px;height:36px;border:none;border-radius:50%;background:transparent;font-size:22px;line-height:1;color:var(--ink-2);transition:background-color .15s;}
.cal-nav:hover{background:rgba(26,34,56,.07);color:var(--ink);}
.cal-range{margin-left:6px;font-family:var(--f-num);font-size:21px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.cal-seg{margin-left:auto;display:flex;padding:3px;gap:2px;background:rgba(26,34,56,.06);border-radius:99px;}
.cal-seg button{height:30px;min-width:52px;padding:0 14px;border:none;border-radius:99px;background:transparent;
  font-size:13px;font-weight:700;color:var(--ink-2);transition:background-color .18s,color .18s,box-shadow .18s;}
.cal-seg button.on{background:var(--accent);color:#fff;box-shadow:0 2px 6px -1px rgba(242,92,34,.45);}

/* 日期條 D1 D2 … */
.day-tabs{display:flex;gap:4px;margin-bottom:16px;flex-wrap:wrap;}
.day-tab{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:0;min-width:74px;padding:7px 12px 8px;
  border:1px solid transparent;border-radius:10px;background:transparent;color:var(--ink-2);text-align:left;
  transition:background-color .15s,border-color .15s,color .15s;}
.day-tab:hover{background:rgba(26,34,56,.05);}
.day-tab .tab-n{font-size:12px;font-weight:700;color:var(--ink-3);}
.day-tab .tab-d{font-family:var(--f-num);font-size:18px;font-weight:600;line-height:1.15;color:var(--ink);font-variant-numeric:tabular-nums;}
.day-tab .tab-dot{position:absolute;top:10px;right:10px;width:6px;height:6px;border-radius:50%;background:var(--local);}
.day-tab.active{background:var(--accent);border-color:var(--accent);box-shadow:0 4px 12px -4px rgba(242,92,34,.55);}
.day-tab.active .tab-n{color:rgba(255,255,255,.85);}
.day-tab.active .tab-d{color:#fff;}
.day-tab.active .tab-dot{background:#fff;}
.day-tab:active{transform:scale(.97);}

/* 記一筆 列 */
.form-row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:16px;padding:6px;
  background:var(--sheet);border:1px solid var(--rule);border-radius:12px;}
.form-row>span{color:var(--ink-3);}
.form-row input,.form-row select{height:40px;padding:0 11px;border:1px solid transparent;border-radius:8px;
  background:#F4F5F2;font-size:14px;color:var(--ink);outline:none;min-width:0;transition:border-color .15s,background-color .15s;}
.form-row input::placeholder{color:var(--ink-3);}
.form-row input:focus,.form-row select:focus{background:var(--sheet);border-color:var(--accent);}
.btn-add{height:40px;padding:0 20px;border:none;border-radius:8px;background:var(--accent);color:#fff;
  font-size:14px;font-weight:700;transition:background-color .15s;}
.btn-add:hover{background:var(--accent-dk);}
.btn-add:active{transform:scale(.97);}
.day-subtotal{display:flex;justify-content:flex-end;min-height:0;margin:-4px 2px 8px;}
.day-subtotal .ds-day{display:none;}
.ds-sum{font-family:var(--f-num);font-size:16px;font-weight:600;color:var(--local);font-variant-numeric:tabular-nums;}

/* ════════ 日曆 ════════ */
.cal-scroll{height:60vh;min-height:420px;overflow-y:auto;overflow-x:hidden;background:var(--sheet);
  border:1px solid var(--rule);border-radius:var(--r-sheet);-webkit-overflow-scrolling:touch;
  scrollbar-width:thin;scrollbar-color:var(--rule) transparent;}
.cal-scroll::-webkit-scrollbar{width:10px;}
.cal-scroll::-webkit-scrollbar-thumb{background:var(--rule);border-radius:99px;border:3px solid var(--sheet);}
.cal{position:relative;}
.cal-grid{position:absolute;inset:0;}
.cal-hline{position:absolute;left:52px;right:0;border-top:1px solid var(--rule-soft);}
.cal-hlabel{position:absolute;left:0;width:44px;text-align:right;font-family:var(--f-num);font-size:12px;font-weight:500;
  color:var(--ink-3);font-variant-numeric:tabular-nums;}
.cal-night{position:absolute;left:52px;right:0;background:rgba(26,34,56,.028);pointer-events:none;}
.cal-body{position:absolute;left:52px;right:8px;top:0;bottom:0;}
.cal-now{position:absolute;left:44px;right:0;height:0;border-top:2px solid var(--signal);z-index:6;pointer-events:none;}
.cal-now::before{content:'';position:absolute;left:0;top:-6px;width:10px;height:10px;border-radius:50%;background:var(--signal);}
.cal-ev{position:absolute;border-radius:7px;padding:4px 8px 4px 13px;overflow:hidden;cursor:pointer;color:var(--k);
  background:color-mix(in oklab,var(--c) 42%,#fff);border:1px solid color-mix(in oklab,var(--c) 62%,#fff);
  transition:box-shadow .18s,background-color .18s;}
/* 色條：內縮、圓角，像書籤一樣夾在方塊左側 */
.cal-ev::before{content:'';position:absolute;left:3px;top:3px;bottom:3px;width:4px;border-radius:2px;background:var(--c);}
.cal-ev:hover{background:color-mix(in oklab,var(--c) 50%,#fff);box-shadow:0 8px 18px -10px color-mix(in oklab,var(--c) 85%,#000);z-index:5;}
.cal-ev:active{background:color-mix(in oklab,var(--c) 56%,#fff);}
.cal-ev.ev-bg{z-index:1;}
.cal-ev:not(.ev-bg){z-index:2;}
/* 「地點」底層：淡色細斜紋＋虛線框，看得出是一段區間；疊在上面的行程加白邊與陰影浮起來 */
.cal-ev.ev-bg{background:repeating-linear-gradient(-45deg,color-mix(in oklab,var(--c) 22%,#fff) 0 7px,color-mix(in oklab,var(--c) 12%,#fff) 7px 14px);
  border:1px dashed color-mix(in oklab,var(--c) 60%,#fff);}
.cal-ev.ev-bg:hover{background:repeating-linear-gradient(-45deg,color-mix(in oklab,var(--c) 28%,#fff) 0 7px,color-mix(in oklab,var(--c) 17%,#fff) 7px 14px);}
.cal-ev.ev-v{padding:0;}
/* 地點被其他行程蓋住時，名稱直書在左側那條沒被蓋到的位置 */
.cev-vt{position:absolute;left:12px;top:6px;bottom:6px;width:1.05em;font-size:14px;font-weight:700;line-height:1.2;
  color:var(--k);word-break:break-all;overflow-wrap:anywhere;white-space:normal;overflow:hidden;text-align:center;}
.wk-ev .cev-vt{left:8px;font-size:12px;}
.ev-bg~.cal-ev:not(.ev-bg){box-shadow:0 0 0 2px #fff,0 6px 14px -8px rgba(26,34,56,.4);}
.cal-ev:not(.ev-bg):hover{z-index:5;}
.cal-ev.dg{user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;}
.ev-rs{position:absolute;left:0;right:0;bottom:0;height:8px;cursor:ns-resize;}
.ev-rs::after{content:'';position:absolute;left:50%;bottom:2px;width:18px;height:3px;margin-left:-9px;border-radius:2px;background:currentColor;opacity:0;transition:opacity .15s;}
.cal-ev.dg:hover .ev-rs::after{opacity:.35;}
.cal-ev.dragging{z-index:20;cursor:grabbing;box-shadow:0 14px 30px -8px rgba(26,34,56,.45);opacity:.94;transition:none;filter:none;}
.cal-ev.dragging .ev-rs::after{opacity:.35;}
.drag-tip{position:absolute;left:6px;top:-24px;padding:2px 8px;border-radius:6px;background:var(--ink);color:#fff;
  font-family:var(--f-num);font-size:13px;font-weight:600;white-space:nowrap;pointer-events:none;z-index:21;font-variant-numeric:tabular-nums;}
.cal-ev.dragging{overflow:visible;}
body.is-dragging,body.is-dragging *{cursor:grabbing!important;}
body.is-resizing,body.is-resizing *{cursor:ns-resize!important;}
.cev-row{display:flex;align-items:baseline;gap:8px;}
.cev-note{margin-top:3px;font-size:13px;line-height:18px;display:-webkit-box;-webkit-box-orient:vertical;overflow:hidden;color:color-mix(in oklab,var(--k) 55%,#1A2238);white-space:pre-wrap;word-break:break-word;opacity:.92;}
.cev-time{font-family:var(--f-num);font-size:13px;font-weight:500;line-height:1.3;color:color-mix(in oklab,var(--k) 78%,#fff);font-variant-numeric:tabular-nums;}
.cev-note.cols{display:block;columns:260px;column-gap:28px;column-fill:auto;white-space:normal;}
.cev-note.cols .nl{break-inside:avoid;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cev-time-in{flex-shrink:0;margin-left:2px;white-space:nowrap;font-family:var(--f-num);font-size:13px;font-weight:500;color:color-mix(in oklab,var(--k) 78%,#fff);}
.cev-row .cev-cost{margin-left:auto;}
.cev-title{flex:0 1 auto;min-width:0;font-size:14px;font-weight:700;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.cev-cost{flex-shrink:0;align-self:flex-start;padding:0 6px;border-radius:5px;background:rgba(255,255,255,.78);font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--local);white-space:nowrap;font-variant-numeric:tabular-nums;}
.cev-cost.cur-twd{color:var(--twd);}
.cal-untimed{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.cal-chip{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border:1px solid color-mix(in oklab,var(--c) 55%,#fff);background:color-mix(in oklab,var(--c) 30%,#fff);border-radius:8px;
  font-size:13px;color:var(--ink);cursor:pointer;transition:box-shadow .15s;}
.cal-chip:hover{box-shadow:0 4px 12px -4px rgba(26,34,56,.25);}
.cal-chip b{font-family:var(--f-num)!important;font-size:14px;font-weight:600;color:var(--local);}
.cal-chip b.cur-twd{color:var(--twd);}

/* 週檢視 */
.cal-scroll.wk-scroll{overflow-x:auto;}
.wk{min-width:640px;position:relative;}
.wk-sticky{position:sticky;top:0;z-index:9;background:var(--sheet);box-shadow:0 1px 0 var(--rule);}
.wk-head{display:flex;}
.wk-gut{width:52px;flex-shrink:0;}
.wk-hd{flex:1;min-width:0;text-align:center;padding:8px 2px 6px;cursor:pointer;transition:background-color .15s;}
.wk-hd:hover{background:rgba(26,34,56,.035);}
.wk-hd.off{opacity:.38;cursor:default;}
.wk-hd.off:hover{background:transparent;}
.wk-dow{font-size:12px;font-weight:500;color:var(--ink-3);}
.wk-num{width:36px;height:36px;line-height:36px;margin:1px auto 1px;border-radius:50%;
  font-family:var(--f-num);font-size:21px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;}
.wk-hd.sel .wk-num{background:var(--wash);}
.wk-hd.today .wk-dow{color:var(--signal);font-weight:700;}
.wk-hd.today .wk-num{background:var(--signal);color:#fff;}
.wk-sum{font-family:var(--f-num);font-size:13px;font-weight:600;color:var(--local);min-height:16px;font-variant-numeric:tabular-nums;}
.wk-allday{display:flex;border-top:1px solid var(--rule-soft);}
.wk-gut-lbl{font-size:12px;color:var(--ink-3);text-align:right;padding:6px 8px 0 0;}
.wk-adcell{flex:1;min-width:0;padding:4px 3px;display:flex;flex-direction:column;gap:3px;border-left:1px solid var(--rule-soft);}
.wk-chip{font-size:12px;font-weight:700;padding:3px 6px;border-radius:5px;border-left:3px solid var(--c);color:var(--k);background:color-mix(in oklab,var(--c) 42%,#fff);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;}
.wk-chip b{font-family:var(--f-num);font-weight:600;}
.wk-body{position:relative;}
.wk-col{position:absolute;top:0;bottom:0;border-left:1px solid var(--rule-soft);}
.wk-col.sel{background:rgba(26,34,56,.022);}
.wk-col.off{background:repeating-linear-gradient(135deg,rgba(26,34,56,.04) 0 6px,transparent 6px 12px);}
.wk-ev{padding:3px 5px 3px 10px;}
.wk-ev::before{left:2px;width:3px;}
.wk-ev .cev-title{font-size:12px;white-space:normal;line-height:1.3;overflow:hidden;word-break:break-word;}
.wk-time{font-family:var(--f-num);font-size:12px;font-weight:500;color:color-mix(in oklab,var(--k) 78%,#fff);line-height:1.25;font-variant-numeric:tabular-nums;}
.wk-ev .cev-cost{display:inline-block;margin-top:2px;padding:0 4px;font-size:12px;line-height:1.35;}
.wk-now{left:0;right:0;}
.wk-now::before{left:-5px;}

/* ════════ 統計／比較：沒有卡片，只有分節 ════════ */
.chart-box{padding:20px 0 26px;border-top:1px solid var(--rule);}
.chart-box:first-child{border-top:none;padding-top:4px;}
.chart-title{font-size:16px;font-weight:700;color:var(--ink);margin-bottom:14px;}
.stats-cat{display:flex;align-items:center;gap:36px;flex-wrap:wrap;}
.stats-cat>div{flex:1;min-width:240px;max-width:640px;}
#pieChart{flex-shrink:0;}
.cat-table,.cmp-table{width:100%;border-collapse:collapse;font-size:14px;}
.cat-table td{padding:9px 6px;border-bottom:1px solid var(--rule);}
.cat-table tr:last-child td{border-bottom:none;}
.cat-table .num,.cmp-table td{font-family:var(--f-num);font-size:16px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums;}
.legend{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:14px;}
.legend-item{display:inline-flex;align-items:center;gap:7px;font-size:13px;color:var(--ink-2);}
.legend-swatch{width:10px;height:10px;border-radius:3px;flex-shrink:0;}
.cat-table .legend-item{font-size:14px;color:var(--ink);}

/* 每日花費：依類別堆疊的長條 */
.bars{display:flex;align-items:flex-end;gap:10px;height:230px;padding-top:24px;}
.bar-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;height:100%;}
.bar-val{flex-shrink:0;font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--ink);margin-bottom:4px;white-space:nowrap;font-variant-numeric:tabular-nums;}
.bar-stack{flex-shrink:0;width:100%;max-width:64px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 2px 2px;overflow:hidden;min-height:0;}
.bar-stack i{display:block;width:100%;}
.bar-spacer{flex:1;}
.bar-day{flex-shrink:0;margin-top:8px;font-family:var(--f-num);font-size:14px;font-weight:500;color:var(--ink-2);font-variant-numeric:tabular-nums;white-space:nowrap;}
.bar-base{height:1px;background:var(--rule);margin-top:-1px;}

/* 跨旅程比較 */
.stat-row{display:flex;flex-wrap:wrap;margin-bottom:22px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-sheet);}
.stat-card{flex:1 1 160px;min-width:0;padding:16px 20px;border-left:1px solid var(--rule-soft);background:none!important;}
.stat-card:first-child{border-left:none;}
.stat-card .sc-label{font-size:12px;color:var(--ink-3);}
.stat-card .sc-value{font-family:var(--f-num);font-size:24px;font-weight:700;line-height:1.25;color:var(--ink);
  font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.stat-card .sc-sub{font-size:12px;color:var(--ink-2);margin-top:2px;}
.cmp-table th{padding:8px 6px;font-size:12px;font-weight:500;color:var(--ink-3);text-align:right;border-bottom:1px solid var(--rule);white-space:nowrap;}
.cmp-table th:first-child{text-align:left;}
.cmp-table td{padding:10px 6px;border-bottom:1px solid var(--rule-soft);white-space:nowrap;}
.cmp-table td:first-child{text-align:left;font-family:var(--f-ui);font-size:14px;}
.cmp-table tr:last-child td{border-bottom:none;}
.cmp-name{font-weight:700;color:var(--ink);}
.cmp-sub{font-size:12px;font-weight:400;color:var(--ink-3);}
.cmp-bar{height:10px;border-radius:99px;background:var(--rule-soft);overflow:hidden;min-width:70px;}
.cmp-bar>i{display:block;height:100%;border-radius:99px;background:var(--accent);}
.cmp-stack{display:flex;height:14px;border-radius:99px;overflow:hidden;background:var(--rule-soft);}
.cmp-stack>i{display:block;height:100%;}
.cmp-empty{color:var(--ink-3);font-size:14px;padding:14px 4px;}

/* ════════ 設定／表單 ════════ */
.set-grid{display:grid;grid-template-columns:110px minmax(0,1fr);gap:12px 16px;align-items:center;max-width:560px;}
.set-grid label{font-size:14px;font-weight:500;color:var(--ink-2);}
.set-grid input,.set-grid select,.set-grid textarea{width:100%;height:42px;padding:0 12px;border:1px solid var(--rule);
  border-radius:var(--r-ctl);background:var(--sheet);font-size:15px;color:var(--ink);outline:none;transition:border-color .15s,box-shadow .15s;}
.set-grid textarea{height:auto;padding:10px 12px;resize:vertical;line-height:1.5;}
.set-grid input:focus,.set-grid select:focus,.set-grid textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(242,92,34,.15);}
.rate-row{display:flex;gap:8px;}
.rate-row input{flex:1;min-width:0;}
.btn-mini{flex-shrink:0;height:42px;padding:0 14px;border:1px solid var(--rule);border-radius:var(--r-ctl);
  background:var(--sheet);font-size:13px;font-weight:700;color:var(--ink);transition:border-color .15s;}
.btn-mini:hover{border-color:var(--ink);}
.btn-mini:disabled{opacity:.5;cursor:default;}
.rate-note{grid-column:2;margin-top:-6px;font-size:12px;color:var(--ink-3);}
#view-settings .set-grid{padding:24px 28px;background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r-sheet);max-width:640px;}
.set-actions{display:flex;align-items:center;gap:12px;max-width:640px;margin-top:18px;}
.btn-save{height:42px;padding:0 22px;border:none;border-radius:var(--r-ctl);background:var(--accent);color:#fff;font-size:14px;font-weight:700;}
.btn-save:hover{background:var(--accent-dk);}
.btn-danger{height:40px;padding:0 16px;border:1px solid transparent;border-radius:var(--r-ctl);background:transparent;
  font-size:14px;font-weight:700;color:var(--local);transition:background-color .15s,border-color .15s;}
.btn-danger:hover{background:#FBECEC;border-color:#F0C9CB;}
.set-actions .btn-danger{margin-left:auto;}
.btn-cancel{height:40px;padding:0 18px;border:1px solid var(--rule);border-radius:var(--r-ctl);background:var(--sheet);
  font-size:14px;font-weight:700;color:var(--ink-2);}
.btn-cancel:hover{border-color:var(--ink-2);}
.btn-save:active,.btn-cancel:active,.btn-danger:active,.btn-mini:active,.btn-sync:active{transform:scale(.97);}

/* ════════ 彈窗 ════════ */
.modal-mask{display:none;position:fixed;inset:0;z-index:500;align-items:center;justify-content:center;padding:16px;
  background:rgba(26,34,56,.42);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);}
.modal-mask.open{display:flex;animation:maskIn .18s ease both;}
@keyframes maskIn{from{opacity:0;}}
.modal{width:100%;max-width:440px;max-height:calc(100vh - 32px);overflow-y:auto;padding:24px 26px;
  background:var(--sheet);border-radius:16px;box-shadow:0 24px 64px -16px rgba(26,34,56,.45);animation:modalIn .26s cubic-bezier(.23,1,.32,1) both;}
@keyframes modalIn{from{opacity:0;transform:translateY(8px) scale(.98);}}
#detailCard.from-src{animation:none;}
.modal h3{font-size:21px;font-weight:900;margin-bottom:18px;color:var(--ink);}
.modal .set-grid{max-width:none;grid-template-columns:84px minmax(0,1fr);}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;}
.dt-head{display:flex;align-items:center;gap:9px;margin-bottom:12px;}
.dt-badge{font-size:13px;font-weight:700;padding:3px 12px;border-radius:99px;}
.dt-title{font-size:24px;font-weight:900;line-height:1.25;color:var(--ink);margin-bottom:12px;}
.dt-row{display:flex;gap:12px;padding:11px 0;border-top:1px solid var(--rule-soft);font-size:15px;}
.dt-key{width:56px;flex-shrink:0;font-size:13px;color:var(--ink-3);padding-top:2px;}
.dt-val{flex:1;color:var(--ink);word-break:break-word;white-space:pre-wrap;}
.dt-amt{font-family:var(--f-num);font-size:21px;font-weight:700;color:var(--local);font-variant-numeric:tabular-nums;}
.dt-amt.cur-twd{color:var(--twd);}
.dt-twd{margin-left:8px;font-size:15px;font-weight:500;color:var(--ink-3);}

/* 刪除後可復原的提示 */
#undoToast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,12px);opacity:0;pointer-events:none;
  display:flex;align-items:center;gap:14px;max-width:92vw;padding:9px 9px 9px 18px;border-radius:99px;
  background:var(--ink);color:#fff;font-size:14px;font-weight:500;z-index:10000;box-shadow:0 12px 32px -8px rgba(26,34,56,.5);
  transition:opacity .2s cubic-bezier(.23,1,.32,1),transform .2s cubic-bezier(.23,1,.32,1);}
#undoToast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto;}
#undoToast span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
#undoToast button{flex-shrink:0;height:32px;padding:0 16px;border:none;border-radius:99px;background:#fff;color:var(--ink);font-weight:700;}

/* 手機用的記一筆按鈕與底部面板（桌機不顯示） */
.log-fab,.sheet-close,.sheet-mask{display:none;}

/* ════════ 平板／手機 ════════ */
@media (max-width:1100px){
  .ticket{grid-template-columns:minmax(0,1fr) 220px;}
  h1.th-title{font-size:30px;}
  .tk-en{font-size:21px;}
  .tk-total dd{font-size:30px;}
}
/* ════════ 路線檢視 ════════ */
.rv-scope{margin-left:6px;}
.rv-scope[style*="none"]{display:none!important;}
.rv-day{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:24px;align-items:start;margin-bottom:34px;}
.rv-hero{position:relative;overflow:hidden;border-radius:20px;padding:22px 28px 20px;margin-bottom:20px;color:#fff;
  background:radial-gradient(120% 140% at 100% 0%,#F7864F 0%,var(--accent) 38%,#C9420E 100%);box-shadow:0 18px 36px -20px rgba(201,66,14,.8);}
.rv-hero::after{content:'';position:absolute;right:-40px;bottom:-70px;width:240px;height:240px;border-radius:50%;border:38px solid rgba(255,255,255,.08);}
.rv-k{font-size:12px;font-weight:700;letter-spacing:.12em;opacity:.85;}
.rv-big{font-family:var(--f-num);font-size:52px;font-weight:700;line-height:1;margin-top:2px;}
.rv-big small{font-family:var(--f-ui);font-size:18px;font-weight:700;margin-left:10px;opacity:.9;}
.rv-stat{display:flex;gap:26px;margin-top:12px;position:relative;z-index:1;}
.rv-stat div{font-size:12px;opacity:.88;}
.rv-stat b{display:block;font-family:var(--f-num);font-size:21px;font-weight:600;}
.rv-path{position:relative;padding-left:60px;}
.rv-path::before{content:'';position:absolute;left:22px;top:28px;bottom:28px;width:2px;background:repeating-linear-gradient(180deg,var(--ink-3) 0 6px,transparent 6px 12px);opacity:.35;}
.rv-stop{position:relative;background:var(--sheet);border-radius:16px;padding:14px 18px;box-shadow:0 1px 0 rgba(26,34,56,.04),0 1px 3px rgba(26,34,56,.07);cursor:pointer;
  transition:transform .2s cubic-bezier(.23,1,.32,1),box-shadow .2s cubic-bezier(.23,1,.32,1);}
.rv-stop:hover{transform:translateY(-1px);box-shadow:0 10px 26px -14px rgba(26,34,56,.35);}
.rv-pin{position:absolute;left:-55px;top:12px;width:34px;height:34px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);
  box-shadow:0 0 0 4px var(--paper),0 6px 12px -4px color-mix(in oklab,var(--c) 80%,#000);display:grid;place-items:center;}
.rv-pin b{transform:rotate(45deg);font-family:var(--f-num);font-weight:700;color:#fff;font-size:15px;}
.rv-hd{display:flex;align-items:center;gap:12px;}
.rv-tt{min-width:0;}
.rv-t{font-family:var(--f-num);font-size:14px;font-weight:600;color:var(--ink-3);font-variant-numeric:tabular-nums;}
.rv-stop h4{font-size:16.5px;font-weight:900;line-height:1.3;}
.rv-ic{width:30px;height:30px;flex-shrink:0;border-radius:9px;display:grid;place-items:center;background:color-mix(in oklab,var(--c) 24%,#fff);color:var(--k);}
.rv-ic svg{width:16px;height:16px;}
.rv-amt{margin-left:auto;font-family:var(--f-num);font-weight:600;font-size:16px;color:var(--local);white-space:nowrap;font-variant-numeric:tabular-nums;}
.rv-amt.twd{color:var(--twd);}
.rv-amt small{font-size:12px;margin-left:2px;font-weight:500;}
.rv-note{margin-top:8px;padding-top:8px;border-top:1px solid var(--rule-soft);color:var(--ink-2);font-size:13.5px;line-height:1.6;white-space:pre-line;}
.rv-gap{display:flex;align-items:center;gap:8px;padding:8px 0 8px 4px;font-size:12.5px;color:var(--ink-3);}
.rv-gap svg{width:14px;height:14px;}
.rv-gap.free{color:var(--accent-dk);font-weight:700;}
.rv-gap.free span{background:var(--wash);padding:2px 10px;border-radius:99px;}
.rv-zone{display:flex;align-items:center;gap:12px;margin:16px 0 10px -60px;padding:9px 16px;border-radius:14px;cursor:pointer;color:var(--k);
  background:linear-gradient(100deg,color-mix(in oklab,var(--c) 30%,#fff),color-mix(in oklab,var(--c) 8%,#fff) 72%);}
.rv-zone:first-child{margin-top:0;}
.rv-zone b{font-size:15px;font-weight:900;}
.rv-zt{font-family:var(--f-num);font-weight:600;font-size:13.5px;}
.rv-side{position:sticky;top:44px;display:flex;flex-direction:column;gap:14px;}
.rv-card{background:var(--sheet);border-radius:18px;padding:16px 18px;box-shadow:0 1px 0 rgba(26,34,56,.04),0 1px 3px rgba(26,34,56,.07);}
.rv-card h3{font-size:13px;font-weight:700;color:var(--ink-3);margin-bottom:10px;}
.rv-donut{display:flex;align-items:center;gap:14px;}
.rv-donut svg{width:92px;height:92px;flex-shrink:0;}
.rv-donut ul{list-style:none;flex:1;font-size:13px;}
.rv-donut li{display:flex;align-items:center;gap:6px;padding:2px 0;}
.rv-donut li i{width:8px;height:8px;border-radius:2px;background:var(--c);}
.rv-donut li span{margin-left:auto;font-family:var(--f-num);font-weight:600;}
.rv-allday{display:flex;gap:10px;align-items:center;margin-top:6px;cursor:pointer;font-size:13px;color:var(--ink-2);}
.rv-allday b{display:block;color:var(--ink);font-size:14px;}
.rv-muted{color:var(--ink-3);font-size:13px;}
.rv-empty{padding:16px 0;}
.rv-day.compact .rv-stop{padding:11px 16px;}
.rv-day.compact .rv-hero{padding:18px 24px 16px;}
.rv-day.compact .rv-big{font-size:42px;}
@media (max-width:768px){
  .rv-day{grid-template-columns:1fr;gap:14px;}
  .rv-side{position:static;}
  .rv-hero{padding:18px 20px;}
  .rv-big{font-size:40px;}
  .rv-stat{gap:18px;}
  .rv-path{padding-left:50px;}
  .rv-path::before{left:17px;}
  .rv-pin{left:-48px;width:30px;height:30px;}
  .rv-zone{margin-left:-50px;}
  .rv-stop{padding:12px 14px;}
  .cal-toolbar{row-gap:8px;}
  .mb-menu{display:none;}
  .sidebar{transform:translateX(-100%);box-shadow:none;}
  .sidebar.open{transform:none;box-shadow:0 0 40px rgba(26,34,56,.25);}
  .sb-overlay.show{display:block;}
  .main,.main-empty{margin-left:0;padding:14px 14px 92px;}
  .hamburger{display:flex;}
  .main-empty .hamburger{position:absolute;top:42px;left:14px;}
  .trip-header{margin-bottom:16px;}
  .trip-header>.hamburger{position:absolute;top:10px;right:10px;z-index:2;border:none;background:var(--wash);}
  .tk-route{padding-right:44px;}
  /* 登機證改成上下兩截，打孔線轉為橫向 */
  .ticket{grid-template-columns:1fr;}
  .tk-main{padding:16px 18px 16px;}
  h1.th-title{font-size:26px;}
  .tk-en{font-size:18px;}
  .tk-fields{gap:4px 22px;margin-top:12px;}
  .tk-fields dd{font-size:17px;}
  .tk-stub{background:none;border-radius:0 0 var(--r-sheet) var(--r-sheet);border-left:none;border-top:2px dashed var(--rule);padding:14px 18px 16px;
    display:grid;grid-template-columns:auto 1fr;align-items:end;column-gap:16px;}
  .tk-stub::before{left:-12px;top:-13px;}
  .tk-stub::after{left:auto;right:-12px;top:-13px;bottom:auto;}
  .tk-total dd{font-size:28px;}
  .tk-total dd .cur{font-size:15px;}
  .tk-split{margin:0;padding:0;border:none;gap:0 10px;}
  .tk-split dd{font-size:15px;}
  .cal-range{font-size:17px;}
  /* 手機寬度不夠：標題＋金額同一行，時間放第二行 */
  .cev-row{flex-wrap:wrap;row-gap:0;}
  .cev-row .cev-title{flex:1 1 0;}
  .cev-row .cev-cost{order:2;}
  .cev-row .cev-time-in{order:3;flex-basis:100%;margin-left:0;}
  .cal-seg{margin-left:auto;}
  /* D1… 一列橫向滑動 */
  #logDayTabs{flex-wrap:nowrap;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none;
    margin:0 -14px 12px;padding:0 14px 2px;}
  #logDayTabs::-webkit-scrollbar{display:none;}
  #logDayTabs .day-tab{flex-shrink:0;min-width:64px;scroll-snap-align:center;}
  /* 記一筆：收進底部面板 */
  #logForm{position:fixed;left:0;right:0;bottom:0;z-index:600;margin:0;padding:52px 16px calc(16px + env(safe-area-inset-bottom,0px));
    border:none;border-radius:20px 20px 0 0;background:var(--sheet);box-shadow:0 -16px 40px -12px rgba(26,34,56,.3);
    transform:translateY(105%);visibility:hidden;transition:transform .32s cubic-bezier(.32,.72,0,1),visibility 0s .32s;}
  #logForm.open{transform:none;visibility:visible;transition:transform .32s cubic-bezier(.32,.72,0,1),visibility 0s;}
  #logForm::before{content:'記一筆';position:absolute;top:16px;left:18px;font-size:18px;font-weight:900;color:var(--ink);}
  #logForm .sheet-close{display:block;position:absolute;top:8px;right:10px;width:40px;height:40px;border:none;background:none;color:var(--ink-3);font-size:18px;}
  #logForm>span{display:none;}
  #logForm input,#logForm select{height:46px;font-size:16px;}
  #logForm #logTitle{flex:1 1 100%!important;min-width:0!important;order:-1;}
  #logForm #logTime,#logForm #logEnd,#logForm #logType{flex:1 1 calc(33.3% - 6px)!important;width:auto!important;min-width:0!important;}
  #logForm #logAmount{flex:1 1 0!important;width:auto!important;min-width:0!important;}
  #logForm #logCur{flex:0 0 110px!important;width:auto!important;}
  #logForm #logNote{flex:1 1 100%!important;min-width:0!important;}
  #logForm .btn-add{flex:1 1 100%;height:48px;font-size:16px;}
  .sheet-mask{display:block;position:fixed;inset:0;z-index:599;background:rgba(26,34,56,.38);opacity:0;pointer-events:none;transition:opacity .25s ease;}
  .sheet-mask.open{opacity:1;pointer-events:auto;}
  .log-fab{display:block;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:550;
    height:52px;padding:0 24px;border:none;border-radius:99px;background:var(--accent);color:#fff;font-size:16px;font-weight:700;
    box-shadow:0 10px 26px -6px rgba(242,92,34,.6);touch-action:manipulation;transition:transform .12s cubic-bezier(.23,1,.32,1);}
  .log-fab:active{transform:scale(.96);}
  #undoToast{bottom:calc(84px + env(safe-area-inset-bottom,0px));}
  .stats-cat{gap:20px;}
  .bars{gap:5px;height:200px;}
  .bar-val{font-size:12px;}
  .bar-day{font-size:12px;}
  .set-grid,#view-settings .set-grid{grid-template-columns:1fr;gap:6px 0;padding:18px;}

}
@media (prefers-reduced-motion:reduce){

}

<script>


// 全域 Menubar 時鐘
(function(){
  function t(){
    var el=document.getElementById('gmbTime');if(!el)return;
    var now=new Date(),d=['日','一','二','三','四','五','六'][now.getDay()];
    var h=String(now.getHours()).padStart(2,'0'),m=String(now.getMinutes()).padStart(2,'0');
    el.textContent='週'+d+' '+(now.getMonth()+1)+'/'+(now.getDate())+' '+h+':'+m;
  }t();setInterval(t,10000);
})();

// ── GitHub 設定 ──
const GH_OWNER='sumoai-boop', GH_REPO='sumoai-boop.github.io', GH_BRANCH='main';
const GH_DATA_PATH='trips-data.json';
const GH_TOKEN_KEY='sumoai_gh_token';
const SHA_KEY='gh_json_sha_trips';
const LOCAL_KEY='trips_local_data';
const DIRTY_KEY='trips_dirty_count';

// ── 統一標籤（行程類型＋支出類別合一，紅橘綠暖色譜） ──
const TAG={
  /* 每個分類一個有名字的顏色：c＝深色字、bg＝淺底、pie＝主色 */
  '景點':{c:'#A0245A',bg:'#FCDDEA',pie:'#F28DB5'}, /* 櫻花粉 */
  '餐飲':{c:'#A33A00',bg:'#FFE0CC',pie:'#FF6A1A'}, /* 宇宙橙（iPhone 17 Pro 那種橘） */
  '交通':{c:'#765500',bg:'#F9EBC2',pie:'#E3A814'}, /* 芥末黃 */
  '機票':{c:'#41621A',bg:'#E3EFD2',pie:'#86B048'}, /* 抹茶綠 */
  '購物':{c:'#0F6A64',bg:'#CFF1EE',pie:'#30BDB3'}, /* 蒂芙尼藍 */
  '住宿':{c:'#2B4176',bg:'#D9E0F0',pie:'#3D5A98'}, /* 午夜藍 */
  '地點':{c:'#5A3E96',bg:'#EAE2F8',pie:'#A288DC'}, /* 薰衣草紫 */
  '其他':{c:'#5E3B2B',bg:'#EBDFD8',pie:'#8A5A44'}  /* 可可棕 */
};

// ── 狀態 ──
let DB={trips:[]};
let currentTripId=null;
let currentView='log';
let itSelectedDate=null;
let calMode=(function(){try{var m=localStorage.getItem('trips_cal_mode');return (m==='week'||m==='route')?m:'day';}catch(e){return 'day';}})();
let routeScope=(function(){try{return localStorage.getItem('trips_route_scope')==='all'?'all':'day';}catch(e){return 'day';}})();

// ── 工具 ──
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7);}
function fmtDateLocal(d){
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function parseDate(s){var p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function dateRange(start,end){
  var out=[],d=parseDate(start),e=parseDate(end);
  while(d<=e){out.push(fmtDateLocal(d));d.setDate(d.getDate()+1);}
  return out;
}
function fmtMD(s){var p=s.split('-');return (+p[1])+'/'+(+p[2]);}
function weekdayZh(s){return '週'+['日','一','二','三','四','五','六'][parseDate(s).getDay()];}
function num(n){return Math.round(n).toLocaleString('en-US');}
function curTrip(){return DB.trips.find(t=>t.id===currentTripId)||null;}
function entryTWD(e,t){var a=+e.amount||0;return (e.cur==='TWD')?a:a*(+t.rate||1);}
function tripTotalTWD(t){return (t.entries||[]).reduce((s,e)=>s+entryTWD(e,t),0);}
function sumByType(t,type){return (t.entries||[]).filter(e=>e.type===type).reduce((s,e)=>s+entryTWD(e,t),0);}
function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

// ── 本地儲存 / 髒資料標記 ──
function saveLocal(){localStorage.setItem(LOCAL_KEY,JSON.stringify(DB));}
function markDirty(){
  stampChanges();
  var n=(+localStorage.getItem(DIRTY_KEY)||0)+1;
  localStorage.setItem(DIRTY_KEY,String(n));
  saveLocal();renderSync();
  scheduleSync(2500);
}
function clearDirty(){localStorage.setItem(DIRTY_KEY,'0');renderSync();}
function dirtyCount(){return +localStorage.getItem(DIRTY_KEY)||0;}
var _syncMsg='';
function renderSync(){
  var el=document.getElementById('syncState'),n=dirtyCount();if(!el)return;
  if(_syncing){el.className='sync-state dirty';el.textContent='同步中…';return;}
  if(_syncMsg){el.className='sync-state dirty';el.textContent=_syncMsg;return;}
  if(n>0){el.className='sync-state dirty';el.textContent='未同步 '+n+' 筆變更';}
  else{el.className='sync-state ok';el.textContent='已同步'+(_lastSyncAt?' '+String(_lastSyncAt.getHours()).padStart(2,'0')+':'+String(_lastSyncAt.getMinutes()).padStart(2,'0'):'');}
}
function countRecords(db){
  return (db.trips||[]).reduce((s,t)=>s+1+(t.entries||[]).length+(t.itinerary||[]).length+(t.expenses||[]).length,0);
}
// 舊資料（分開的 itinerary + expenses）遷移成單一 entries[]
function migrateTrip(t){
  if(t.entries){t.entries.forEach(e=>{if(e.type==='門票')e.type='地點';if(e.amount==null)e.amount=0;if(!e.cur)e.cur=t.currency||'TWD';delete e.pay;});return;}
  var TYPEMAP={'餐廳':'餐飲','門票':'地點'},out=[];
  (t.itinerary||[]).forEach(it=>{
    var linked=(t.expenses||[]).filter(e=>e.linkId===it.id);
    out.push({id:it.id||uid(),date:it.date,time:it.time||'',type:TYPEMAP[it.type]||it.type||'其他',
      title:it.title||'',note:it.note||'',amount:linked.reduce((s,e)=>s+(+e.amount||0),0),cur:t.currency||'TWD'});
  });
  (t.expenses||[]).forEach(e=>{
    if(e.linkId)return;
    out.push({id:e.id||uid(),date:e.date,time:'',type:TYPEMAP[e.category]||e.category||'其他',
      title:e.item||'',note:'',amount:+e.amount||0,cur:t.currency||'TWD'});
  });
  t.entries=out;delete t.itinerary;delete t.expenses;
}

// ── 載入：先顯示本機資料，再自動跟雲端合併 ──
function loadData(){
  var local=null;
  try{local=JSON.parse(localStorage.getItem(LOCAL_KEY)||'null');}catch(e){}
  if(local&&local.trips){DB=local;if(!getBase())setBase(clone(local));init();_inited=true;}
  syncNow({initial:true});
  startAutoSync();
}
var _inited=false;

function init(){
  if(!DB.trips)DB.trips=[];
  DB.trips.forEach(migrateTrip);
  if(!currentTripId&&DB.trips.length){
    var sorted=[...DB.trips].sort((a,b)=>b.start.localeCompare(a.start));
    currentTripId=sorted[0].id;
  }
  fillSelect('logType',Object.keys(TAG));
  try{var _lt=localStorage.getItem('trips_last_type');if(_lt&&Object.keys(TAG).indexOf(_lt)>=0)document.getElementById('logType').value=_lt;}catch(e){}
  fillTimeSelects();
  renderAll();
}
function fillSelect(id,opts){
  var el=document.getElementById(id);
  el.innerHTML=opts.map(o=>'<option>'+o+'</option>').join('');
}
function fillTimeSelects(){
  var opts='<option value="">開始</option>';
  for(var m=0;m<24*60;m+=15){
    var v=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');
    opts+='<option value="'+v+'">'+v+'</option>';
  }
  var lt=document.getElementById('logTime');if(lt)lt.innerHTML=opts;
  var le=document.getElementById('logEnd');if(le)le.innerHTML=endOptionsHTML('','');
}

// ── 渲染 ──
function renderAll(){
  renderTripList();renderSync();
  var t=curTrip();
  // 跨旅程比較看的是全部旅程，不需要先選一個
  var isCmp=(currentView==='compare');
  document.getElementById('mainArea').style.display=(t||isCmp)?'block':'none';
  document.getElementById('mainEmpty').style.display=(t||isCmp)?'none':'flex';
  if(isCmp){ renderCompareHeader(); renderCompare(); return; }
  if(!t)return;
  renderHeader();
  if(currentView==='log')renderLog();
  else if(currentView==='stats')renderStats();
  else if(currentView==='settings')renderSettings();
}

function cityFlag(t){
  var s=((t.city||'')+' '+(t.cityEn||'')).toLowerCase();
  var map=[
    [/首爾|釜山|濟州|韓國|seoul|busan|jeju|korea/,'kr'],
    [/清邁|曼谷|普吉|芭達雅|甲米|泰國|chiang\s*mai|bangkok|phuket|pattaya|krabi|thai/,'th'],
    [/東京|大阪|京都|福岡|沖繩|北海道|札幌|名古屋|神戶|日本|tokyo|osaka|kyoto|fukuoka|okinawa|hokkaido|sapporo|nagoya|kobe|japan/,'jp'],
    [/香港|hong\s*kong/,'hk'],
    [/澳門|macau|macao/,'mo'],
    [/上海|北京|杭州|廣州|深圳|成都|西安|中國|shanghai|beijing|hangzhou|guangzhou|shenzhen|chengdu|china/,'cn'],
    [/台北|台中|高雄|台南|臺北|臺中|花蓮|taipei|taichung|kaohsiung|tainan|hualien|taiwan/,'tw'],
    [/馬尼拉|宿霧|長灘|菲律賓|manila|cebu|boracay|philippine/,'ph'],
    [/新加坡|singapore/,'sg'],
    [/吉隆坡|檳城|馬來|kuala\s*lumpur|penang|malaysia/,'my'],
    [/峴港|胡志明|河內|會安|越南|da\s*nang|ho\s*chi\s*minh|hanoi|hoi\s*an|vietnam/,'vn'],
    [/峇里|巴里|雅加達|印尼|bali|jakarta|indonesia/,'id'],
    [/巴黎|法國|paris|france/,'fr'],
    [/倫敦|英國|london|britain|england/,'gb'],
    [/紐約|洛杉磯|舊金山|美國|new\s*york|los\s*angeles|san\s*francisco|usa|america/,'us']
  ];
  for(var i=0;i<map.length;i++){if(map[i][0].test(s))return map[i][1];}
  return '';
}
function renderTripList(){
  var box=document.getElementById('tripList');
  var sorted=[...DB.trips].sort((a,b)=>b.start.localeCompare(a.start));
  var html='',lastYear='';
  sorted.forEach(t=>{
    var y=t.start.slice(0,4);
    if(y!==lastYear){html+='<div class="sb-year">'+y+'</div>';lastYear=y;}
    var active=(t.id===currentTripId);
    var fc=cityFlag(t),bg='';
    if(fc){
      var c1=active?'255,237,227':'255,255,255';
      bg='background-image:linear-gradient(90deg,rgba('+c1+',0) 24%,rgba('+c1+',0.55) 40%,rgba('+c1+',0.95) 56%,rgba('+c1+',0.98) 100%),url(\'https://flagcdn.com/256x192/'+fc+'.png\');background-size:100% 100%,auto 100%;background-position:center,left center;background-repeat:no-repeat;';
    }
    html+='<div class="trip-item'+(active?' active':'')+'" style="'+bg+'" onclick="selectTrip(\''+t.id+'\')">'
      +'<div class="trip-city">'+esc(t.city)+(t.cityEn?' '+esc(t.cityEn):'')+'</div>'
      +'<div class="trip-dates">'+t.start.slice(5).replace('-','.')+' – '+t.end.slice(5).replace('-','.')+'</div>'
      +'</div>';
  });
  box.innerHTML=html;
}

function selectTrip(id){
  currentTripId=id;itSelectedDate=null;
  toggleSidebar(false);
  renderAll();
}

function switchView(v){
  currentView=v;
  document.querySelectorAll('#fnMenu .fn-item').forEach(el=>{
    el.classList.toggle('active',el.dataset.view===v);
  });
  ['log','stats','compare','settings'].forEach(x=>{
    document.getElementById('view-'+x).style.display=(x===v)?'block':'none';
  });
  document.getElementById('mainArea').classList.toggle('v-log',v==='log');
  document.getElementById('mainArea').classList.toggle('v-cmp',v==='compare');
  toggleSidebar(false);
  renderAll();
}

// ── 行程＋記帳（合併記錄） ──
function renderLog(){
  var t=curTrip(),days=dateRange(t.start,t.end),rate=+t.rate||1;
  if(!_fitting)HPX=calcHP(_reserve[calMode]);
  fillCurSelect(t);
  var totalTWD=tripTotalTWD(t);
  var today=fmtDateLocal(new Date());
  var dayCount=Math.min(days.filter(d=>d<=today).length||1,days.length);
  document.getElementById('stLocalTotal').textContent='NT$ '+num(totalTWD);
  document.getElementById('stFlight').textContent='NT$ '+num(sumByType(t,'機票'));
  document.getElementById('stStay').textContent='NT$ '+num(sumByType(t,'住宿'));
  if(!itSelectedDate||!days.includes(itSelectedDate)){itSelectedDate=days.includes(today)?today:days[0];}
  document.getElementById('logDayTabs').innerHTML=days.map((d,i)=>{
    var ds=t.entries.filter(x=>x.date===d).reduce((s,x)=>s+entryTWD(x,t),0);
    var dot=ds>0?'<i class="tab-dot"></i>':'';
    return '<button class="day-tab'+(d===itSelectedDate?' active':'')+'" onclick="pickDay(\''+d+'\')"><span class="tab-n">D'+(i+1)+'</span><span class="tab-d">'+fmtMD(d)+'</span>'+dot+'</button>';
  }).join('');
  var wk=weekDaysFor(itSelectedDate);
  var inTrip=function(d){return d>=t.start&&d<=t.end;};
  var routeAll=(calMode==='route'&&routeScope==='all');
  var viewDays=calMode==='week'?wk.filter(inTrip):routeAll?days:[itSelectedDate];
  var items=t.entries.filter(x=>viewDays.indexOf(x.date)>=0);
  var sub=items.reduce((s,x)=>s+entryTWD(x,t),0);
  document.getElementById('logDaySub').innerHTML=routeAll
    ?(sub>0?'<span class="ds-sum">全部 NT$ '+num(sub)+'</span>':'')
    :calMode==='week'
    ?'<span class="ds-day">'+fmtMD(wk[0])+' – '+fmtMD(wk[6])+'</span>'+(sub>0?'<span class="ds-sum">本週 NT$ '+num(sub)+'</span>':'')
    :(items.length?'<span class="ds-day">'+fmtMD(itSelectedDate)+' '+weekdayZh(itSelectedDate)+'</span>'
      +(sub>0?'<span class="ds-sum">當日 NT$ '+num(sub)+'</span>':''):'');
  document.getElementById('segDay').className=calMode==='day'?'on':'';
  document.getElementById('segWeek').className=calMode==='week'?'on':'';
  document.getElementById('segRoute').className=calMode==='route'?'on':'';
  document.getElementById('rvScope').style.display=calMode==='route'?'':'none';
  document.getElementById('rvOne').className=(calMode==='route'&&!routeAll)?'on':'';
  document.getElementById('rvAll').className=routeAll?'on':'';
  document.getElementById('calRange').textContent=routeAll?('全部 '+days.length+' 天・'+fmtMD(days[0])+' – '+fmtMD(days[days.length-1])):calMode==='week'
    ?(wk[0].slice(0,4)+' '+fmtMD(wk[0])+' – '+fmtMD(wk[6]))
    :(itSelectedDate.slice(0,4)+' '+fmtMD(itSelectedDate)+' '+weekdayZh(itSelectedDate));
  var todayBtn=document.getElementById('calTodayBtn');
  if(todayBtn){todayBtn.hidden=!inTrip(today);todayBtn.disabled=false;}   /* 不在旅程期間就不顯示，不再留一顆灰掉的按鈕 */
  document.getElementById('logDayTabs').style.display=(calMode==='week'||routeAll)?'none':'';
  var at=document.querySelector('#logDayTabs .day-tab.active');
  if(at&&at.scrollIntoView&&window.matchMedia('(max-width:768px)').matches){var dt=document.getElementById('logDayTabs');dt.scrollLeft=at.offsetLeft-dt.offsetWidth/2+at.offsetWidth/2;}
  var host=document.getElementById('logTimeline');
  document.getElementById('logEmpty').style.display='none';
  host.style.display='block';
  if(calMode==='route'){host.innerHTML=renderRouteView(t,viewDays,routeAll);return;}
  host.innerHTML=calMode==='week'?renderWeekCalendar(t,wk):renderDayCalendar(t,itSelectedDate);
  var sc=host.querySelector('.cal-scroll');
  fitCalHeight();
  if(sc){
    // 預設從早上 8 點開始顯示；若當天/當週有更早的行程，就往前捲到那一筆
    var mins=items.map(function(x){return toMin(x.time);}).filter(function(m){return m!=null;});
    var startMin=VIEW_START_H*60;
    if(mins.length)startMin=Math.min(startMin,Math.min.apply(null,mins));
    sc.scrollTop=Math.max(0,Math.floor(startMin/60)*HPX-8);

}
function toMin(hhmm){var p=(hhmm||'').split(':');return (p.length===2&&p[0]!=='')?(+p[0])*60+(+p[1]):null;}
function minHHMM(m){return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
/* 「地點」當底：自己一層佔滿寬度，其他行程另外分欄、蓋在上面（往右縮一點讓底下的地點露出來） */
function layoutLayers(timed){
  var bgs=timed.filter(function(o){return o.x.type==='地點';}),fgs=timed.filter(function(o){return o.x.type!=='地點';});
  layoutColumns(bgs);layoutColumns(fgs);
  bgs.forEach(function(o){o.bg=true;o.hasFg=fgs.some(function(f){return f.s<o.e&&o.s<f.e;});});
  fgs.forEach(function(o){o.onBg=bgs.some(function(b){return b.s<o.e&&o.s<b.e;});});
  return bgs.concat(fgs);
}
function evPos(o,gap,ind){
  var w=100/o.cols,left=o.col*w,I=o.onBg?ind:0;
  return 'left:calc('+I+'px + (100% - '+I+'px) * '+(left/100)+' + 1px);width:calc((100% - '+I+'px) * '+(w/100)+' - '+gap+'px);';
}
function layoutColumns(evs){
  // 依開始時間排序，同開始時間則「時段較長」的優先 → 長區塊佔左欄，
  // 其餘較短且互不重疊的行程盡量共用同一欄（上下對齊）
  evs.sort(function(a,b){return a.s-b.s||b.e-a.e;});
  var i=0;
  while(i<evs.length){
    var clusterEnd=evs[i].e,cluster=[evs[i]],j=i+1;
    while(j<evs.length&&evs[j].s<clusterEnd){cluster.push(evs[j]);if(evs[j].e>clusterEnd)clusterEnd=evs[j].e;j++;}
    var colsEnd=[];
    cluster.forEach(function(ev){
      var placed=false;
      for(var c=0;c<colsEnd.length;c++){if(colsEnd[c]<=ev.s){ev.col=c;colsEnd[c]=ev.e;placed=true;break;}}
      if(!placed){ev.col=colsEnd.length;colsEnd.push(ev.e);}
    });
    cluster.forEach(function(ev){ev.cols=colsEnd.length;});
    i=j;
  }
}
function chipHTML(t,x){
  var ty=TAG[x.type]||TAG['其他'];
  var cost=(+x.amount>0)?' <b class="'+(x.cur==='TWD'?'cur-twd':'')+'">'+(x.cur==='TWD'?'NT$'+num(x.amount):num(x.amount)+esc(x.cur||''))+'</b>':'';
  return '<span class="cal-chip" onclick="openEntryDetail(\''+x.id+'\',this)" style="--c:'+ty.pie+';--k:'+ty.c+';">'
    +'<span style="color:'+ty.c+';font-weight:700;">'+esc(x.type)+'</span> '+esc(x.title)+cost
    +'</span>';
}
function prevDateStr(day){var d=parseDate(day);d.setDate(d.getDate()-1);return fmtDateLocal(d);}
function renderDayCalendar(t,day){
  var timed=[],untimed=[];
  (t.entries||[]).filter(function(e){return e.date===day;}).forEach(function(x){
    var sm=toMin(x.time);
    if(sm==null){untimed.push(x);return;}
    var em=toMin(x.end);if(em==null)em=sm+60;else if(em<=sm)em+=1440;
    timed.push({x:x,s:sm,e:em,cont:false});
  });
  // 前一天跨過午夜、延續到今天的行程 → 今天從 00:00 畫到結束
  var pd=prevDateStr(day);
  (t.entries||[]).filter(function(e){return e.date===pd;}).forEach(function(x){
    var sm=toMin(x.time),em=toMin(x.end);
    if(sm==null||em==null||em>sm||em===0)return; // 未跨夜，或剛好 00:00 結束
    timed.push({x:x,s:0,e:em,cont:true});
  });
  var chips=untimed.length?'<div class="cal-untimed">'+untimed.map(function(x){return chipHTML(t,x);}).join('')+'</div>':'';
  var startH=0,endH=24;
  var HP=HPX,pm=HP/60,top0=startH*60,bodyH=(endH-startH)*HP;
  var grid='<div class="cal-night" style="top:0;height:'+(6*HP)+'px;"></div>'
    +'<div class="cal-night" style="top:'+(22*HP)+'px;height:'+(2*HP)+'px;"></div>';
  for(var h=startH;h<=endH;h++){
    var y=(h-startH)*HP;
    grid+='<div class="cal-hline" style="top:'+y+'px;"></div>'
      +'<div class="cal-hlabel" style="top:'+(y-6)+'px;">'+String(h%24).padStart(2,'0')+':00</div>';
  }
  if(day===fmtDateLocal(new Date())){
    var _n=new Date(),_nm=_n.getHours()*60+_n.getMinutes();
    grid+='<div class="cal-now" style="top:'+(_nm*pm).toFixed(1)+'px;"></div>';
  }
  timed=layoutLayers(timed);
  var evs=timed.map(function(o,_i){
    var x=o.x,ty=TAG[x.type]||TAG['其他'];
    var drawE=Math.min(o.e,endH*60),top=(o.s-top0)*pm,hgt=Math.max((drawE-o.s)*pm,26);
    var w=100/o.cols,left=o.col*w;
    var cost=(!o.cont&&+x.amount>0)?'<div class="cev-cost'+(x.cur==='TWD'?' cur-twd':'')+'">'+(x.cur==='TWD'?'NT$'+num(x.amount):num(x.amount)+' '+esc(x.cur||''))+'</div>':'';
    var title=(o.cont?'↳ ':'')+esc(x.title);
    var tTxt=o.cont?('～ '+minHHMM(o.e%1440)):(minHHMM(o.s)+' – '+minHHMM(o.e%1440)+(o.e>1440||o.e===1440?' 隔天':''));
    var tm='<span class="cev-time-in">'+tTxt+'</span>';
    // 備註：依方塊高度算出放得下幾行，放不下的用「…」收尾，不會切到半行字
    var ntLines=Math.floor((hgt-10-19-(isPhone()?17:0))/18); // 手機上時間另起一行
    var nt='';
    if(!o.cont&&x.note&&ntLines>=1){
      var nls=String(x.note).split(/\n/).filter(function(l){return l.trim()!=='';});
      // 備註有分行、而且一欄放不下：一行一段排成多欄（每段不會被拆開）；
      // 一整段連續文字：寬度排滿、放不下用「…」收尾，避免一句話被切成兩欄
      if(nls.length>ntLines&&!isPhone())nt='<div class="cev-note cols" style="height:'+(ntLines*18)+'px;">'+nls.map(function(l){return '<div class="nl">'+esc(l)+'</div>';}).join('')+'</div>';
      else nt='<div class="cev-note" style="-webkit-line-clamp:'+ntLines+';">'+esc(x.note)+'</div>';
    }
    var _d=Math.min(_i*26,320);
    var dg=o.cont?'':' data-id="'+x.id+'" data-s="'+o.s+'" data-e="'+o.e+'" data-day="'+day+'"';
    var vt=(o.bg&&o.hasFg)?' ev-v':'';
    return '<div class="cal-ev'+(o.bg?' ev-bg':'')+vt+(o.cont?'':' dg')+'"'+dg+' onclick="openEntryDetail(\''+x.id+'\',this)" style="animation-delay:'+_d+'ms;top:'+top.toFixed(1)+'px;height:'+hgt.toFixed(1)+'px;'+evPos(o,3,38)+'--c:'+ty.pie+';--k:'+ty.c+';'+(o.cont?'opacity:0.88;':'')+'">'
      +(vt?'<div class="cev-vt">'+title+'</div>':'<div class="cev-row"><div class="cev-title" style="color:'+ty.c+';">'+title+'</div>'+tm+cost+'</div>'+nt)
      +(o.cont?'':'<i class="ev-rs" aria-hidden="true"></i>')+'</div>';
  }).join('');
  return chips+'<div class="cal-scroll"><div class="cal" style="height:'+bodyH+'px;"><div class="cal-grid">'+grid+'</div><div class="cal-body" onclick="calSlotClick(event)">'+evs+'</div></div></div>';
}
/* ══════════ 週檢視（仿 Google 日曆） ══════════ */
function weekDaysFor(day){
  var d=parseDate(day),dow=(d.getDay()+6)%7; // 週一為一週開始
  d.setDate(d.getDate()-dow);
  var out=[];for(var i=0;i<7;i++){out.push(fmtDateLocal(d));d.setDate(d.getDate()+1);}
  return out;
}
function collectDay(t,day){
  var timed=[],untimed=[];
  (t.entries||[]).filter(function(e){return e.date===day;}).forEach(function(x){
    var sm=toMin(x.time);
    if(sm==null){untimed.push(x);return;}
    var em=toMin(x.end);if(em==null)em=sm+60;else if(em<=sm)em+=1440;
    timed.push({x:x,s:sm,e:em,cont:false});
  });
  var pd=prevDateStr(day);
  (t.entries||[]).filter(function(e){return e.date===pd;}).forEach(function(x){
    var sm=toMin(x.time),em=toMin(x.end);
    if(sm==null||em==null||em>sm||em===0)return;
    timed.push({x:x,s:0,e:em,cont:true});
  });
  return {timed:timed,untimed:untimed};
}
function renderWeekCalendar(t,days){
  var HP=HPX,pm=HP/60,bodyH=24*HP,today=fmtDateLocal(new Date());
  var inTrip=function(d){return d>=t.start&&d<=t.end;};
  var W='(100% - 46px)/7';
  var head='<div class="wk-head"><div class="wk-gut"></div>'+days.map(function(d){
    var off=!inTrip(d),cls='wk-hd'+(off?' off':'')+(d===itSelectedDate?' sel':'')+(d===today?' today':'');
    var ds=off?0:(t.entries||[]).filter(function(x){return x.date===d;}).reduce(function(s,x){return s+entryTWD(x,t);},0);
    return '<div class="'+cls+'"'+(off?'':' onclick="pickDay(\''+d+'\')"')+'>'
      +'<div class="wk-dow">'+weekdayZh(d)+'</div>'
      +'<div class="wk-num">'+(+d.slice(8))+'</div>'
      +'<div class="wk-sum">'+(ds>0?'NT$'+num(ds):'&nbsp;')+'</div></div>';
  }).join('')+'</div>';
  var cols=days.map(function(d){return inTrip(d)?collectDay(t,d):{timed:[],untimed:[]};});
  var hasUntimed=cols.some(function(c){return c.untimed.length;});
  var allday=hasUntimed?'<div class="wk-allday"><div class="wk-gut wk-gut-lbl">未定</div>'+cols.map(function(c){
    return '<div class="wk-adcell">'+c.untimed.map(function(x){
      var ty=TAG[x.type]||TAG['其他'];
      var cost=(+x.amount>0)?' <b>'+(x.cur==='TWD'?'NT$'+num(x.amount):num(x.amount))+'</b>':'';
      return '<div class="wk-chip" onclick="openEntryDetail(\''+x.id+'\',this)" style="--c:'+ty.pie+';--k:'+ty.c+';">'+esc(x.title)+'</div>';
    }).join('')+'</div>';
  }).join('')+'</div>':'';
  var grid='<div class="cal-night" style="top:0;height:'+(6*HP)+'px;"></div>'
    +'<div class="cal-night" style="top:'+(22*HP)+'px;height:'+(2*HP)+'px;"></div>';
  for(var h=0;h<=24;h++){
    grid+='<div class="cal-hline" style="top:'+(h*HP)+'px;"></div>'
      +'<div class="cal-hlabel" style="top:'+(h*HP-6)+'px;">'+String(h%24).padStart(2,'0')+':00</div>';
  }
  var body=days.map(function(d,i){
    var off=!inTrip(d),c=cols[i];
    c.timed=layoutLayers(c.timed);
    var evs=c.timed.map(function(o,_i){
      var x=o.x,ty=TAG[x.type]||TAG['其他'];
      var drawE=Math.min(o.e,1440),top=o.s*pm,hgt=Math.max((drawE-o.s)*pm,22);
      var w=100/o.cols,left=o.col*w;
      var cost=(!o.cont&&+x.amount>0)?'<div class="cev-cost'+(x.cur==='TWD'?' cur-twd':'')+'">'+(x.cur==='TWD'?'NT$'+num(x.amount):num(x.amount)+' '+esc(x.cur||''))+'</div>':'';
      var tm=o.cont?'':'<div class="wk-time">'+minHHMM(o.s)+(o.e-o.s>=45?' – '+minHHMM(o.e%1440):'')+'</div>';
      var dg=o.cont?'':' data-id="'+x.id+'" data-s="'+o.s+'" data-e="'+o.e+'" data-day="'+d+'"';
      var vt=(o.bg&&o.hasFg)?' ev-v':'';

/* ══════════ 拖動行程方塊改時間（仿 Google 日曆） ══════════

   拖上下＝改時間（15 分鐘一格），週檢視左右拖＝換日期；拖底部邊緣＝改結束時間。 */
var _drag=null,_suppressClick=false;
function _dgFind(el){while(el&&el!==document.body){if(el.classList&&el.classList.contains('dg'))return el;el=el.parentNode;}return null;}
document.addEventListener('pointerdown',function(e){
  if(e.button!==undefined&&e.button!==0)return;

    x0:e.clientX,y0:e.clientY,st0:sc.scrollTop,sl0:sc.scrollLeft,sc:sc,pid:e.pointerId,
    resize:!!(e.target.classList&&e.target.classList.contains('ev-rs')),

  var col=d.el.parentNode;

    var cols=[].slice.call(col.parentNode.querySelectorAll('.wk-col'));
    d.colIdx=cols.indexOf(col);d.colW=col.getBoundingClientRect().width;
    d.cols=cols.map(function(c){return !c.classList.contains('off');});

function _dragAutoScroll(){
  var d=_drag;if(!d||!d.active)return;

function _dragUpdate(){
  var d=_drag;if(!d||!d.active)return;

/* ══════════ 匯率自動更新 ══════════
   open.er-api.com 免費、免金鑰、含台幣。取 1 當地幣 = ? TWD。 */
async function fetchLiveRate(cur){
  cur=(cur||'').trim().toUpperCase();
  if(!cur) throw new Error('請先填幣別');
  if(cur==='TWD') return 1;
  var r=await fetch('https://open.er-api.com/v6/latest/'+encodeURIComponent(cur));
  if(!r.ok) throw new Error('查詢失敗 HTTP '+r.status);
  var d=await r.json();
  if(d.result!=='success') throw new Error(d['error-type']||'查無此幣別');
  var v=d.rates&&d.rates.TWD;
  if(!(v>0)) throw new Error('回傳沒有台幣匯率');
  return v;
}

  var cur=(curEl.value||'').trim().toUpperCase();
  if(!cur){ showToast('請先填當地幣別',true); curEl.focus(); return; }
  btn.disabled=true; var old=btn.textContent; btn.textContent='查詢中…';
  try{
    var v=await fetchLiveRate(cur);
    rateEl.value=(v>=1?v.toFixed(4):v.toPrecision(6)).replace(/0+$/,'').replace(/\.$/,'');
    if(which==='set'){
      var note=document.getElementById('setRateNote');
      if(note) note.textContent='已查到今日匯率，按「儲存設定」才會存下來';
    }
    showToast('✅ 1 '+cur+' = '+rateEl.value+' NT$',false);
  }catch(e){
    showToast('匯率更新失敗：'+e.message,true);
  }
  btn.disabled=false; btn.textContent=old;
}

function renderRateNote(){

/* ══════════ 跨旅程比較 ══════════ */
function tripDays(t){
  if(!t.start||!t.end) return (t.entries||[]).length?1:0;
  var a=new Date(t.start), b=new Date(t.end);
  return Math.max(1, Math.round((b-a)/86400000)+1);
}
function tripLabel(t){ return t.city||t.name||t.cityEn||'未命名'; }

function renderCompareHeader(){
  document.getElementById('thTitle').textContent='跨旅程比較';
  document.getElementById('thEn').textContent='';
  document.getElementById('thFields').innerHTML='';
  var n=(DB.trips||[]).length;
  document.getElementById('thMeta').textContent=n+' 趟旅程';
  var all=(DB.trips||[]).reduce(function(a,t){return a+tripTotalTWD(t);},0);
  document.getElementById('thTotal').innerHTML='<span class="cur">NT$</span>'+num(Math.round(all));
}

function renderCompare(){
  var trips=(DB.trips||[]).slice().sort(function(a,b){
    return String(b.start||'').localeCompare(String(a.start||''));
  });
  var cards=document.getElementById('cmpCards');
  var daily=document.getElementById('cmpDaily');
  var table=document.getElementById('cmpTable');
  var catBox=document.getElementById('cmpCat');
  var catLeg=document.getElementById('cmpCatLegend');

  if(!trips.length){
    cards.innerHTML='';
    daily.innerHTML='<tr><td class="cmp-empty">還沒有旅程</td></tr>';
    table.innerHTML=''; catBox.innerHTML=''; catLeg.innerHTML='';
    return;
  }

  var rows=trips.map(function(t){
    var total=tripTotalTWD(t), days=tripDays(t);
    return {
      t:t, label:tripLabel(t), total:total, days:days,
      per: days>0 ? total/days : 0,
      budget:+t.budget||0,
      count:(t.entries||[]).length,
      cur:t.currency||'TWD'
    };
  });

  // ── 概況卡 ──
  var sumAll=rows.reduce(function(a,r){return a+r.total;},0);
  var sumDays=rows.reduce(function(a,r){return a+r.days;},0);
  var withPer=rows.filter(function(r){return r.per>0;});
  /* 平均只算有記帳的旅程：沒記帳的天數放進分母會把平均拉低好幾倍 */
  var trackedDays=withPer.reduce(function(a,r){return a+r.days;},0);
  var trackedAll=withPer.reduce(function(a,r){return a+r.total;},0);
  var most=withPer.slice().sort(function(a,b){return b.per-a.per;})[0];
  var least=withPer.slice().sort(function(a,b){return a.per-b.per;})[0];
  cards.innerHTML=
     '<div class="stat-card red"><div class="sc-label">累計旅費 NT$</div><div class="sc-value">'+num(Math.round(sumAll))+'</div></div>'
    +'<div class="stat-card orange"><div class="sc-label">累計天數</div><div class="sc-value">'+sumDays+' 天</div></div>'
    +'<div class="stat-card green"><div class="sc-label">整體每日平均 NT$</div><div class="sc-value">'+(trackedDays?num(Math.round(trackedAll/trackedDays)):'—')+'</div>'+(withPer.length<rows.length?'<div class="sc-sub">依 '+withPer.length+' 趟有記帳的旅程</div>':'')+'</div>'
    +(most?'<div class="stat-card orange"><div class="sc-label">最花錢的一趟</div><div class="sc-value" style="font-size:15px;">'+esc(most.label)+' <small style="font-size:11px;opacity:.7;">'+String(most.t.start||'').slice(0,4)+'</small></div></div>':'')
    +(least&&least!==most?'<div class="stat-card green"><div class="sc-label">最省的一趟</div><div class="sc-value" style="font-size:15px;">'+esc(least.label)+' <small style="font-size:11px;opacity:.7;">'+String(least.t.start||'').slice(0,4)+'</small></div></div>':'');

  // ── 每日平均長條 ──
  var maxPer=Math.max.apply(null, rows.map(function(r){return r.per;}).concat([1]));
  daily.innerHTML=rows.map(function(r){
    return '<tr><td style="width:34%;"><span class="cmp-name">'+esc(r.label)+'</span>'
        +'<span class="cmp-sub"> · '+r.days+' 天</span></td>'
      +'<td style="width:46%;"><div class="cmp-bar"><i style="width:'+(r.per/maxPer*100).toFixed(1)+'%"></i></div></td>'
      +'<td>'+(r.per?num(Math.round(r.per)):'—')+'</td></tr>';
  }).join('');

  // ── 總覽表 ──
  table.innerHTML='<thead><tr>'
      +'<th>旅程</th><th>日期</th><th>天數</th><th>總花費 NT$</th><th>每日平均</th><th>預算</th><th>使用率</th><th>筆數</th>'
    +'</tr></thead><tbody>'
    +rows.map(function(r){
      var used=r.budget>0?(r.total/r.budget*100):0;
      var col=used>100?'var(--red-dk)':(used>85?'var(--amber)':'var(--green-dk)');
      return '<tr>'
        +'<td><span class="cmp-name">'+esc(r.label)+'</span>'+(r.cur!=='TWD'?'<span class="cmp-sub"> '+esc(r.cur)+'</span>':'')+'</td>'
        +'<td class="cmp-sub" style="font-family:inherit;">'+esc(r.t.start||'—')+'</td>'
        +'<td>'+r.days+'</td>'
        +'<td>'+num(Math.round(r.total))+'</td>'
        +'<td>'+(r.per?num(Math.round(r.per)):'—')+'</td>'
        +'<td>'+(r.budget?num(r.budget):'—')+'</td>'
        +'<td style="color:'+col+';">'+(r.budget?used.toFixed(0)+'%':'—')+'</td>'
        +'<td>'+r.count+'</td>'
      +'</tr>';
    }).join('')+'</tbody>';

  // ── 類別佔比堆疊條 ──
  var cats=Object.keys(TAG);
  catBox.innerHTML=rows.map(function(r){
    var by={}, tot=0;
    (r.t.entries||[]).forEach(function(e){
      if(+e.amount>0){ var v=entryTWD(e,r.t); by[e.type]=(by[e.type]||0)+v; tot+=v; }
    });
    if(tot<=0) return '';
    var seg=cats.map(function(c){
      var v=by[c]||0; if(!v) return '';
      return '<i title="'+esc(c)+' '+Math.round(v/tot*100)+'%" style="width:'+(v/tot*100).toFixed(2)+'%;background:'+TAG[c].pie+';"></i>';
    }).join('');
    var top=Object.entries(by).sort(function(a,b){return b[1]-a[1];})[0];
    return '<div style="margin-bottom:12px;">'
      +'<div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px;">'
        +'<span class="cmp-name">'+esc(r.label)+'</span>'
        +'<span class="cmp-sub">最大宗：'+esc(top[0])+' '+Math.round(top[1]/tot*100)+'%</span></div>'
      +'<div class="cmp-stack">'+seg+'</div></div>';
  }).join('')||'<div class="cmp-empty">還沒有花費資料</div>';

  catLeg.innerHTML=cats.map(function(c){
    return '<span class="legend-item"><span class="legend-swatch" style="background:'+TAG[c].pie+';"></span>'+esc(c)+'</span>';
  }).join('');
}

function addEntry(){
  var t=curTrip();if(!t)return;
  var title=document.getElementById('logTitle').value.trim();
  var amt=parseFloat(document.getElementById('logAmount').value);
  if(!title&&!(amt>0)){showToast('請輸入地點/項目,或金額',true);return;}
  var type=document.getElementById('logType').value;

    id:uid(),date:itSelectedDate,

  document.getElementById('logEnd').value='';

function isPhone(){return window.matchMedia&&matchMedia('(max-width:768px)').matches;}
function toggleLogSheet(open){

function delEntry(id){
  var t=curTrip();if(!t)return;
  var i=t.entries.findIndex(x=>x.id===id);if(i<0)return;
  var gone=t.entries.splice(i,1)[0];
  markDirty();renderLog();renderHeader();
  showUndo('已刪除「'+(gone.title||gone.type)+'」',function(){
    var tt=(DB.trips||[]).find(x=>x.id===t.id);if(!tt)return;
    tt.entries.splice(Math.min(i,tt.entries.length),0,gone);
    markDirty();if(curTrip()===tt){renderLog();renderHeader();}
  });

/* 刪除後 6 秒內可復原（取代原本一點就永久刪除） */
function showUndo(msg,undo){
  var u=document.getElementById('undoToast');
  if(!u){u=document.createElement('div');u.id='undoToast';u.setAttribute('role','status');document.body.appendChild(u);}
  u.innerHTML='<span></span><button type="button">復原</button>';
  u.firstChild.textContent=msg;
  clearTimeout(u._to);u.classList.add('show');
  u.lastChild.onclick=function(){clearTimeout(u._to);u.classList.remove('show');undo();};
  u._to=setTimeout(function(){u.classList.remove('show');},6000);
}
var _detailId=null,_detailEdit=false;
function timeOptionsHTML(sel){

  for(var m=0;m<1440;m+=15){var v=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');o+='<option'+(v===sel?' selected':'')+'>'+v+'</option>';}

function endOptionsHTML(startVal,sel){

function optsHTML(list,sel){return list.map(function(o){return '<option'+(o===sel?' selected':'')+'>'+esc(o)+'</option>';}).join('');}
function dateOptionsHTML(t,sel){return dateRange(t.start,t.end).map(function(d){return '<option value="'+d+'"'+(d===sel?' selected':'')+'>'+fmtMD(d)+' '+weekdayZh(d)+'</option>';}).join('');}
/* 卡片展開：詳細視窗從被點的行程方塊長出來，關閉時縮回去（空間連續性） */
var EASE_OUT='cubic-bezier(0.23, 1, 0.32, 1)';
var _detailSrc=null,_detailAnim=null,_closing=false;
function reduceMotion(){return window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;}
function srcTransform(card,src){
  /* 由卡片最終位置反推「縮在方塊上」的 transform；scale 夾在 0.35~0.9，避免太小或幾乎不動 */
  var c=card.getBoundingClientRect(),s=src.getBoundingClientRect();
  if(!c.width||!s.width)return null;
  var dx=(s.left+s.width/2)-(c.left+c.width/2),dy=(s.top+s.height/2)-(c.top+c.height/2);
  var k=Math.max(0.35,Math.min(0.9,s.width/c.width));
  return 'translate('+dx.toFixed(1)+'px,'+dy.toFixed(1)+'px) scale('+k.toFixed(3)+')';
}
function openEntryDetail(id,src){
  var t=curTrip();if(!t)return;
  var x=(t.entries||[]).find(function(e){return e.id===id;});
  if(!x)return;
  var mask=document.getElementById('detailModal'),card=document.getElementById('detailCard');
  if(_detailAnim){_detailAnim.cancel();_detailAnim=null;}
  if(mask.getAnimations)mask.getAnimations().forEach(function(a){a.cancel();}); /* 關到一半又打開：取消舊的淡出，免得它把新視窗關掉 */
  card.classList.remove('from-src');_closing=false;mask.style.opacity='';
  _detailId=id;_detailEdit=false;_detailSrc=src||null;
  mask.classList.add('open');
  renderDetail();
  if(!_detailSrc||!card.animate)return;              /* 沒有來源（或不支援 WAAPI）就用原本的 CSS 淡入 */
  card.classList.add('from-src');
  var from=reduceMotion()?null:srcTransform(card,_detailSrc);
  _detailAnim=card.animate(from
    ?[{transform:from,opacity:0},{transform:'none',opacity:1}]
    :[{opacity:0},{opacity:1}],
    {duration:from?280:160,easing:EASE_OUT});
  _detailAnim.onfinish=function(){_detailAnim=null;};
}
function renderDetail(){

      +'<label>結束</label><select id="edEnd">'+endOptionsHTML(x.time||'',x.end||'')+'</select>'
      +'<label>幣別</label><select id="edCur">'+optsHTML(curOpts,x.cur||curOpts[0])+'</select>'
      +'<label>金額</label><input type="number" id="edAmount" inputmode="decimal" placeholder="選填" value="'+(+x.amount>0?x.amount:'')+'">'
      +'<label>備註</label><textarea id="edNote" rows="3">'+esc(x.note||'')+'</textarea>'
      +'</div>';
    actions.innerHTML='<button class="btn-cancel" onclick="cancelEdit()">取消</button>'
      +'<button class="btn-add" onclick="saveDetail()">儲存</button>';
  }else{
    var timeTxt=x.time?(x.time+(x.end?' – '+x.end:'')):'未定時間';
    var rows='<div class="dt-row"><span class="dt-key">日期</span><span class="dt-val">'+fmtMD(x.date)+' '+weekdayZh(x.date)+'</span></div>'
      +'<div class="dt-row"><span class="dt-key">時間</span><span class="dt-val">'+esc(timeTxt)+'</span></div>';
    if(+x.amount>0){
      var amtInner=(x.cur==='TWD')?'NT$ '+num(x.amount)
        :num(x.amount)+' '+esc(x.cur||'')+'<span class="dt-twd">≈ NT$'+num(entryTWD(x,t))+'</span>';
      rows+='<div class="dt-row"><span class="dt-key">金額</span><span class="dt-val dt-amt'+(x.cur==='TWD'?' cur-twd':'')+'">'+amtInner+'</span></div>';
    }
    rows+='<div class="dt-row"><span class="dt-key">備註</span><span class="dt-val">'+(x.note?esc(x.note):'<span style="color:var(--hint)">（無）</span>')+'</span></div>';
    body.innerHTML='<div class="dt-head"><span class="dt-badge" style="background:'+ty.bg+';color:'+ty.c+';">'+esc(x.type)+'</span></div>'
      +'<div class="dt-title">'+esc(x.title)+'</div>'+rows;
    actions.innerHTML='<button class="btn-danger" style="margin:0 auto 0 0;" onclick="detailDelete()">刪除</button>'
      +'<button class="btn-add" onclick="editDetail()">編輯</button>'
      +'<button class="btn-cancel" onclick="closeDetail()">關閉</button>';
  }

function editDetail(){_detailEdit=true;renderDetail();}
function cancelEdit(){_detailEdit=false;renderDetail();}
function saveDetail(){
  var t=curTrip();if(!t)return;
  var x=(t.entries||[]).find(function(e){return e.id===_detailId;});if(!x)return;

document.addEventListener('keydown',function(e){
  if(e.key==='Enter'&&e.target&&['logTitle','logAmount','logNote'].indexOf(e.target.id)>=0&&!e.isComposing){e.preventDefault();addEntry();return;}
  if(e.key!=='Escape')return;
  if(document.getElementById('detailModal').classList.contains('open')){closeDetail();return;}
  var tm=document.getElementById('tripModal');if(tm&&tm.classList.contains('open')){closeTripModal();return;}
  var lf=document.getElementById('logForm');if(lf&&lf.classList.contains('open')){toggleLogSheet(false);return;}
  var sb=document.getElementById('sidebar');if(sb&&sb.classList.contains('open'))toggleSidebar(false);

function closeDetail(){
  var mask=document.getElementById('detailModal'),card=document.getElementById('detailCard');
  _detailId=null;_detailEdit=false;
  function done(){mask.classList.remove('open');mask.style.opacity='';card.classList.remove('from-src');_closing=false;_detailAnim=null;}
  if(!mask.classList.contains('open')||_closing||!card.animate){done();return;}
  if(_detailAnim)_detailAnim.cancel();
  _closing=true;
  /* 方塊還在畫面上就縮回去；被刪掉了就原地淡出 */
  var to=(!reduceMotion()&&_detailSrc&&_detailSrc.isConnected)?srcTransform(card,_detailSrc):null;
  var fade=reduceMotion()?{opacity:0}:{transform:'scale(0.97)',opacity:0};
  card.classList.add('from-src');
  _detailAnim=card.animate([{transform:'none',opacity:1},to?{transform:to,opacity:0}:fade],{duration:to?200:150,easing:EASE_OUT,fill:'forwards'});
  mask.animate([{opacity:1},{opacity:0}],{duration:to?200:150,easing:'ease',fill:'forwards'}).onfinish=function(){
    if(_detailAnim){_detailAnim.cancel();}
    mask.getAnimations().forEach(function(a){a.cancel();});
    done();
  };
  _detailSrc=null;
}
function detailDelete(){
  if(!_detailId)return;
  var id=_detailId;closeDetail();
  delEntry(id);
}

// ── 統計 ──
function renderStats(){
  var t=curTrip(),rate=+t.rate||1;
  var byCat={};
  t.entries.forEach(e=>{if(+e.amount>0)byCat[e.type]=(byCat[e.type]||0)+entryTWD(e,t);});
  var entries=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
  var total=entries.reduce((s,x)=>s+x[1],0);
  // 甜甜圈
  var svg='',a0=-Math.PI/2,cx=95,cy=95,R=88,ri=58;
  function arc(a,b,col){
    var L=(b-a)>Math.PI?1:0;
    var p=function(r,an){return (cx+r*Math.cos(an)).toFixed(2)+' '+(cy+r*Math.sin(an)).toFixed(2);};
    return '<path d="M'+p(R,a)+' A'+R+' '+R+' 0 '+L+' 1 '+p(R,b)+' L'+p(ri,b)+' A'+ri+' '+ri+' 0 '+L+' 0 '+p(ri,a)+' Z" fill="'+col+'" stroke="#fff" stroke-width="2"/>';
  }
  if(total<=0){
    svg='<circle cx="95" cy="95" r="73" fill="none" stroke="#E8EAE5" stroke-width="30"/>';
  }else if(entries.length===1){
    svg='<circle cx="95" cy="95" r="73" fill="none" stroke="'+(TAG[entries[0][0]]||TAG['其他']).pie+'" stroke-width="30"/>';
  }else{
    entries.forEach(en=>{
      var a1=a0+en[1]/total*2*Math.PI;
      svg+=arc(a0,a1,(TAG[en[0]]||TAG['其他']).pie);
      a0=a1;
    });
  }
  svg+='<text x="95" y="88" text-anchor="middle" font-size="13" fill="#687083" font-family="Noto Sans TC,sans-serif">總計</text>'
    +'<text x="95" y="112" text-anchor="middle" font-size="22" font-weight="700" fill="#1A2238" font-family="Barlow Semi Condensed,sans-serif">'+num(total)+'</text>';
  document.getElementById('pieChart').innerHTML=svg;
  document.getElementById('catTable').innerHTML=entries.map(en=>{
    var c=TAG[en[0]]||TAG['其他'];
    return '<tr><td><span class="legend-item"><span class="legend-swatch" style="background:'+c.pie+';"></span>'+esc(en[0])+'</span></td>'
      +'<td class="num">NT$ '+num(en[1])+'</td>'
      +'<td class="num" style="color:'+c.c+';">'+(total?Math.round(en[1]/total*100):0)+'%</td></tr>';
  }).join('')||'<tr><td style="color:var(--hint);">還沒有資料</td></tr>';
  // 每日長條（依類別堆疊）
  var days=dateRange(t.start,t.end);
  var per=days.map(d=>{var o={},s=0;t.entries.filter(e=>e.date===d).forEach(e=>{var v=entryTWD(e,t);if(v>0){o[e.type]=(o[e.type]||0)+v;s+=v;}});return {o:o,s:s};});
  var max=Math.max(...per.map(p=>p.s),1);
  var order=Object.keys(TAG);
  document.getElementById('barChart').innerHTML=days.map((d,i)=>{
    var p=per[i],segs='';
    order.forEach(k=>{if(p.o[k])segs+='<i style="height:'+(p.o[k]/p.s*100).toFixed(2)+'%;background:'+TAG[k].pie+';" title="'+k+' NT$ '+num(p.o[k])+'"></i>';});
    Object.keys(p.o).forEach(k=>{if(order.indexOf(k)<0)segs+='<i style="height:'+(p.o[k]/p.s*100).toFixed(2)+'%;background:'+TAG['其他'].pie+';"></i>';});
    return '<div class="bar-col"><div class="bar-spacer"></div><div class="bar-val">'+(p.s>0?num(p.s):'')+'</div>'
      +'<div class="bar-stack" style="height:'+Math.round(p.s/max*150)+'px;">'+segs+'</div>'
      +'<div class="bar-day">'+fmtMD(d)+'</div></div>';
  }).join('');
  var used=order.filter(k=>per.some(p=>p.o[k]));
  document.getElementById('barLegend').innerHTML=used.map(k=>'<span class="legend-item"><span class="legend-swatch" style="background:'+TAG[k].pie+';"></span>'+k+'</span>').join('');
}

// ── 設定 ──
function renderSettings(){
  var t=curTrip();
  document.getElementById('setCity').value=t.city||'';
  document.getElementById('setCityEn').value=t.cityEn||'';
  document.getElementById('setStart').value=t.start||'';
  document.getElementById('setEnd').value=t.end||'';
  document.getElementById('setCurrency').value=t.currency||'TWD';
  document.getElementById('setRate').value=t.rate||1;
  document.getElementById('setBudget').value=t.budget||'';
  renderRateNote();
}
function saveTripSettings(){
  var t=curTrip();if(!t)return;
  var s=document.getElementById('setStart').value,e=document.getElementById('setEnd').value;
  if(!s||!e||s>e){showToast('日期範圍不正確',true);return;}
  t.city=document.getElementById('setCity').value.trim()||t.city;
  t.cityEn=document.getElementById('setCityEn').value.trim();
  t.start=s;t.end=e;
  t.currency=(document.getElementById('setCurrency').value.trim()||'TWD').toUpperCase();
  var newRate=parseFloat(document.getElementById('setRate').value)||1;
  if(newRate!==t.rate){ t.rate=newRate; t.rateAt=new Date().toISOString(); }
  t.budget=parseFloat(document.getElementById('setBudget').value)||0;
  markDirty();renderAll();
  showToast('✅ 設定已更新（記得同步）',false);
}
function deleteTrip(){
  var t=curTrip();if(!t)return;
  if(!confirm('確定刪除「'+t.city+' '+t.start+'」整個旅程？行程和記帳都會一起刪除。'))return;
  DB.trips=DB.trips.filter(x=>x.id!==t.id);
  currentTripId=DB.trips.length?[...DB.trips].sort((a,b)=>b.start.localeCompare(a.start))[0].id:null;
  currentView='log';switchView('log');
  markDirty();renderAll();
}

  var city=document.getElementById('nmCity').value.trim();
  var s=document.getElementById('nmStart').value,e=document.getElementById('nmEnd').value;
