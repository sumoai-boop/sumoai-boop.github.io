<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>食記 — Sumoai's Reel</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;600;900&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* ════════════════════════════════════════════════
     食記 · 點菜單
     印刷紅 = 單子本身印好的格線與欄名
     原子筆藍 = 我自己寫上去的東西（店名、金額、日期、評分）
     ════════════════════════════════════════════════ */
  :root{
    --paper:#E8EFDD;        /* 複寫聯的淡綠紙 */
    --sheet:#FBFCF6;        /* 上聯白紙 */
    --print:#C22B27;        /* 印刷紅 */
    --print-soft:rgba(194,43,39,.30);
    --print-faint:rgba(194,43,39,.12);
    --pen:#21378A;          /* 原子筆藍 */
    --pen-faint:rgba(33,55,138,.14);
    --ink:#23251E;
    --muted:#5C6355;
    --photo-bg:#1F211C;
    --f-print:'Noto Serif TC','Songti TC','PMingLiU',serif;
    --f-pen:'LXGW WenKai TC','Kaiti TC','DFKai-SB','Noto Serif TC',serif;
    /* 舊變數名（JS 內嵌樣式仍會引用） */
    --tomato:var(--print); --tomato-d:var(--print); --mustard:var(--pen);
    --ink2:var(--muted); --ink3:var(--muted); --card:var(--sheet); --bg:var(--paper);
    --line:var(--print-soft); --basil:#2E7D5B;
  }
  *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--paper);color:var(--ink);min-height:100vh;font-family:var(--f-print);overflow-x:hidden;
    -webkit-font-smoothing:antialiased;}
  .bg-circle{display:none;}
  :focus-visible{outline:2px solid var(--pen);outline-offset:2px;}
  .pen{font-family:var(--f-pen);color:var(--pen);}

  .page-content{position:relative;z-index:10;max-width:1200px;margin:0 auto;padding:52px 16px 110px;}

  /* ── 單頭 ── */
  .slip{background:var(--sheet);border:1.5px solid var(--print);border-radius:3px;margin-bottom:26px;
    box-shadow:0 1px 0 rgba(0,0,0,.04), 0 14px 30px -18px rgba(40,50,30,.35);position:relative;}
  .slip::after{content:'';position:absolute;left:0;right:0;top:-7px;height:7px;
    background:radial-gradient(circle at 7px 7px, var(--paper) 3.2px, transparent 3.6px) 0 0/14px 7px repeat-x;}
  .slip-top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px 24px;flex-wrap:wrap;
    padding:22px 26px 16px;border-bottom:4px double var(--print);}
  .slip-title{font-family:var(--f-print);font-weight:900;color:var(--print);font-size:clamp(52px,8vw,88px);
    line-height:.9;letter-spacing:.12em;}
  .slip-sub{font-family:var(--f-print);color:var(--print);font-size:15px;font-weight:600;letter-spacing:.2em;padding-bottom:6px;}
  .slip-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr)) minmax(0,1.6fr);}
  .slip-cell{padding:12px 18px 16px;border-left:1px solid var(--print-soft);min-width:0;}
  .slip-cell:first-child{border-left:none;}
  .slip-cell .lbl{display:block;font-family:var(--f-print);color:var(--print);font-size:14px;font-weight:600;letter-spacing:.08em;margin-bottom:6px;}
  .slip-cell .val{display:block;font-family:var(--f-pen);color:var(--pen);font-size:34px;font-weight:700;line-height:1.05;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .slip-cell.total{border-left:4px double var(--print);background:var(--print-faint);}
  .slip-cell.total .val{font-size:46px;}
  @media(max-width:760px){
    .slip-top{padding:18px 16px 12px;}
    .slip-grid{grid-template-columns:repeat(3,minmax(0,1fr));}
    .slip-cell{padding:10px 12px 12px;border-top:1px solid var(--print-soft);}
    .slip-cell:nth-child(-n+3){border-top:none;}
    .slip-cell:nth-child(4){border-left:none;}
    .slip-cell.total{grid-column:1/-1;border-left:none;border-top:4px double var(--print);}
    .slip-cell .val{font-size:26px;}
    .slip-cell.total .val{font-size:38px;}
  }

  /* ── 工具列 ── */
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap;}
  .search-wrap{flex:1;min-width:200px;position:relative;}
  .search-wrap svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);pointer-events:none;color:var(--print);}
  .search-input{width:100%;background:var(--sheet);border:1.5px solid var(--print-soft);border-radius:3px;padding:10px 14px 10px 36px;
    color:var(--pen);font-family:var(--f-pen);font-size:17px;outline:none;transition:border-color .15s;}
  .search-input::placeholder{color:#8C9384;font-family:var(--f-print);font-size:15px;}
  .search-input:focus{border-color:var(--pen);}
  .sort-select{background:var(--sheet);border:1.5px solid var(--print-soft);border-radius:3px;padding:10px 12px;color:var(--ink);
    font-family:var(--f-print);font-size:15px;font-weight:600;outline:none;cursor:pointer;}
  .sort-select:hover{border-color:var(--print);}
  .sort-select option{background:#fff;color:var(--ink);}
  .count-badge{font-family:var(--f-print);font-size:15px;color:var(--muted);white-space:nowrap;}
  .add-btn{height:46px;padding:0 20px;border-radius:3px;border:none;background:var(--print);color:#fff;cursor:pointer;
    font-family:var(--f-print);font-size:17px;font-weight:900;letter-spacing:.08em;white-space:nowrap;flex-shrink:0;
    box-shadow:0 2px 0 #8E1C19;transition:transform .1s, box-shadow .1s;}
  .add-btn:hover{background:#AD2421;}
  .add-btn:active{transform:translateY(2px);box-shadow:0 0 0 #8E1C19;}

  /* ── 分頁：原子筆圈起來 ── */
  .tabbar{display:flex;gap:6px;margin-bottom:20px;border-bottom:1.5px solid var(--print-soft);padding-bottom:6px;}
  .tabbar button{position:relative;min-height:0;background:none;border:none;cursor:pointer;padding:8px 18px;
    font-family:var(--f-print);font-size:18px;font-weight:600;color:var(--muted);letter-spacing:.1em;}
  .tabbar button:hover{color:var(--ink);}
  .tabbar button.on{color:var(--pen);font-weight:900;}
  .tabbar button.on::after{content:'';position:absolute;inset:2px 4px;border:2px solid var(--pen);border-radius:50% 46% 52% 48% / 55% 50% 50% 45%;
    transform:rotate(-3deg);pointer-events:none;}

  /* ── 年份列 ── */
  .yr-bar{position:sticky;top:28px;z-index:20;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px 16px;
    margin:0 -16px 22px;padding:10px 16px;background:rgba(232,239,221,.94);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
    border-bottom:1.5px solid var(--print-soft);}
  .yr-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:3px 2px;}
  .yr-pills::-webkit-scrollbar{display:none;}
  .yr-pill{flex:0 0 auto;min-height:0;padding:5px 14px;border-radius:3px;border:1.5px solid transparent;background:none;cursor:pointer;
    font-family:var(--f-print);font-size:17px;font-weight:600;color:var(--muted);letter-spacing:.04em;}
  .yr-pill:hover{color:var(--ink);border-color:var(--print-soft);}
  .yr-pill.on{color:var(--print);border:2px solid var(--print);font-weight:900;transform:rotate(-2deg);background:rgba(194,43,39,.05);}
  .yr-sum{display:flex;align-items:baseline;gap:14px;}
  .yr-sum .meta{font-family:var(--f-print);font-size:15px;color:var(--muted);}
  .yr-sum .t{font-family:var(--f-pen);font-size:28px;font-weight:700;color:var(--pen);white-space:nowrap;}
  .yr-sum .t small{font-family:var(--f-print);font-size:14px;font-weight:600;color:var(--print);margin-right:8px;letter-spacing:.08em;}

  /* ── 月份：手寫的月份＋印好的雙線 ── */
  .mon{margin-bottom:40px;}
  .mon-h{display:flex;justify-content:space-between;align-items:flex-end;flex-wrap:wrap;gap:6px 16px;
    margin:0 0 14px;padding-bottom:8px;border-bottom:4px double var(--print);}
  .mon-h h2{display:flex;align-items:baseline;gap:4px;font-family:var(--f-print);font-size:20px;font-weight:600;color:var(--print);line-height:1;}
  .mon-h h2 .mn{font-family:var(--f-pen);font-size:60px;font-weight:700;color:var(--pen);line-height:.8;margin-right:2px;}
  .mon-h h2 small{font-size:15px;color:var(--muted);font-weight:400;margin-left:10px;}
  .mon-h .r{display:flex;align-items:baseline;gap:16px;}
  .mon-h .meta{font-family:var(--f-print);font-size:15px;color:var(--muted);}
  .mon-h .t{font-family:var(--f-pen);font-size:26px;font-weight:700;color:var(--pen);white-space:nowrap;}
  .mon-h .t small{font-family:var(--f-print);font-size:14px;font-weight:600;color:var(--print);margin-right:8px;letter-spacing:.08em;}
  .mon.nodate .mon-h h2{font-size:26px;color:var(--muted);}

  /* ── 照片牆 ── */
  .photo-grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;}
  .photo-card{position:relative;aspect-ratio:3/4;overflow:hidden;cursor:pointer;background:#D3DDC6;border-radius:3px;
    box-shadow:0 1px 2px rgba(30,40,20,.18);}
  .photo-card img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease;}
  .photo-card:hover img{transform:scale(1.04);}
  .photo-card:focus-visible{outline:3px solid var(--pen);outline-offset:2px;}
  .photo-card .card-bottom{position:absolute;bottom:0;left:0;right:0;pointer-events:none;
    background:linear-gradient(to top, rgba(0,0,0,.88) 0%, rgba(0,0,0,.45) 55%, transparent 100%);padding:44px 10px 12px;}
  .card-name{font-family:var(--f-pen);font-size:17px;font-weight:700;color:#fff;line-height:1.25;
    overflow:hidden;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;text-shadow:0 1px 6px rgba(0,0,0,.7);}
  .photo-card .overlay{display:none;}
  .photo-card.no-photo{display:flex;align-items:center;justify-content:center;
    background:var(--sheet) repeating-linear-gradient(to bottom, transparent 0 27px, var(--print-faint) 27px 28px);
    border:1.5px solid var(--print-soft);}
  .no-photo-icon{font-size:34px;opacity:.45;}
  .photo-card.no-photo .card-bottom{background:linear-gradient(to top, rgba(35,37,30,.9), rgba(35,37,30,.0));}
  .card-type{position:absolute;left:0;right:0;bottom:0;height:4px;z-index:3;}
  .empty-state{grid-column:1/-1;padding:80px 0;display:flex;flex-direction:column;align-items:center;gap:12px;}
  .empty-icon{font-size:44px;opacity:.5;}
  .empty-text{font-family:var(--f-print);font-size:17px;color:var(--muted);}
  @media(max-width:1000px){ .photo-grid{grid-template-columns:repeat(4,minmax(0,1fr));} }
  @media(max-width:600px){
    .page-content{padding:44px 12px 100px;}
    .photo-grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:5px;}
    .card-name{font-size:14px;}
    .photo-card .card-bottom{padding:34px 7px 9px;}
    .mon-h h2 .mn{font-size:46px;}
    .mon-h .t{font-size:21px;}
    .yr-bar{margin:0 -12px 18px;padding:8px 12px;}
    .yr-sum .t{font-size:22px;}
    .tabbar button{font-size:16px;padding:8px 14px;}
    .add-btn{height:42px;padding:0 14px;font-size:15px;}
  }

  .tchip{display:inline-flex;align-items:center;gap:6px;}
  .tchip i{width:9px;height:9px;border-radius:50%;display:inline-block;flex-shrink:0;}

  /* ── 詳情 ── */
  .modal-mask{position:fixed;inset:0;z-index:9000;background:rgba(20,26,16,.62);display:none;align-items:center;justify-content:center;padding:24px;
    backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
  .modal-mask.open{display:flex;}
  @keyframes modalIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
  .modal{background:var(--sheet);border-radius:4px;max-width:520px;width:100%;overflow:hidden;max-height:90vh;display:flex;flex-direction:column;
    box-shadow:0 30px 70px -20px rgba(10,20,5,.6);animation:modalIn .26s cubic-bezier(.2,.8,.2,1);}
  .modal-body{padding:20px 24px 24px;overflow-y:auto;flex:1;}
  .modal-title{font-family:var(--f-pen);font-size:34px;font-weight:700;color:var(--pen);line-height:1.2;margin-bottom:6px;}
  .modal-addr{font-family:var(--f-print);font-size:15px;color:var(--muted);margin-bottom:6px;display:flex;align-items:center;gap:6px;}
  .modal-addr svg{flex-shrink:0;color:var(--print);}
  .modal-addr a{color:var(--print);font-weight:600;text-decoration:none;border-bottom:1.5px solid var(--print-soft);}
  .modal-row{display:flex;gap:16px;align-items:baseline;}
  .modal-price{font-family:var(--f-pen);color:var(--pen);font-weight:700;}
  .modal-price .price-prefix{font-size:22px;}
  .modal-price .price-num{font-size:48px;line-height:1;}
  .modal-price-lbl{font-family:var(--f-print);font-size:14px;font-weight:600;color:var(--print);}
  .modal-stars{display:flex;gap:2px;}
  .modal-score-num{font-family:var(--f-pen);font-size:26px;color:var(--pen);font-weight:700;margin-left:6px;}
  .modal-actions{display:flex;gap:10px;margin-top:16px;}
  .modal-btn{min-height:0;padding:11px 26px;border-radius:3px;cursor:pointer;font-family:var(--f-print);font-size:16px;font-weight:900;letter-spacing:.1em;}
  .modal-btn-edit{background:var(--print);color:#fff;border:none;box-shadow:0 2px 0 #8E1C19;}
  .modal-btn-edit:hover{background:#AD2421;}
  .modal-btn-del{background:transparent;color:var(--print);border:1.5px solid var(--print-soft);}
  .modal-btn-del:hover{border-color:var(--print);}
  .modal-close{position:absolute;top:14px;right:14px;width:36px;height:36px;min-height:0;border-radius:50%;background:rgba(35,37,30,.08);border:none;cursor:pointer;
    color:var(--ink);font-size:17px;display:flex;align-items:center;justify-content:center;z-index:5;}
  .modal-close:hover{background:rgba(35,37,30,.16);}

  .d-sec{margin-top:16px;padding-top:12px;border-top:1px solid var(--print-soft);}
  .d-lbl{font-family:var(--f-print);font-size:14px;font-weight:600;color:var(--print);letter-spacing:.08em;margin-bottom:6px;display:flex;justify-content:space-between;gap:10px;}
  .d-lbl span{color:var(--muted);font-weight:400;letter-spacing:0;}
  .d-note{font-family:var(--f-pen);font-size:18px;color:var(--pen);line-height:1.7;white-space:pre-wrap;}
  .d-facts{display:flex;gap:18px;flex-wrap:wrap;margin-top:10px;font-family:var(--f-print);font-size:15px;color:var(--muted);}
  .d-facts b{font-family:var(--f-pen);color:var(--pen);font-size:20px;font-weight:700;margin-left:4px;}

  /* 用餐記錄：點菜單的品項表 */
  .dv-table{max-height:280px;overflow-y:auto;scrollbar-width:thin;scrollbar-color:var(--print-soft) transparent;}
  .dv-head,.dv-row{display:grid;grid-template-columns:118px 46px minmax(0,1fr) 78px 44px;gap:8px;align-items:baseline;padding:7px 6px;}
  .dv-head{font-family:var(--f-print);font-size:13px;font-weight:600;color:var(--print);border-bottom:1.5px solid var(--print);position:sticky;top:0;background:var(--sheet);z-index:1;}
  .dv-head span:nth-child(n+4),.dv-row > span:nth-child(n+4){text-align:right;}
  .dv-row{border-bottom:1px solid var(--print-soft);cursor:pointer;font-family:var(--f-pen);font-size:17px;color:var(--pen);transition:background .12s;}
  .dv-row:hover{background:var(--pen-faint);}
  .dv-row.on{background:var(--pen-faint);box-shadow:inset 3px 0 0 var(--pen);}
  .dv-row .dv-menu{font-size:16px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .dv-row .dv-meal{font-family:var(--f-print);font-size:13px;font-weight:600;padding:1px 6px;border-radius:3px;justify-self:start;}
  .dv-cam{font-family:var(--f-print);font-size:12px;color:var(--print);margin-left:4px;white-space:nowrap;}
  .dv-row > span:first-child{white-space:nowrap;}
  @media(max-width:600px){
    .dv-head,.dv-row{grid-template-columns:100px 36px minmax(0,1fr) 70px 38px;gap:5px;font-size:15px;}
  }

  #detailModal{max-width:980px;width:100%;height:min(680px, calc(100vh - 48px));max-height:none;
    display:grid;grid-template-columns:1.05fr 1fr;grid-template-rows:minmax(0,1fr);position:relative;}
  #detailMask{z-index:10000;}
  #detailModal .d-media{position:relative;display:flex;flex-direction:column;min-height:0;background:var(--photo-bg);overflow:hidden;}
  #detailModal .d-main{position:relative;flex:1;min-height:0;overflow:hidden;touch-action:pan-y;}
  #detailModal .d-bg{position:absolute;inset:-40px;background-size:cover;background-position:center;filter:blur(28px) brightness(.4) saturate(1.1);transform:scale(1.1);}
  #detailModal .d-main img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;animation:dFade .22s ease;}
  @keyframes dFade{from{opacity:0}to{opacity:1}}
  #detailModal .d-empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:90px;opacity:.2;}
  #detailModal .d-nav{position:absolute;top:50%;transform:translateY(-50%);width:40px;height:40px;min-height:0;border-radius:50%;
    border:1px solid rgba(255,255,255,.25);background:rgba(0,0,0,.45);color:#fff;font-size:22px;line-height:1;cursor:pointer;
    display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .2s;z-index:2;}
  #detailModal .d-main:hover .d-nav{opacity:1;}
  #detailModal .d-nav:hover{background:rgba(0,0,0,.7);}
  #detailModal .d-nav.prev{left:14px;}
  #detailModal .d-nav.next{right:14px;}
  #detailModal .d-count{position:absolute;right:14px;bottom:12px;z-index:2;background:rgba(0,0,0,.55);color:#fff;font-size:13px;padding:3px 10px;border-radius:99px;}
  #detailModal .d-cap{position:absolute;left:14px;top:14px;z-index:2;background:var(--sheet);color:var(--pen);font-family:var(--f-pen);font-size:16px;font-weight:700;
    padding:4px 12px;border-radius:2px;max-width:calc(100% - 28px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:rotate(-1.5deg);
    box-shadow:0 2px 6px rgba(0,0,0,.35);}
  #detailModal .d-cap small{font-family:var(--f-print);font-size:13px;color:var(--print);font-weight:600;margin-left:8px;}
  #detailModal .d-thumbs{display:flex;gap:8px;padding:10px 12px;overflow-x:auto;flex-shrink:0;background:#2A2D26;}
  #detailModal .d-thumbs:empty{display:none;}
  #detailModal .d-thumbs button{flex:0 0 auto;width:56px;height:56px;min-height:0;border-radius:3px;overflow:hidden;border:2px solid transparent;
    padding:0;cursor:pointer;opacity:.55;background:#111;transition:opacity .15s,border-color .15s;}
  #detailModal .d-thumbs button:hover{opacity:.9;}
  #detailModal .d-thumbs button.on{border-color:#fff;opacity:1;}
  #detailModal .d-thumbs img{width:100%;height:100%;object-fit:cover;display:block;}
  #detailModal .modal-body{display:flex;flex-direction:column;min-height:0;overflow-y:auto;padding:30px 28px 22px;}
  #detailModal .modal-title{padding-right:44px;}
  #detailModal .modal-row{flex-wrap:wrap;row-gap:6px;}
  #detailModal .modal-actions{margin-top:auto;justify-content:flex-end;position:sticky;bottom:-22px;margin-bottom:-22px;padding:16px 0 22px;
    background:linear-gradient(to bottom, rgba(251,252,246,0), var(--sheet) 40%);}
  @media (max-width:860px){
    .modal-mask{padding:12px;}
    #detailModal{grid-template-columns:1fr;grid-template-rows:auto auto;height:auto;max-height:calc(100vh - 24px);overflow-y:auto;}
    #detailModal .d-main{flex:none;height:min(52vh,380px);}
    #detailModal .d-nav{opacity:1;}
    #detailModal .modal-body{overflow:visible;padding:22px 18px 20px;}
    #detailModal .modal-actions{bottom:-20px;margin-bottom:-20px;padding-bottom:20px;}
    #detailModal .modal-close{background:rgba(0,0,0,.5);color:#fff;}
  }

  /* ── 新增／編輯：填單 ── */
  .form-modal{background:var(--sheet);border-radius:4px;max-width:660px;width:100%;overflow:hidden;
    box-shadow:0 30px 70px -20px rgba(10,20,5,.6);animation:modalIn .26s cubic-bezier(.2,.8,.2,1);}
  .form-header{padding:18px 24px 12px;border-bottom:4px double var(--print);display:flex;align-items:center;justify-content:space-between;}
  .form-title{font-family:var(--f-print);font-size:28px;color:var(--print);font-weight:900;letter-spacing:.12em;}
  .form-header .modal-close{position:static;}

function requireToken(cb){ var t=getGHToken(); if(t){ cb(t); return; } showTokenModal(cb); }

/* ───── GitHub 同步設定 ───── */
const GH_OWNER='sumoai-boop', GH_REPO='sumoai-boop.github.io', GH_BRANCH='main', GH_TOKEN_KEY='gh_token_food';
const GH_DATA_PATH='food-data.json';
const STORE = 'sumoai_food_v2';

function showToast(msg,isErr){
  var t=document.getElementById('ghToast');
  if(!t){t=document.createElement('div');t.id='ghToast';t.style.cssText='position:fixed;bottom:80px;left:50%;transform:translateX(-50%);padding:10px 20px;border-radius:99px;font-size:13px;z-index:9999;font-family:monospace;pointer-events:none;transition:opacity 0.5s;';document.body.appendChild(t);}
  t.textContent=msg;t.style.background=isErr?'rgba(180,30,30,0.95)':'rgba(30,80,50,0.95)';t.style.color='#fff';t.style.opacity='1';
  clearTimeout(t._to);if(!isErr)t._to=setTimeout(()=>t.style.opacity='0',3000);
}
function getToken(){ return getGHToken(); }
window.clearGHToken=function(){localStorage.removeItem(GH_TOKEN_KEY);alert('Token 已清除');};

function loadFromGitHub(){
  requireToken(function(token){
  // 先從 localStorage 顯示，GitHub 回來再更新
  DATA=load(); refreshTypeList(); render();
  showToast('⏳ 同步雲端資料...',false);
  var api='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_DATA_PATH;
  fetch(api+'?ref='+GH_BRANCH+'&t='+Date.now(),{headers:{'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json'}})
    .then(r=>{
      if(!r.ok){
        if(r.status===401){localStorage.removeItem(SUMOAI_TOKEN_KEY);showToast('❌ Token 無效，請重新整理',true);}
        else if(r.status===404){showToast('（尚無雲端資料）',false);}
        else showToast('❌ 載入失敗('+r.status+')，使用本機資料',true);
        return null;
      }
      return r.json();
    })
    .then(fi=>{
      if(!fi||!fi.content){return;}
      try{
        var raw=atob(fi.content.split('\n').join(''));
        var arr=JSON.parse(decodeURIComponent(escape(raw)));
        if(Array.isArray(arr)&&arr.length>0){
          DATA=arr;localStorage.setItem(STORE,JSON.stringify(DATA));
          if(fi.sha) localStorage.setItem('gh_food_sha',fi.sha);
          showToast('✦ 食記已同步',false);refreshTypeList();render();
        }
      }catch(e){console.warn('解析失敗:',e);}
    }).catch(e=>{console.warn('載入失敗:',e);showToast('❌ 網路錯誤，使用本機資料',true);});
  }); // end requireToken
}

function load(){ try{ return JSON.parse(localStorage.getItem(STORE)||'[]'); }catch(e){return [];} }
function save(d){
  localStorage.setItem(STORE,JSON.stringify(d));
  pushToGitHub(d);
}

var _pushing=false;
async function pushToGitHub(data){
  if(_pushing){showToast('⏳ 推送中，請稍候...',false);return;}
  _pushing=true;
  try{
    var token=getToken();if(!token)return;
    var api='https://api.github.com/repos/'+GH_OWNER+'/'+GH_REPO+'/contents/'+GH_DATA_PATH;
    var hdrs={'Authorization':'token '+token,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'};
    showToast('⏳ 儲存至雲端...',false);
    var sha=localStorage.getItem('gh_food_sha')||null;
    if(!sha){
      var r=await fetch(api+'?ref='+GH_BRANCH,{headers:hdrs});
      if(r.status===404){ sha=null; }
      else if(r.ok){ var fi=await r.json(); sha=fi.sha||null; if(sha)localStorage.setItem('gh_food_sha',sha); }
    }
    var jsonStr=JSON.stringify(data,null,2);
    // 檢查大小
    var sizeKB=Math.round(new Blob([jsonStr]).size/1024);
    var encoded=btoa(unescape(encodeURIComponent(jsonStr)));
    var body={message:'更新食記 ('+sizeKB+'KB)',content:encoded,branch:GH_BRANCH};if(sha)body.sha=sha;
    var pr=await fetch(api,{method:'PUT',headers:hdrs,body:JSON.stringify(body)});
    if(!pr.ok){
      var e2=await pr.json();
      localStorage.removeItem('gh_food_sha');
      var msg=e2.message||pr.status;
      if(pr.status===422) msg='資料太大無法上傳（'+sizeKB+'KB），請減少照片';
      showToast('❌ 推送失敗：'+msg,true);
    } else {
      var prData=await pr.json();
      var ns=prData.content&&prData.content.sha;
      if(ns)localStorage.setItem('gh_food_sha',ns);else localStorage.removeItem('gh_food_sha');
      showToast('✦ 已同步至雲端（'+sizeKB+'KB）',false);
    }
  }catch(err){
    showToast('❌ 同步錯誤：'+err.message,true);
  }finally{_pushing=false;}
}

/* ───── 圖片壓縮（絕不卡死版）───── */
function compressImage(dataUrl,maxW,maxH,quality){
  return new Promise((resolve,reject)=>{
    let done=false;
    const finish=(fn,val)=>{ if(done) return; done=true; clearTimeout(timer); fn(val); };
    const timer=setTimeout(()=>finish(reject,new Error('圖片處理逾時（可能是不支援的格式）')),20000);
    const img=new Image();
    img.onload=()=>{
      try{
        let w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
        if(!w||!h) throw new Error('圖片尺寸讀取失敗');
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
        const canvas=document.createElement('canvas');
        canvas.width=w;canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        finish(resolve,canvas.toDataURL('image/jpeg',quality));
      }catch(err){ finish(reject,err); }
    };
    img.onerror=()=>finish(reject,new Error('圖片無法解碼'));
    img.src=dataUrl;
  });
}

/* ───── 統計頁：區域分析 ───── */
function extractDistrict(addr){
  if(!addr) return null;
  // 移除郵遞區號（3-6位數字開頭）
  const clean = addr.replace(/^\d+/, '');
  // 抓縣市後面的區/鄉/鎮
  const m = clean.match(/[縣市]([^\s縣市]+?[區鄉鎮])/);
  if(m) return m[1];
  // 沒有縣市前綴，直接抓 XX區
  const m2 = clean.match(/([^\s\d]{2,4}[區鄉鎮])/);
  return m2 ? m2[1] : null;
}

function renderStatsPage(){
  const container = document.getElementById('statsPage');

  // 區域統計
  const distMap={};
  DATA.forEach(r=>{
    const dist = extractDistrict(r.addr);
    if(!dist) return;
    if(!distMap[dist]) distMap[dist]={count:0,totalScore:0,scoredCount:0,totalSpend:0,spendCount:0,names:[]};
    distMap[dist].count++;
    distMap[dist].names.push(r.name1||r.name||'');
    if(r.score>0){ distMap[dist].totalScore+=r.score; distMap[dist].scoredCount++; }
    // 金額從 visitLog 加總
    if(r.visitLog&&r.visitLog.length>0){
      r.visitLog.forEach(v=>{ if(v.price!=null&&v.price!==''){distMap[dist].totalSpend+=Number(v.price);distMap[dist].spendCount++;} });
    } else if(r.price!=null&&r.price!==''){
      distMap[dist].totalSpend+=Number(r.price); distMap[dist].spendCount++;
    }
  });

  const dists = Object.entries(distMap).sort((a,b)=>b[1].count-a[1].count);
  const maxCount = dists[0]?.[1].count||1;

  const esc=x=>String(x==null?'':x).replace(/&/g,'&amp;').replace(/</g,'&lt;');
  let html=`<div class="rep-h"><h3>各區域去過的店</h3><span>${dists.length} 個區域</span></div>`;
  dists.forEach(([dist,d])=>{
    const pct = Math.max(4, Math.round(d.count/maxCount*100));
    const avgSpend = d.spendCount ? '$'+Math.round(d.totalSpend/d.spendCount).toLocaleString() : '—';
    html+=`<div class="rep-row">
        <div class="k">${esc(dist)}</div>
        <div class="rep-bar"><i style="width:${pct}%"></i><span>${esc(d.names.slice(0,3).join('、'))}${d.names.length>3?'…':''}</span></div>
        <div class="n">${d.count}<small>間</small></div>
        <div class="v">${avgSpend}<small>／次</small></div>
      </div>`;
  });
  if(dists.length===0){
    html=`<div class="rep-empty">還沒有可統計的地址。編輯食記填上地址，這裡就會依區域整理。</div>`;
  }
  container.innerHTML=html;
}

/* ───── 月報頁 ───── */
function renderMonthlyPage(){
  const container=document.getElementById('monthlyPage');
  const now=new Date();
  const currentYear=now.getFullYear();
  const startYear=2025;
  const years=[];
  for(let y=startYear;y<=currentYear;y++) years.push(y);

  const allMonthData={};
  years.forEach(y=>{
    allMonthData[y]=[];
    for(let m=1;m<=12;m++){
      allMonthData[y].push({label:m+'月',total:0,count:0});
    }
  });

  DATA.forEach(r=>{
    if(r.visitLog&&r.visitLog.length>0){
      r.visitLog.forEach(v=>{
        if(!v.date||v.price==null||v.price==='') return;
        const y=parseInt(v.date.slice(0,4)),m=parseInt(v.date.slice(5,7));
        if(allMonthData[y]&&allMonthData[y][m-1]){allMonthData[y][m-1].total+=Number(v.price);allMonthData[y][m-1].count++;}
      });
    } else if(r.date&&r.price!=null&&r.price!==''){
      const y=parseInt(r.date.slice(0,4)),m=parseInt(r.date.slice(5,7));
      if(allMonthData[y]&&allMonthData[y][m-1]){allMonthData[y][m-1].total+=Number(r.price);allMonthData[y][m-1].count++;}
    }
  });

  let html=`<div class="monthly">
    <div class="rep-h"><h3>每月花費</h3>
      <div class="rep-years">${years.map(y=>`<button type="button" class="yr-pill${y===currentYear?' on':''}" onclick="switchMonthYear(${y})" id="yearBtn${y}">${y}</button>`).join('')}</div>
    </div>
    <div id="monthlyChart"></div>
  </div>`;

  container.innerHTML=html;

  window.switchMonthYear=function(year){

      const b=document.getElementById('yearBtn'+y);
      if(b) b.classList.toggle('on', y===year);
    });

      const pct=m.total?Math.max(3,Math.round(m.total/maxTotal*100)):0;
      const top=m.total&&m.total===maxTotal;
      const label=m.total?'$'+m.total.toLocaleString():'—';

/* ───── 多張照片 + 裁切器 ───── */
let photosArr = [];       // [{dataUrl}]
let cropStates = [];      // 每張的裁切狀態
let currentCropIdx = -1;

const imgInput     = document.getElementById('imgInput');
const cropContainer= document.getElementById('cropContainer');
const cropViewport = document.getElementById('cropViewport');
const cropImg      = document.getElementById('cropImg');
const cropZoom     = document.getElementById('cropZoom');
const cropClearBtn = document.getElementById('cropClearBtn');

let cropState = {scale:1,x:0,y:0,dragging:false,lastX:0,lastY:0,naturalW:0,naturalH:0,vpW:0,vpH:0};

function clampCrop(){
  const s=cropState,iw=s.naturalW*s.scale,ih=s.naturalH*s.scale;
  if(iw>=s.vpW){ s.x=Math.min(0,Math.max(s.vpW-iw,s.x)); }
  else { s.x=(s.vpW-iw)/2; }
  if(ih>=s.vpH){ s.y=Math.min(0,Math.max(s.vpH-ih,s.y)); }
  else { s.y=(s.vpH-ih)/2; }
}
function applyCrop(){ cropImg.style.transform=`translate(${cropState.x}px,${cropState.y}px) scale(${cropState.scale})`; }

function saveCropState(idx){
  if(idx>=0&&idx<photosArr.length)
    cropStates[idx]={scale:cropState.scale,x:cropState.x,y:cropState.y};
}

function loadCropForIdx(idx){
  if(idx<0||idx>=photosArr.length){ cropContainer.style.display='none'; currentCropIdx=-1; return; }
  saveCropState(currentCropIdx);
  currentCropIdx=idx;
  cropContainer.style.display='flex';
  cropImg.style.transform='none';
  cropImg.onload=()=>{
    requestAnimationFrame(()=>{
      const s=cropState;
      s.naturalW=cropImg.naturalWidth; s.naturalH=cropImg.naturalHeight;
      s.vpW=cropViewport.offsetWidth;  s.vpH=cropViewport.offsetHeight;
      const init=()=>{
        if(cropStates[idx]){
          const sv=cropStates[idx]; s.scale=sv.scale; s.x=sv.x; s.y=sv.y;
        } else {
          // 預設：以實際像素1:1顯示，最大不超過 viewport
          const fitScale=Math.min(1, s.vpW/s.naturalW, s.vpH/s.naturalH);
          s.scale=fitScale;
          s.x=(s.vpW-s.naturalW*s.scale)/2;
          s.y=(s.vpH-s.naturalH*s.scale)/2;
        }
        const minScale=Math.min(s.vpW/s.naturalW, s.vpH/s.naturalH);
        cropZoom.min=Math.round(minScale*50);
        cropZoom.max=Math.round(minScale*300);
        cropZoom.value=Math.round(s.scale*100);
        clampCrop(); applyCrop();
      };
      if(!s.vpW||!s.vpH){ requestAnimationFrame(()=>{ s.vpW=cropViewport.offsetWidth; s.vpH=cropViewport.offsetHeight; init(); }); }
      else { init(); }
    });
  };
  cropImg.src=photosArr[idx].dataUrl;
}

function getCroppedDataUrl(maxW,maxH,quality){
  const s=cropState;
  if(!s.vpW||!s.vpH){ s.vpW=cropViewport.offsetWidth; s.vpH=cropViewport.offsetHeight; }
  const targetRatio=3/4;
  let srcW=s.naturalW, srcH=s.naturalH;
  if(srcW/srcH>targetRatio){ srcW=Math.round(srcH*targetRatio); }
  else { srcH=Math.round(srcW/targetRatio); }
  const centerX=(s.vpW/2-s.x)/s.scale;
  const centerY=(s.vpH/2-s.y)/s.scale;
  const srcX=Math.max(0,Math.min(s.naturalW-srcW,centerX-srcW/2));
  const srcY=Math.max(0,Math.min(s.naturalH-srcH,centerY-srcH/2));
  const outW=Math.min(srcW,maxW), outH=Math.min(srcH,maxH);
  const out=document.createElement('canvas');
  out.width=outW; out.height=outH;
  out.getContext('2d').drawImage(cropImg,srcX,srcY,srcW,srcH,0,0,outW,outH);
  return out.toDataURL('image/jpeg',quality);
}

/* ───── 照片解碼（含 iPhone HEIC 支援）───── */
// heic-to：基於 libheif 1.23（2025），支援新款 iPhone 的 HDR / 分塊 HEIC
const HEIC_CDNS = [
  'https://cdn.jsdelivr.net/npm/heic-to@1.5.2/dist/iife/heic-to.js',
  'https://unpkg.com/heic-to@1.5.2/dist/iife/heic-to.js'
];
let _heicLibLoading = null;
function _loadScriptOnce(src){
  return new Promise((resolve,reject)=>{
    const s=document.createElement('script');
    let done=false;
    const t=setTimeout(()=>{ if(!done){done=true; s.remove(); reject(new Error('逾時'));} },40000);
    s.src=src;
    s.onload=()=>{ if(done) return; done=true; clearTimeout(t);
      window.HeicTo ? resolve() : reject(new Error('載入後找不到元件')); };
    s.onerror=()=>{ if(done) return; done=true; clearTimeout(t); s.remove(); reject(new Error('下載失敗')); };
    document.head.appendChild(s);
  });
}
function loadHeicLib(){
  if(window.HeicTo) return Promise.resolve();
  if(_heicLibLoading) return _heicLibLoading;
  _heicLibLoading = (async()=>{
    for(const url of HEIC_CDNS){
      try{ await _loadScriptOnce(url); return; }
      catch(err){ console.warn('[HEIC 元件] 來源失敗:', url, err.message); }
    }
    _heicLibLoading = null; // 允許下次重試
    throw new Error('轉檔元件無法下載（網路或防火牆阻擋）');
  })();
  return _heicLibLoading;
}

// 用檔案開頭的 magic bytes 判斷（比副檔名可靠，能抓到被改名成 .jpg 的 HEIC）
async function sniffHeic(file){
  try{
    const buf = new Uint8Array(await file.slice(0,32).arrayBuffer());
    if(buf.length<12) return false;
    // ISO BMFF: [size][ftyp][brand]
    if(!(buf[4]===0x66&&buf[5]===0x74&&buf[6]===0x79&&buf[7]===0x70)) return false;
    let s=''; for(let i=8;i<Math.min(buf.length,28);i++) s+=String.fromCharCode(buf[i]);
    return /heic|heix|hevc|hevx|heim|heis|hevm|hevs|mif1|msf1|avif/i.test(s);
  }catch(e){ return false; }
}

// 嘗試用瀏覽器原生能力把 Blob 解成 JPEG dataURL（Safari 原生支援 HEIC）
function blobToJpegNative(blob){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(blob);
    let done=false;
    const finish=(fn,val)=>{ if(done) return; done=true; clearTimeout(timer); URL.revokeObjectURL(url); fn(val); };
    const timer=setTimeout(()=>finish(reject,new Error('原生解碼逾時')),15000);
    const img=new Image();
    img.onload=()=>{
      try{
        const w=img.naturalWidth, h=img.naturalHeight;
        if(!w||!h) throw new Error('尺寸為 0');
        const c=document.createElement('canvas');
        c.width=w; c.height=h;
        c.getContext('2d').drawImage(img,0,0);
        const out=c.toDataURL('image/jpeg',0.92);
        // 解碼失敗時 canvas 會是全白/極小，用長度粗略驗證
        if(!out || out.length<1000) throw new Error('解碼結果異常');
        finish(resolve,out);
      }catch(err){ finish(reject,err); }
    };
    img.onerror=()=>finish(reject,new Error('原生無法解碼'));
    img.src=url;
  });
}

// 主流程：原生解碼 → 失敗再用 heic-to → 一律輸出 JPEG dataURL
async function fileToDataUrl(file){
  // 1) 先試瀏覽器原生（JPG/PNG 走這條；iPhone / macOS Safari 的 HEIC 也走這條，免下載）
  try{
    return await blobToJpegNative(file);
  }catch(err){
    console.warn('[原生解碼失敗，改用轉檔]', file.name, err.message);
  }

  // 2) 原生失敗：確認是不是 HEIC/HEIF
  const isH = await sniffHeic(file);
  if(!isH){
    throw new Error('不支援的圖片格式（'+(file.type||file.name||'未知')+'）');
  }

  // 3) 用 libheif 轉檔
  showToast('⏳ 轉換 iPhone 照片中…（首次需下載元件）', false);
  await loadHeicLib();
  let blob;
  try{
    blob = await window.HeicTo({blob:file, type:'image/jpeg', quality:0.92});
  }catch(err){
    console.error('[HeicTo 轉檔失敗]', err);
    throw new Error('HEIC 解碼失敗，建議改用 JPG（iPhone：設定→相機→格式→最相容）');
  }
  if(!blob || !blob.size) throw new Error('HEIC 轉檔結果為空');
  return await blobToJpegNative(blob);
}

// crop drag mouse
cropViewport.addEventListener('mousedown',e=>{cropState.dragging=true;cropState.lastX=e.clientX;cropState.lastY=e.clientY;cropViewport.style.cursor='grabbing';e.preventDefault();});
window.addEventListener('mousemove',e=>{if(!cropState.dragging)return;cropState.x+=e.clientX-cropState.lastX;cropState.y+=e.clientY-cropState.lastY;cropState.lastX=e.clientX;cropState.lastY=e.clientY;clampCrop();applyCrop();});
window.addEventListener('mouseup',()=>{cropState.dragging=false;cropViewport.style.cursor='grab';});
// touch
cropViewport.addEventListener('touchstart',e=>{if(e.touches.length===1){cropState.dragging=true;cropState.lastX=e.touches[0].clientX;cropState.lastY=e.touches[0].clientY;}},{passive:true});
cropViewport.addEventListener('touchmove',e=>{if(!cropState.dragging||e.touches.length!==1)return;cropState.x+=e.touches[0].clientX-cropState.lastX;cropState.y+=e.touches[0].clientY-cropState.lastY;cropState.lastX=e.touches[0].clientX;cropState.lastY=e.touches[0].clientY;clampCrop();applyCrop();e.preventDefault();},{passive:false});
cropViewport.addEventListener('touchend',()=>{cropState.dragging=false;});
// wheel
cropViewport.addEventListener('wheel',e=>{
  e.preventDefault();
  const s=cropState,delta=e.deltaY>0?-0.05:0.05;
  const minS=parseInt(cropZoom.min)/100,maxS=parseInt(cropZoom.max)/100;
  const ns=Math.min(maxS,Math.max(minS,s.scale+delta*s.scale));
  const rect=cropViewport.getBoundingClientRect();
  const cx=e.clientX-rect.left,cy=e.clientY-rect.top;
  const ratio=ns/s.scale;
  s.x=cx-(cx-s.x)*ratio; s.y=cy-(cy-s.y)*ratio; s.scale=ns;
  cropZoom.value=Math.round(ns*100);clampCrop();applyCrop();
},{passive:false});
// zoom slider
cropZoom.addEventListener('input',()=>{
  const s=cropState,ns=parseInt(cropZoom.value)/100;
  const cx=s.vpW/2,cy=s.vpH/2,ratio=ns/s.scale;
  s.x=cx-(cx-s.x)*ratio; s.y=cy-(cy-s.y)*ratio; s.scale=ns;
  clampCrop();applyCrop();
});

  inp.type='file'; inp.multiple=true; inp.accept='image/*,.heic,.heif,.HEIC,.HEIF'; inp.style.display='none';
  inp.addEventListener('change', async ()=>{
    const files=[...inp.files]; inp.value='';
    if(!files.length) return;
    let ok=0; const errs=[];
    for(const file of files){
      try{ row._photos.push({dataUrl: await fileToDataUrl(file), url:null}); ok++; renderVisitPhotos(row); }
      catch(err){ console.error('[照片處理失敗]', file.name, err); errs.push((file.name||'照片')+'：'+(err&&err.message?err.message:'未知錯誤')); }
    }
    if(errs.length) showToast('❌ '+errs[0], true);
    else if(ok) showToast('✦ 這筆記錄已加入 '+ok+' 張照片', false);
  });
  row._fileInput=inp;
  row.appendChild(inp);
  renderVisitPhotos(row);
  return row;
}

  const price=sortedLog[0]?.price||0;

  const pricedLog=visitLog.filter(v=>v.price!=null && v.price!=='');
  const avgPrice=pricedLog.length?Math.round(pricedLog.reduce((s,v)=>s+Number(v.price),0)/pricedLog.length):price;

  // 店家評分 = 各筆評分平均（若無任一筆評分，回退用表單上的手動評分）
  const scoredLog=visitLog.filter(v=>v.score!=null && v.score!=='' && !isNaN(v.score));
  let sv;
  if(scoredLog.length){
    sv = Math.round(scoredLog.reduce((s,v)=>s+Number(v.score),0)/scoredLog.length*10)/10;
  } else {

  }

  saveCropState(currentCropIdx);
  const snapshotPhotos=[...photosArr];

    + visitLog.reduce((n,v)=>n+(v._photos||[]).filter(p=>!p.url).length,0);

    const out=[];

      if(p.url){ out.push(p.url); continue; }
      showToast('⏳ 上傳照片中… '+(_uploaded+1)+'/'+_allNew, false);
      const compressed = await compressImage(p.dataUrl, 1200, 1600, 0.82);

      p.url = url;   // 避免重試時重複上傳
      out.push(url); _uploaded++;
    }
    return out;
  };
  let imgs;
  try{
    imgs = await uploadList(snapshotPhotos);
    for(const v of visitLog){
      const urls = await uploadList(v._photos||[]);
      delete v._photos;
      if(urls.length) v.imgs = urls;
    }

    console.error('[上傳失敗]', err);

  } else {
    DATA.unshift({id:Date.now()+'',name,name1,name2,type,meal,price:avgPrice,visits,gscore,addr,note,maps,date,score:starVal,visitLog,imgs,img,createdAt:Date.now()});
  }

  save(DATA); closeForm(); closeDetail(); render();
});

function starsHTMLDecimal(score){
  let h='';
  for(let i=1;i<=5;i++){
    const fill=Math.min(1,Math.max(0,score-(i-1)));
    const pct=Math.round(fill*100);
    h+=`<span style="position:relative;display:inline-block;font-size:24px;line-height:1;width:24px;color:var(--pen);" aria-hidden="true">
      <span style="opacity:0.18;">★</span>
      <span style="position:absolute;left:0;top:0;clip-path:inset(0 ${100-pct}% 0 0);">★</span>
    </span>`;
  }
  return h;
}

/* ───── 圖片延遲載入器 ───── */
let _imgObserver = null;
function initImgObserver(){
  if(_imgObserver) _imgObserver.disconnect();
  _imgObserver = new IntersectionObserver((entries)=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const img = e.target;
        if(img.dataset.src){
          img.src = img.dataset.src;
          delete img.dataset.src;
        }
        _imgObserver.unobserve(img);
      }
    });
  }, {rootMargin:'400px 0px'});
}

        const bottom = document.createElement('div');

      } else {

      card.tabIndex=0; card.setAttribute('role','button'); card.setAttribute('aria-label',(item.name1||item.name||'')+' 詳情');
      card.addEventListener('click',()=>openDetail(item, ctxDate));
      card.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); openDetail(item, ctxDate); } });
      return card;
}

/* ───── 取出一間店的所有造訪（日期正規化成 YYYY-MM-DD）───── */
function foodVisitsOf(item){
  const raw = (item.visitLog && item.visitLog.length) ? item.visitLog
            : (item.date ? [{date:item.date, price:item.price}] : []);
  return raw.map(v=>({...v, date:String(v.date||'').trim().replace(/\//g,'-')}))
            .filter(v=>/^\d{4}-\d{2}/.test(v.date));
}

/* ───── 某次造訪要顯示的照片：自己的 → 往前最近一筆有照片的 → 店家照片 → 之後的記錄 ───── */
function storeImgsOf(item){ return (item.imgs&&item.imgs.length)?item.imgs:(item.img?[item.img]:[]); }
function photosForVisit(item, date){
  const vs=foodVisitsOf(item).sort((a,b)=>a.date.localeCompare(b.date));
  const d=date||'9999-99-99';
  let own=null, prev=null;
  for(const v of vs){
    if(!(v.imgs&&v.imgs.length)) continue;
    if(v.date===d && !own) own=v;
    if(v.date<=d) prev=v;
  }
  if(own) return {imgs:own.imgs, own:true, from:own.date};
  if(prev) return {imgs:prev.imgs, own:false, from:prev.date};
  const st=storeImgsOf(item);
  if(st.length) return {imgs:st, own:false, from:'store'};
  const later=vs.find(v=>v.imgs&&v.imgs.length&&v.date>d);
  if(later) return {imgs:later.imgs, own:false, from:later.date};
  return {imgs:[], own:false, from:null};
}

function render(){
  let d=DATA.filter(r=>{
    if(typeFilterSet.size>0 && !typeFilterSet.has(r.type)) return false;
    if(!q) return true;
    return r.name.includes(q)||(r.name1||'').includes(q)||(r.name2||'').includes(q)||(r.addr||'').includes(q)||(r.note||'').includes(q);
  });
  if(sortKey==='score-desc') d.sort((a,b)=>b.score-a.score);
  else if(sortKey==='score-asc') d.sort((a,b)=>a.score-b.score);
  else if(sortKey==='price-desc') d.sort((a,b)=>(b.price||0)-(a.price||0));
  else if(sortKey==='price-asc') d.sort((a,b)=>(a.price||99999)-(b.price||99999));
  else if(sortKey==='date-asc') d.sort((a,b)=>(a.date||'').localeCompare(b.date||''));
  else if(sortKey==='new') d.sort((a,b)=>b.createdAt-a.createdAt);
  else d.sort((a,b)=>(b.date||'').localeCompare(a.date||'')); // date-desc default

  document.getElementById('countBadge').textContent=d.length+' 家';
  const grid=document.getElementById('photoGrid');
  grid.innerHTML='';
  initImgObserver();

  if(d.length===0){
    const empty=document.createElement('div');
    empty.className='empty-state';
    empty.innerHTML=`<div class="empty-icon">🧾</div><div class="empty-text">${(q||typeFilterSet.size)?'沒有符合的店，換個關鍵字或類型試試。':'還沒有食記。按「新增食記」記下第一家店。'}</div>`;
    grid.appendChild(empty);
  } else {
    const _frag = document.createDocumentFragment();
    const addCards=(container,items)=>{
      items.forEach(it=>{
        const card=it&&it.item ? buildCard(it.item, it.date) : buildCard(it);
        container.appendChild(card);
        const _im=card.querySelector('img[data-src]');
        if(_im && _imgObserver) _imgObserver.observe(_im);
      });
    };
    const byMonth = (sortKey==='date-desc' || sortKey==='date-asc');
    if(!byMonth){
      // 依評分／金額／新增順序排序時，不分月份
      const g=document.createElement('div'); g.className='photo-grid';
      addCards(g,d); _frag.appendChild(g);
    } else {
      // 依「造訪」分月：同一間店在不同月份去過，每個月都會出現
      const asc = sortKey==='date-asc';
      const months={}, noDate=[];
      d.forEach(item=>{
        const vs=foodVisitsOf(item);
        if(!vs.length){ noDate.push(item); return; }
        vs.forEach(v=>{
          const ym=v.date.slice(0,7);
          const g=months[ym]||(months[ym]={stores:new Map(),total:0,visits:0});
          g.visits++;
          if(v.price!=null && v.price!=='') g.total+=Number(v.price)||0;
          const s=g.stores.get(item);
          if(!s) g.stores.set(item,{item,last:v.date});
          else if(v.date>s.last) s.last=v.date;
        });
      });
      // ── 年份切換：一次只顯示一年 ──
      const yearStat={};
      Object.keys(months).forEach(ym=>{
        const y=ym.slice(0,4), g=months[ym];
        const ys=yearStat[y]||(yearStat[y]={stores:new Set(),visits:0,total:0});
        ys.visits+=g.visits; ys.total+=g.total; g.stores.forEach((_,it)=>ys.stores.add(it));
      });
      const years=Object.keys(yearStat).sort().reverse();
      const tabs=years.slice(); if(noDate.length) tabs.push('nodate');
      if(!tabs.includes(foodYear)) foodYear=tabs[0]||null;
      if(tabs.length){
        const bar=document.createElement('div'); bar.className='yr-bar';
        const pills=document.createElement('div'); pills.className='yr-pills';
        tabs.forEach(y=>{
          const b=document.createElement('button'); b.type='button';
          b.className='yr-pill'+(y===foodYear?' on':'');
          b.textContent=y==='nodate'?'未記日期':y;
          b.onclick=()=>{ if(foodYear===y) return; foodYear=y; render();
            const gb=document.getElementById('photoGrid'); const top=gb.getBoundingClientRect().top+window.scrollY-40;
            if(window.scrollY>top) window.scrollTo({top,behavior:'smooth'}); };
          pills.appendChild(b);
        });
        bar.appendChild(pills);
        if(foodYear!=='nodate' && yearStat[foodYear]){
          const ys=yearStat[foodYear];
          const sum=document.createElement('div'); sum.className='yr-sum';
          sum.innerHTML='<span class="meta">'+ys.stores.size+' 間，'+ys.visits+' 次</span><span class="t"><small>年度合計</small>$'+ys.total.toLocaleString()+'</span>';
          bar.appendChild(sum);
        }
        _frag.appendChild(bar);
      }
      const keys=Object.keys(months).filter(ym=>ym.slice(0,4)===foodYear).sort();
      if(!asc) keys.reverse();
      const section=(ym,items,g)=>{
        const sec=document.createElement('section');
        sec.className='mon'+(ym?'':' nodate');
        const h=document.createElement('div'); h.className='mon-h';
        if(ym){
          sec.style.setProperty('--season', seasonColor(ym.slice(5,7)));
        h.innerHTML='<h2><span class="mn">'+(+ym.slice(5,7))+'</span> 月<small>'+ym.slice(0,4)+'</small></h2>'+
            '<div class="r"><span class="meta">'+items.length+' 間，'+g.visits+' 次</span>'+
            '<span class="t"><small>小計</small>$'+g.total.toLocaleString()+'</span></div>';
        } else {
          h.innerHTML='<h2>未記日期</h2><div class="r"><span class="meta">'+items.length+' 間</span></div>';
        }
        const grid=document.createElement('div'); grid.className='photo-grid';
        sec.appendChild(h); sec.appendChild(grid);
        addCards(grid,items);
        return sec;
      };
      keys.forEach(ym=>{
        const g=months[ym];
        const items=[...g.stores.values()]
          .sort((a,b)=>asc ? a.last.localeCompare(b.last) : b.last.localeCompare(a.last))
          .map(s=>({item:s.item, date:s.last}));
        _frag.appendChild(section(ym,items,g));
      });
      if(noDate.length && foodYear==='nodate') _frag.appendChild(section(null,noDate,null));
    }
    grid.appendChild(_frag);
  }

  // 統計（依篩選結果）
  document.getElementById('sTotal').textContent=d.length;
  if(d.length){
    const rated=d.filter(r=>r.score>0);
    document.getElementById('sAvg').textContent=rated.length?(rated.reduce((s,r)=>s+r.score,0)/rated.length).toFixed(1):'—';
    const grated=d.filter(r=>r.gscore>0);
    document.getElementById('sGAvg').textContent=grated.length?(grated.reduce((s,r)=>s+r.gscore,0)/grated.length).toFixed(1):'—';
    const totalVisits=d.reduce((s,r)=>s+(r.visits||1),0);
    document.getElementById('sTotalVisits').textContent=totalVisits;
    // 總消費：所有造訪記錄的金額加總
    let totalSpend=0, totalVisitCount=0;
    d.forEach(r=>{
      if(r.visitLog&&r.visitLog.length>0){
        r.visitLog.forEach(v=>{ if(v.price!=null && v.price!=='') { totalSpend+=Number(v.price); totalVisitCount++; } });
      } else if(r.price!=null && r.price!==''){
        totalSpend+=Number(r.price); totalVisitCount++;
      }
    });
    document.getElementById('sTotalSpend').textContent=totalSpend?'$'+totalSpend.toLocaleString():'—';
    document.getElementById('sAvgPrice').textContent=totalVisitCount?'$'+Math.round(totalSpend/totalVisitCount).toLocaleString():'—';
  } else {
    document.getElementById('sAvg').textContent='—';
    document.getElementById('sGAvg').textContent='—';
    document.getElementById('sTotalVisits').textContent='—';
    document.getElementById('sAvgPrice').textContent='—';
    document.getElementById('sTotalSpend').textContent='—';
  }
}

document.getElementById('searchInput').addEventListener('input', e=>{q=e.target.value; render();});
document.getElementById('sortSelect').addEventListener('change', e=>{sortKey=e.target.value; render();});
// 多選下拉開關
document.addEventListener('DOMContentLoaded',()=>{
  const btn=document.getElementById('typeFilterBtn');
  const dd=document.getElementById('typeFilterDropdown');
  if(btn&&dd){
    btn.addEventListener('click',e=>{ e.stopPropagation(); dd.style.display=dd.style.display==='none'?'block':'none'; btn.setAttribute('aria-expanded', dd.style.display==='block'); });
    document.addEventListener('click',()=>{ dd.style.display='none'; });
    dd.addEventListener('click',e=>e.stopPropagation());
  }
});
