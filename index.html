<!-- 桌布（日夜自動切換）-->
<img id="wallpaper" style="position:fixed;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;" alt="">
<script>
(function(){
  /* ── 每日自動更換桌布 ──────────────────────────────
     把桌布圖片放進 repo 的 wallpapers/ 資料夾（jpg / png / webp / avif），
     每天會自動輪換一張，不需要改這裡的程式。
     資料夾不存在或沒圖時，維持使用預設桌布。
     想改用線上每日圖源（完全不用自己準備圖）→ ONLINE_DAILY 改成 true。 */
  var REPO         = 'sumoai-boop/sumoai-boop.github.io';
  var DIR          = 'wallpapers';
  var DEFAULT_WALL = 'https://sumoai-boop.github.io/wallpaper-xp.jpg';
  var ONLINE_DAILY = false;
  function onlineSrc(day){ return 'https://picsum.photos/seed/'+day+'/2560/1440'; }

  var img = document.getElementById('wallpaper');
  var LIST_KEY = 'sumoai_wall_list', DAY_KEY = 'sumoai_wall_day';
  var list = null, listDay = null;

  function today(){
    var d = new Date();
    return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
  }
  function dayNum(){
    var d = new Date();
    return Math.floor(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/86400000);
  }
  /* 預先載入再淡入，避免換圖時閃一下 */
  function setSrc(u){
    if(!u || img.getAttribute('src') === u) return;
    var pre = new Image();
    pre.onload = function(){
      img.style.opacity = '0';
      setTimeout(function(){ img.src = u; img.style.opacity = '1'; }, 160);
    };
    pre.onerror = function(){ if(u !== DEFAULT_WALL) setSrc(DEFAULT_WALL); };
    pre.src = u;
  }
  function apply(){
    if(ONLINE_DAILY){ setSrc(onlineSrc(today())); return; }
    setSrc(list && list.length ? list[dayNum() % list.length] : DEFAULT_WALL);
  }

  try{
    var saved = JSON.parse(localStorage.getItem(LIST_KEY) || 'null');
    listDay = localStorage.getItem(DAY_KEY);
    if(saved && saved.length) list = saved;
  }catch(e){}
  apply();

  /* 一天只查一次資料夾內容，結果存在瀏覽器 */
  function refreshList(){
    var h = {'Accept':'application/vnd.github.v3+json'};
    try{ var tk = localStorage.getItem('sumoai_gh_token'); if(tk) h.Authorization = 'token '+tk; }catch(e){}
    fetch('https://api.github.com/repos/'+REPO+'/contents/'+DIR+'?t='+Date.now(), {headers:h})
      .then(function(r){ return r.ok ? r.json() : null; })
      .then(function(j){
        if(!Array.isArray(j)) return;
        var l = j.filter(function(x){ return x.type==='file' && /\.(jpe?g|png|webp|avif)$/i.test(x.name); })
                 .map(function(x){ return x.download_url; })
                 .sort();
        if(!l.length) return;
        list = l; listDay = today();
        try{
          localStorage.setItem(LIST_KEY, JSON.stringify(l));
          localStorage.setItem(DAY_KEY, listDay);
        }catch(e){}
        apply();
      })
      .catch(function(){});
  }
  if(!ONLINE_DAILY && listDay !== today()) refreshList();

  /* 每分鐘檢查一次，跨過午夜就換成今天那張 */
  setInterval(function(){
    if(!ONLINE_DAILY && listDay !== today()) refreshList();
    apply();
  }, 60000);
})();
</script>

<script>


function updateTime(){
  const now = new Date();
  const d = ['日','一','二','三','四','五','六'][now.getDay()];
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  document.getElementById('mbTime').textContent =
    `週${d} ${now.getMonth()+1}/${now.getDate()} ${h}:${m}`;
}
updateTime();
setInterval(updateTime, 10000);
</script>

<script>
/* ══════════ Dock → 首頁視窗 ══════════ */
(function(){
  const g=id=>document.getElementById(id);
  const win=g('osxWin'), bar=g('winBar'), frame=g('winFrame'),
        titleEl=g('winTitle'), load=g('winLoad'), grip=g('winGrip');
  const GEO='sumoai_win_geo';
  let cur='', maxed=false, pre=null;
  const mobile=()=>window.innerWidth<=768;
  /* 最大化時 Dock 滑下去，還原時升回來 */
  function setDock(show){
    const d=g('globalDock'); if(!d) return;
    d.classList.toggle('visible',!!show);
  }

  /* ── 幾何 ── */
  function defGeo(){
    if(mobile()) return {x:6,y:34,w:window.innerWidth-12,h:window.innerHeight-46};
    const w=Math.min(1180,Math.round(window.innerWidth*0.82));
    const hh=Math.min(760,Math.round(window.innerHeight*0.8));
    return {x:Math.round((window.innerWidth-w)/2),y:Math.max(34,Math.round((window.innerHeight-hh)/2)),w:w,h:hh};
  }
  function loadGeo(){
    if(mobile()) return defGeo();
    try{const s=JSON.parse(localStorage.getItem(GEO)); if(s&&s.w>320&&s.h>240) return s;}catch(e){}
    return defGeo();
  }
  function saveGeo(){
    if(maxed||mobile()) return;
    try{localStorage.setItem(GEO,JSON.stringify({x:win.offsetLeft,y:win.offsetTop,w:win.offsetWidth,h:win.offsetHeight}));}catch(e){}
  }
  function applyGeo(o){
    win.style.left=o.x+'px'; win.style.top=o.y+'px';
    win.style.width=o.w+'px'; win.style.height=o.h+'px';
  }

  /* ── 開窗 ── */
  function open(href,label){
    const same = (cur===href) && win.classList.contains('show');
    cur=href; titleEl.textContent=label||'';
    g('winExt').onclick=()=>window.open(href,'_blank');
    if(!same){ load.classList.remove('off'); frame.src=href; }
    if(!win.classList.contains('show')){
      applyGeo(loadGeo());
      win.classList.add('show');
      requestAnimationFrame(()=>win.classList.add('in'));
    }
    if(maxed){
      win.style.left='0px'; win.style.top='28px';
      win.style.width=window.innerWidth+'px'; win.style.height=(window.innerHeight-28)+'px';
      win.classList.add('max'); setDock(false);
    }
  }
  function close(){
    win.classList.remove('in'); setDock(true);
    setTimeout(()=>{ win.classList.remove('show'); frame.src='about:blank'; cur=''; },180);
  }
  function minimize(){ win.classList.remove('in'); setDock(true); setTimeout(()=>win.classList.remove('show'),180); }
  function toggleMax(){
    if(maxed){ applyGeo(pre||defGeo()); win.classList.remove('max'); maxed=false; setDock(true); }
    else{
      pre={x:win.offsetLeft,y:win.offsetTop,w:win.offsetWidth,h:win.offsetHeight};
      win.style.left='0px'; win.style.top='28px';
      win.style.width=window.innerWidth+'px'; win.style.height=(window.innerHeight-28)+'px';
      win.classList.add('max'); maxed=true; setDock(false);
    }
  }

  g('winClose').onclick=e=>{e.stopPropagation();close();};
  g('winMin').onclick  =e=>{e.stopPropagation();minimize();};
  g('winMax').onclick  =e=>{e.stopPropagation();toggleMax();};
  bar.addEventListener('dblclick',e=>{ if(!e.target.closest('.wl,.win-ext')) toggleMax(); });

  /* ── iframe 載入後隱藏子頁自己的選單列與 Dock ── */
  frame.addEventListener('load',()=>{
    load.classList.add('off');
    try{
      const d=frame.contentDocument; if(!d||!d.head) return;
      const s=d.createElement('style');
      s.textContent='.global-menubar,.menubar,.global-dock-wrap,.dock-trigger-zone{display:none!important}';
      d.head.appendChild(s);
      d.addEventListener('click',ev=>{
        const a=ev.target.closest&&ev.target.closest('a[href$="index.html"]');
        if(a){ ev.preventDefault(); close(); }
      });
    }catch(e){}
  });

  /* ── 拖曳 ── */
  let drag=null;
  bar.addEventListener('pointerdown',e=>{
    if(e.target.closest('.wl,.win-ext')||maxed) return;
    drag={sx:e.clientX,sy:e.clientY,ox:win.offsetLeft,oy:win.offsetTop};
    bar.setPointerCapture(e.pointerId);
  });
  bar.addEventListener('pointermove',e=>{
    if(!drag) return;
    let nx=drag.ox+(e.clientX-drag.sx), ny=drag.oy+(e.clientY-drag.sy);
    nx=Math.max(-win.offsetWidth+120,Math.min(window.innerWidth-120,nx));
    ny=Math.max(28,Math.min(window.innerHeight-46,ny));
    win.style.left=nx+'px'; win.style.top=ny+'px';
  });
  bar.addEventListener('pointerup',e=>{ if(drag){drag=null;saveGeo();} });

  /* ── 縮放 ── */
  let rz=null;
  grip.addEventListener('pointerdown',e=>{
    e.preventDefault();
    rz={sx:e.clientX,sy:e.clientY,w:win.offsetWidth,h:win.offsetHeight};
    grip.setPointerCapture(e.pointerId);
  });
  grip.addEventListener('pointermove',e=>{
    if(!rz) return;
    win.style.width =Math.max(360,rz.w+(e.clientX-rz.sx))+'px';
    win.style.height=Math.max(260,rz.h+(e.clientY-rz.sy))+'px';
  });
  grip.addEventListener('pointerup',()=>{ if(rz){rz=null;saveGeo();} });

  /* ── Dock 攔截（事件委派，之後新增圖示自動生效）── */
  document.addEventListener('click',e=>{
    const a=e.target.closest('.gd-item'); if(!a) return;
    const href=a.getAttribute('href')||'';
    if(!href||/^(https?:|mailto:|#)/.test(href)||a.target==='_blank') return;
    if(e.metaKey||e.ctrlKey||e.shiftKey||e.button!==0) return;   /* 保留另開分頁 */
    e.preventDefault();
    const lb=a.querySelector('.gd-label');
    open(href, lb?lb.textContent.trim():href.replace('.html',''));
  });

  window.addEventListener('resize',()=>{
    if(!win.classList.contains('show')) return;
    if(maxed){ win.style.width=window.innerWidth+'px'; win.style.height=(window.innerHeight-28)+'px'; return; }
    if(mobile()) applyGeo(defGeo());
  });
})();
</script>
